<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7A00FF"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>

    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="7"
        flood-color="#000000"
        flood-opacity="0.38"/>
    </filter>

  </defs>

  <rect
    width="1600"
    height="720"
    rx="40"
    fill="url(#bg)"/>

  <rect
    width="1600"
    height="720"
    rx="40"
    fill="url(#shine)"/>

  <g
    fill="#000000"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif">

    <!-- INTRODUCTION -->

    <text
      x="800"
      y="75"
      font-size="70"
      font-weight="900"
      letter-spacing="0.5"
      filter="url(#shadow)">
      Hey, this is Atul Pandey !!
    </text>

    <!-- INTEREST -->

    <text
      x="800"
      y="145"
      font-size="44"
      font-weight="800">
      My area of interest lies in
    </text>

    <text
      x="800"
      y="200"
      font-size="34"
      font-weight="800">
      Technology | Quantum Computing | Artificial Intelligence
    </text>

    <text
      x="800"
      y="255"
      font-size="34"
      font-weight="800">
      Cryptography | Cloud Computing | Cybersecurity
    </text>

    <!-- SEPARATOR -->

    <line
      x1="70"
      y1="290"
      x2="1530"
      y2="290"
      stroke="#000000"
      stroke-opacity="0.38"
      stroke-width="3"/>

    <!-- M.SC. -->

    <text
      x="800"
      y="345"
      font-size="32"
      font-weight="900">
      Master of Science in Artificial Intelligence and Cybersecurity
    </text>

    <text
      x="800"
      y="385"
      font-size="28"
      font-weight="700">
      Indian Institute of Technology, Patna
    </text>

    <!-- MBA -->

    <text
      x="800"
      y="455"
      font-size="34"
      font-weight="900">
      Master of Business Administration
    </text>

    <text
      x="800"
      y="495"
      font-size="28"
      font-weight="700">
      Indian Institute of Technology, Roorkee
    </text>

    <!-- MCA -->

    <text
      x="800"
      y="565"
      font-size="34"
      font-weight="900">
      Master of Computer Application
    </text>

    <text
      x="800"
      y="605"
      font-size="28"
      font-weight="700">
      Uttar Pradesh Rajarshi Tandon Open University, India
    </text>

  </g>

</svg>

name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  generate-profile:
    name: Generate GitHub Profile Dashboard
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests matplotlib numpy

      # ============================================================
      # 4. GENERATE DASHBOARD
      # ============================================================

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR
          MPLBACKEND: Agg
        shell: bash
        run: |

          set -Eeuo pipefail

          echo "============================================================"
          echo "GITHUB PROFILE DASHBOARD GENERATOR"
          echo "============================================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "User:       $GITHUB_USERNAME"
          echo "Python:     $(python --version)"
          echo "============================================================"
          echo ""

          # ----------------------------------------------------------
          # Create Python generator
          # ----------------------------------------------------------

          cat > generate_profile.py <<'PYTHON'

          import os
          import sys
          import math
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import requests
          import numpy as np

          import matplotlib
          matplotlib.use("Agg")

          import matplotlib.pyplot as plt

          from matplotlib.patches import FancyBboxPatch
          from matplotlib.patches import Rectangle
          from matplotlib.path import Path as MplPath
          from matplotlib.patches import PathPatch


          # ============================================================
          # CONFIGURATION
          # ============================================================

          USERNAME = os.environ.get(
              "GITHUB_USERNAME",
              "ATULPANDEYIITR",
          )

          TOKEN = os.environ.get(
              "GITHUB_TOKEN",
              "",
          )

          REST_URL = "https://api.github.com"

          GRAPHQL_URL = (
              "https://api.github.com/graphql"
          )

          OUTPUT_DIR = Path("assets")

          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True,
          )


          # ============================================================
          # COLORS
          # ============================================================

          ELECTRIC_BLUE = "#0057FF"
          ACID_GREEN = "#39FF14"
          ELECTRIC_VIOLET = "#8A2BE2"
          HOT_MAGENTA = "#FF007F"

          ICE_WHITE = "#E8F1FF"
          STEEL_GREY = "#7B8CA8"

          BLUE_LIGHT = "#3D7BFF"
          GREEN_LIGHT = "#7CFF5B"
          VIOLET_LIGHT = "#B266FF"
          MAGENTA_LIGHT = "#FF4DA6"

          DARK_CELL = "#25314A"


          # ============================================================
          # FONT SIZES
          # ============================================================

          TITLE_SIZE = 24
          SUBTITLE_SIZE = 15
          LABEL_SIZE = 14
          TICK_SIZE = 13
          VALUE_SIZE = 18
          LARGE_VALUE_SIZE = 24
          HUGE_VALUE_SIZE = 32
          LEGEND_SIZE = 13
          HEATMAP_SIZE = 12


          # ============================================================
          # MATPLOTLIB
          # ============================================================

          plt.rcParams.update({
              "font.family": "DejaVu Sans",
              "font.size": TICK_SIZE,
              "axes.titlesize": TITLE_SIZE,
              "axes.labelsize": LABEL_SIZE,
              "xtick.labelsize": TICK_SIZE,
              "ytick.labelsize": TICK_SIZE,
              "legend.fontsize": LEGEND_SIZE,
              "figure.dpi": 180,
              "savefig.dpi": 180,
              "axes.grid": False,
          })


          # ============================================================
          # API SESSION
          # ============================================================

          SESSION = requests.Session()

          SESSION.headers.update({
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ATULPANDEYIITR-GitHub-Profile-Dashboard",
          })


          # ============================================================
          # API HELPERS
          # ============================================================

          def rest_get(
              url,
              params=None,
          ):

              response = SESSION.get(
                  url,
                  params=params,
                  timeout=30,
              )

              if not response.ok:

                  print("")
                  print("GITHUB REST API ERROR")
                  print("---------------------")
                  print(
                      f"URL: {url}"
                  )
                  print(
                      f"HTTP: {response.status_code}"
                  )
                  print(
                      response.text[:5000]
                  )
                  print("")

                  response.raise_for_status()

              return response


          def rest_json(
              url,
              params=None,
          ):

              return rest_get(
                  url,
                  params,
              ).json()


          def graphql(
              query,
              variables,
          ):

              response = SESSION.post(
                  GRAPHQL_URL,
                  json={
                      "query": query,
                      "variables": variables,
                  },
                  timeout=30,
              )

              if not response.ok:

                  print("")
                  print("GITHUB GRAPHQL HTTP ERROR")
                  print("--------------------------")
                  print(
                      f"HTTP: {response.status_code}"
                  )
                  print(
                      response.text[:5000]
                  )
                  print("")

                  response.raise_for_status()

              payload = response.json()

              if payload.get("errors"):

                  print("")
                  print("GITHUB GRAPHQL API ERROR")
                  print("------------------------")

                  for error in payload["errors"]:

                      print(
                          error
                      )

                  print("")

                  raise RuntimeError(
                      "GitHub GraphQL returned errors."
                  )

              data = payload.get(
                  "data"
              )

              if not data:

                  raise RuntimeError(
                      "GitHub GraphQL returned no data."
                  )

              return data


          def safe_int(
              value,
          ):

              try:
                  return int(
                      value or 0
                  )
              except Exception:
                  return 0


          def fmt(
              value,
          ):

              return f"{safe_int(value):,}"


          # ============================================================
          # GRAPHQL CONTRIBUTION QUERY
          # ============================================================

          CONTRIBUTION_QUERY = """

          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {

            user(
              login: $login
            ) {

              contributionsCollection(
                from: $from,
                to: $to
              ) {

                totalContributions

                totalCommitContributions

                totalIssueContributions

                totalPullRequestContributions

                totalRepositoryContributions

                contributionCalendar {

                  totalContributions

                  weeks {

                    contributionDays {

                      contributionCount

                      date

                    }
                  }
                }
              }
            }
          }

          """


          # ============================================================
          # CONTRIBUTION FETCHER
          # ============================================================

          def get_contributions(
              start_datetime,
              end_datetime,
          ):

              data = graphql(
                  CONTRIBUTION_QUERY,
                  {
                      "login": USERNAME,
                      "from": start_datetime.isoformat(),
                      "to": end_datetime.isoformat(),
                  },
              )

              user = data.get(
                  "user"
              )

              if not user:

                  raise RuntimeError(
                      f"GitHub user '{USERNAME}' was not found."
                  )

              collection = user[
                  "contributionsCollection"
              ]

              days = {}

              calendar = collection.get(
                  "contributionCalendar",
                  {},
              )

              for week in calendar.get(
                  "weeks",
                  [],
              ):

                  for day in week.get(
                      "contributionDays",
                      [],
                  ):

                      date_string = day.get(
                          "date"
                      )

                      count = safe_int(
                          day.get(
                              "contributionCount"
                          )
                      )

                      if date_string:

                          days[
                              date_string
                          ] = count

              return {
                  "total": safe_int(
                      collection.get(
                          "totalContributions"
                      )
                  ),
                  "commits": safe_int(
                      collection.get(
                          "totalCommitContributions"
                      )
                  ),
                  "issues": safe_int(
                      collection.get(
                          "totalIssueContributions"
                      )
                  ),
                  "pull_requests": safe_int(
                      collection.get(
                          "totalPullRequestContributions"
                      )
                  ),
                  "repositories": safe_int(
                      collection.get(
                          "totalRepositoryContributions"
                      )
                  ),
                  "days": days,
              }


          # ============================================================
          # CURRENT DATE RANGE
          # ============================================================

          now = datetime.now(
              timezone.utc
          )

          today = now.date()

          first_day = (
              today
              - timedelta(
                  days=364
              )
          )

          start_datetime = datetime(
              first_day.year,
              first_day.month,
              first_day.day,
              tzinfo=timezone.utc,
          )


          # ============================================================
          # FETCH CURRENT 365 DAYS
          # ============================================================

          print(
              "Fetching GitHub contribution data..."
          )

          current = get_contributions(
              start_datetime,
              now,
          )

          print(
              f"Total contributions: "
              f"{fmt(current['total'])}"
          )

          print(
              f"Commits: "
              f"{fmt(current['commits'])}"
          )

          print(
              f"Pull requests: "
              f"{fmt(current['pull_requests'])}"
          )

          print(
              f"Issues: "
              f"{fmt(current['issues'])}"
          )


          # ============================================================
          # BUILD EXACT 365-DAY ARRAY
          # ============================================================

          dates = [
              first_day
              + timedelta(days=i)
              for i in range(365)
          ]


          daily = []

          for date in dates:

              key = date.isoformat()

              daily.append(
                  safe_int(
                      current["days"].get(
                          key,
                          0,
                      )
                  )
              )


          # ============================================================
          # MONTHLY DATA
          # ============================================================

          monthly = [
              0
              for _ in range(12)
          ]


          for date, value in zip(
              dates,
              daily,
          ):

              if date.year == today.year:

                  monthly[
                      date.month - 1
                  ] += value


          # ============================================================
          # WEEKDAY DATA
          # ============================================================

          weekdays = [
              0
              for _ in range(7)
          ]


          for date, value in zip(
              dates,
              daily,
          ):

              weekdays[
                  date.weekday()
              ] += value


          weekday_names = [
              "Mon",
              "Tue",
              "Wed",
              "Thu",
              "Fri",
              "Sat",
              "Sun",
          ]


          # ============================================================
          # STREAK CALCULATION
          # ============================================================

          active_days = sum(
              1
              for value in daily
              if value > 0
          )


          current_streak = 0

          streak_day = today

          if not current["days"].get(
              streak_day.isoformat(),
              0,
          ):

              streak_day -= timedelta(
                  days=1
              )


          while (
              streak_day >= first_day
              and current["days"].get(
                  streak_day.isoformat(),
                  0,
              ) > 0
          ):

              current_streak += 1

              streak_day -= timedelta(
                  days=1
              )


          longest_streak = 0
          running_streak = 0


          for value in daily:

              if value > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak,
                  )

              else:

                  running_streak = 0


          # ============================================================
          # PROFILE DATA
          # ============================================================

          print(
              "Fetching GitHub profile data..."
          )

          profile = rest_json(
              f"{REST_URL}/users/{USERNAME}"
          )


          followers = safe_int(
              profile.get(
                  "followers"
              )
          )

          following = safe_int(
              profile.get(
                  "following"
              )
          )

          public_repositories = safe_int(
              profile.get(
                  "public_repos"
              )
          )


          # ============================================================
          # REPOSITORIES WITH PAGINATION
          # ============================================================

          print(
              "Fetching repositories..."
          )

          repositories = []

          page = 1

          while True:

              response = rest_get(
                  f"{REST_URL}/users/{USERNAME}/repos",
                  params={
                      "per_page": 100,
                      "page": page,
                      "sort": "updated",
                      "direction": "desc",
                  },
              )

              batch = response.json()

              if not isinstance(
                  batch,
                  list,
              ):

                  break

              repositories.extend(
                  batch
              )

              if len(batch) < 100:

                  break

              page += 1

              if page > 10:

                  print(
                      "Repository pagination limit reached."
                  )

                  break


          print(
              f"Repositories loaded: "
              f"{len(repositories)}"
          )


          # ============================================================
          # REPOSITORY METRICS
          # ============================================================

          total_stars = sum(
              safe_int(
                  repository.get(
                      "stargazers_count"
                  )
              )
              for repository in repositories
          )


          total_forks = sum(
              safe_int(
                  repository.get(
                      "forks_count"
                  )
              )
              for repository in repositories
          )


          # ============================================================
          # LANGUAGE DATA
          #
          # Uses repository primary language instead of making
          # one API request per repository.
          # ============================================================

          language_counts = {}


          for repository in repositories:

              if repository.get(
                  "fork",
                  False,
              ):

                  continue

              language = repository.get(
                  "language"
              )

              if language:

                  language_counts[
                      language
                  ] = (
                      language_counts.get(
                          language,
                          0,
                      )
                      + 1
                  )


          if not language_counts:

              language_counts = {
                  "Python": 1,
              }


          # ============================================================
          # YEARLY DATA
          # ============================================================

          yearly = []


          for year in range(
              today.year - 3,
              today.year + 1,
          ):

              year_start = datetime(
                  year,
                  1,
                  1,
                  tzinfo=timezone.utc,
              )

              if year == today.year:

                  year_end = now

              else:

                  year_end = datetime(
                      year + 1,
                      1,
                      1,
                      tzinfo=timezone.utc,
                  ) - timedelta(
                      seconds=1
                  )

              try:

                  year_result = get_contributions(
                      year_start,
                      year_end,
                  )

                  yearly.append(
                      (
                          year,
                          year_result[
                              "total"
                          ],
                      )
                  )

              except Exception as error:

                  print(
                      f"WARNING: "
                      f"Year {year} could not be read."
                  )

                  print(
                      str(error)
                  )

                  yearly.append(
                      (
                          year,
                          0,
                      )
                  )


          # ============================================================
          # COMMON METRICS
          # ============================================================

          metric_names = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Repositories",
          ]


          metric_values = [
              current["commits"],
              current["pull_requests"],
              current["issues"],
              current["repositories"],
          ]


          metric_colors = [
              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
          ]


          # ============================================================
          # FIGURE HELPERS
          # ============================================================

          def save(
              figure,
              filename,
          ):

              output_path = (
                  OUTPUT_DIR
                  / filename
              )

              figure.patch.set_alpha(
                  0
              )

              figure.savefig(
                  output_path,
                  transparent=True,
                  dpi=180,
                  bbox_inches="tight",
                  pad_inches=0.25,
              )

              plt.close(
                  figure
              )

              print(
                  f"CREATED: "
                  f"{output_path}"
              )


          def style(
              axis,
          ):

              axis.set_facecolor(
                  "none"
              )

              for spine in axis.spines.values():

                  spine.set_visible(
                      False
                  )

              axis.tick_params(
                  colors=STEEL_GREY,
                  labelsize=TICK_SIZE,
                  length=0,
              )

              axis.grid(
                  False
              )


          def chart_title(
              axis,
              main,
              subtitle=None,
          ):

              axis.set_title(
                  main,
                  fontsize=TITLE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
                  pad=22,
              )

              if subtitle:

                  axis.text(
                      0.5,
                      1.015,
                      subtitle,
                      transform=axis.transAxes,
                      ha="center",
                      va="bottom",
                      fontsize=SUBTITLE_SIZE,
                      color=STEEL_GREY,
                  )


          # ============================================================
          # 1. BAR CHART
          # ============================================================

          figure, axis = plt.subplots(
              figsize=(12, 7)
          )

          positions = np.arange(
              len(metric_names)
          )

          bars = axis.bar(
              positions,
              metric_values,
              width=0.60,
              color=metric_colors,
          )

          chart_title(
              axis,
              "GITHUB CONTRIBUTION ACTIVITY",
              "Rolling 365-day activity",
          )

          axis.set_xticks(
              positions
          )

          axis.set_xticklabels(
              metric_names,
              fontsize=LABEL_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          style(
              axis
          )

          maximum = max(
              metric_values + [1]
          )

          for bar, value in zip(
              bars,
              metric_values,
          ):

              axis.text(
                  bar.get_x()
                  + bar.get_width() / 2,
                  bar.get_height()
                  + maximum * 0.035,
                  fmt(value),
                  ha="center",
                  va="bottom",
                  fontsize=LARGE_VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          axis.set_ylim(
              0,
              maximum * 1.25,
          )

          save(
              figure,
              "github-bar-chart.png",
          )


          # ============================================================
          # 2. LINE GRAPH
          # ============================================================

          figure, axis = plt.subplots(
              figsize=(12, 7)
          )

          month_positions = np.arange(
              1,
              13,
          )

          axis.plot(
              month_positions,
              monthly,
              color=ELECTRIC_BLUE,
              linewidth=4,
              marker="o",
              markersize=10,
          )

          chart_title(
              axis,
              "MONTHLY CONTRIBUTION MOMENTUM",
              "Current calendar year",
          )

          axis.set_xticks(
              month_positions
          )

          axis.set_xticklabels(
              [
                  "Jan",
                  "Feb",
                  "Mar",
                  "Apr",
                  "May",
                  "Jun",
                  "Jul",
                  "Aug",
                  "Sep",
                  "Oct",
                  "Nov",
                  "Dec",
              ],
              fontsize=LABEL_SIZE,
              color=ICE_WHITE,
          )

          style(
              axis
          )

          maximum = max(
              monthly + [1]
          )

          for x_position, value in zip(
              month_positions,
              monthly,
          ):

              axis.annotate(
                  fmt(value),
                  (
                      x_position,
                      value,
                  ),
                  xytext=(
                      0,
                      15,
                  ),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          axis.set_ylim(
              0,
              maximum * 1.30,
          )

          save(
              figure,
              "github-line-graph.png",
          )


          # ============================================================
          # 3. PIE CHART
          # ============================================================

          pie_values = np.array(
              metric_values,
              dtype=float,
          )

          if pie_values.sum() == 0:

              pie_values = np.ones(
                  len(metric_values)
              )


          figure, axis = plt.subplots(
              figsize=(10, 8)
          )

          wedges, _, percentage_text = axis.pie(
              pie_values,
              colors=metric_colors,
              startangle=90,
              autopct="%1.0f%%",
              pctdistance=0.68,
              wedgeprops={
                  "linewidth": 2,
                  "edgecolor": "none",
              },
          )


          for text in percentage_text:

              text.set_color(
                  ICE_WHITE
              )

              text.set_fontsize(
                  VALUE_SIZE
              )

              text.set_fontweight(
                  "bold"
              )


          axis.set_title(
              "ACTIVITY SIGNAL DISTRIBUTION",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=22,
          )


          legend = axis.legend(
              wedges,
              [
                  (
                      f"{name}: "
                      f"{fmt(value)}"
                  )
                  for name, value in zip(
                      metric_names,
                      metric_values,
                  )
              ],
              loc="lower center",
              bbox_to_anchor=(
                  0.5,
                  -0.12,
              ),
              ncol=2,
              frameon=False,
              fontsize=LEGEND_SIZE,
          )


          for text in legend.get_texts():

              text.set_color(
                  ICE_WHITE
              )


          save(
              figure,
              "github-pie-chart.png",
          )


          # ============================================================
          # 4. HISTOGRAM
          # ============================================================

          figure, axis = plt.subplots(
              figsize=(12, 7)
          )

          bin_count = max(
              5,
              min(
                  20,
                  int(
                      math.sqrt(
                          max(
                              len(daily),
                              1,
                          )
                      )
                  ),
              ),
          )

          axis.hist(
              daily,
              bins=bin_count,
              color=ELECTRIC_VIOLET,
              alpha=0.90,
              edgecolor="none",
          )

          chart_title(
              axis,
              "DAILY CONTRIBUTION DISTRIBUTION",
              "Frequency across 365 days",
          )

          axis.set_xlabel(
              "Daily contributions",
              fontsize=LABEL_SIZE,
              color=STEEL_GREY,
          )

          axis.set_ylabel(
              "Number of days",
              fontsize=LABEL_SIZE,
              color=STEEL_GREY,
          )

          style(
              axis
          )

          save(
              figure,
              "github-histogram.png",
          )


          # ============================================================
          # 5. SCATTER PLOT
          # ============================================================

          figure, axis = plt.subplots(
              figsize=(12, 7)
          )

          weekday_positions = np.arange(
              1,
              8,
          )

          bubble_sizes = [
              max(
                  150,
                  value * 10 + 150,
              )
              for value in weekdays
          ]

          axis.scatter(
              weekday_positions,
              weekdays,
              s=bubble_sizes,
              color=HOT_MAGENTA,
              alpha=0.85,
          )

          chart_title(
              axis,
              "WEEKDAY ACTIVITY PATTERN",
              "Contribution volume by weekday",
          )

          axis.set_xticks(
              weekday_positions
          )

          axis.set_xticklabels(
              weekday_names,
              fontsize=LABEL_SIZE,
              color=ICE_WHITE,
          )

          style(
              axis
          )

          maximum = max(
              weekdays + [1]
          )

          for x_position, value in zip(
              weekday_positions,
              weekdays,
          ):

              axis.annotate(
                  fmt(value),
                  (
                      x_position,
                      value,
                  ),
                  xytext=(
                      0,
                      16,
                  ),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          axis.set_ylim(
              0,
              maximum * 1.30,
          )

          save(
              figure,
              "github-scatter-plot.png",
          )


          # ============================================================
          # 6. BOX PLOT
          # ============================================================

          figure, axis = plt.subplots(
              figsize=(10, 7)
          )

          axis.boxplot(
              daily,
              patch_artist=True,
              widths=0.45,
              boxprops={
                  "facecolor": "none",
                  "edgecolor": ACID_GREEN,
                  "linewidth": 3,
              },
              whiskerprops={

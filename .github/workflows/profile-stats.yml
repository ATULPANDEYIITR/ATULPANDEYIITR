      - name: Add streak statistics to README
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -f "README.md" ]; then
            echo "README.md not found."
            exit 0
          fi

          if grep -q "assets/github-streak-statistics.png" README.md; then
            echo "Streak statistics chart is already in README.md."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")

          text = path.read_text(
              encoding="utf-8"
          )

          new_chart = """
          <p align="center">
            <img src="assets/github-streak-statistics.png" width="100%" />
          </p>
          """

          marker = (
              '<img src="assets/github-streak-system.png"'
          )

          marker_position = text.find(
              marker
          )

          if marker_position != -1:

              closing = text.find(
                  "</p>",
                  marker_position
              )

              if closing != -1:

                  closing += len("</p>")

                  text = (
                      text[:closing]
                      + "\n\n"
                      + new_chart.strip()
                      + text[closing:]
                  )

              else:
                  text += (
                      "\n\n"
                      + new_chart.strip()
                      + "\n"
                  )

          else:
              text += (
                  "\n\n"
                  + new_chart.strip()
                  + "\n"
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "README.md updated with "
              "streak statistics chart."
          )
          PY

      - name: Validate generated dashboard
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Validating required GitHub dashboard files..."

          EXPECTED_FILES=(
            "github-area-chart.png"
            "github-bar-chart.png"
            "github-box-plot.png"
            "github-bubble-chart.png"
            "github-developer-telemetry.png"
            "github-donut-chart.png"
            "github-funnel-chart.png"
            "github-heatmap.png"
            "github-histogram.png"
            "github-line-graph.png"
            "github-pie-chart.png"
            "github-radar-chart.png"
            "github-sankey-diagram.png"
            "github-scatter-plot.png"
            "github-streak-system.png"
            "github-treemap.png"
            "github-waterfall-chart.png"
            "github-streak-statistics.png"
          )

          FAILED=0

          for FILE in "${EXPECTED_FILES[@]}"; do

            PATH_TO_FILE="assets/$FILE"

            if [ ! -f "$PATH_TO_FILE" ]; then
              echo "MISSING: $PATH_TO_FILE"
              FAILED=1
              continue
            fi

            SIZE="$(stat -c%s "$PATH_TO_FILE")"

            if [ "$SIZE" -lt 1000 ]; then
              echo "TOO SMALL: $PATH_TO_FILE ($SIZE bytes)"
              FAILED=1
              continue
            fi

            echo "OK: $PATH_TO_FILE ($SIZE bytes)"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Dashboard validation FAILED."
            exit 1
          fi

          echo ""
          echo "Dashboard validation successful."
          echo ""

          echo "All PNG assets currently in assets/:"

          find assets \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            -print \
            | sort

      - name: Commit updated dashboard images and README
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.png README.md

          echo "Git status:"
          git status --short

          if git diff --cached --quiet; then
            echo "No dashboard changes detected."
            exit 0
          fi

          git commit \
            -m "Update GitHub profile dashboard"

          git push \
            origin \
            "HEAD:${DEFAULT_BRANCH}"
        ACID_GREEN,
        ELECTRIC_VIOLET,
        HOT_MAGENTA,
        BLUE_LIGHT,
        VIOLET_LIGHT,

    ]

    log_values = np.log1p(

        np.array(
            telemetry_values,
            dtype=float,
        )

    )

    telemetry_maximum = float(
        log_values.max()
    )

    if telemetry_maximum > 0:

        normalized = (
            log_values
            / telemetry_maximum
        )

    else:

        normalized = np.zeros(
            len(log_values)
        )

    figure, axis = create_figure(
        16,
        8,

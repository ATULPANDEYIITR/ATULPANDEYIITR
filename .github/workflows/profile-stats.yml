          # ============================================================

          matrix_repositories = sorted(
              repositories,
              key=lambda repo: (
                  repo["stargazers_count"],
                  repo["forks_count"],
                  repo["watchers_count"]
              ),
              reverse=True
          )

          matrix_repositories = (

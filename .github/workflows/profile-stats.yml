name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  generate-profile:
    name: Generate GitHub Profile Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      GITHUB_USERNAME: ATULPANDEYIITR
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$MPLCONFIGDIR"

          python -m pip install --upgrade pip
          python -m pip install requests matplotlib numpy

          echo "Python version:"
          python --version

          echo "Installed packages:"
          python -c "import requests, matplotlib, numpy; print('requests:', requests.__version__); print('matplotlib:', matplotlib.__version__); print('numpy:', numpy.__version__)"

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |
          set -Eeuo pipefail

          mkdir -p "$MPLCONFIGDIR"
          mkdir -p assets

          cat > generate_profile.py <<'PYTHON'
          import os
          import sys
          import traceback
          from datetime import datetime, timedelta, timezone

          import numpy as np
          import requests

          import matplotlib
          matplotlib.use("Agg")

          import matplotlib.pyplot as plt
          from matplotlib.patches import FancyArrowPatch, Circle, FancyBboxPatch
          from matplotlib.path import Path


          USERNAME = os.environ.get("GITHUB_USERNAME", "ATULPANDEYIITR")
          TOKEN = os.environ.get("GITHUB_TOKEN", "").strip()

          REST_URL = "https://api.github.com"
          GRAPHQL_URL = "https://api.github.com/graphql"

          OUTPUT_DIR = "assets"

          ELECTRIC_BLUE = "#0057FF"
          ACID_GREEN = "#39FF14"
          ELECTRIC_VIOLET = "#8A2BE2"
          HOT_MAGENTA = "#FF007F"

          ICE_WHITE = "#E8F1FF"
          STEEL_GREY = "#7B8CA8"
          BLUE_LIGHT = "#3D7BFF"
          GREEN_LIGHT = "#7CFF5B"
          VIOLET_LIGHT = "#B266FF"
          MAGENTA_LIGHT = "#FF4DA6"

          COLORS = [
              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
              BLUE_LIGHT,
              GREEN_LIGHT,
              VIOLET_LIGHT,
              MAGENTA_LIGHT,
          ]

          plt.rcParams.update({
              "font.family": "DejaVu Sans",
              "figure.dpi": 150,
              "savefig.dpi": 180,
              "axes.titleweight": "bold",
          })


          def fail(message):
              raise RuntimeError(message)


          def request_with_retry(method, url, **kwargs):
              headers = kwargs.pop("headers", {})

              headers.update({
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "GitHub-Profile-Dashboard",
              })

              if TOKEN:
                  headers["Authorization"] = f"Bearer {TOKEN}"

              last_error = None

              for attempt in range(4):
                  try:
                      response = requests.request(
                          method,
                          url,
                          headers=headers,
                          timeout=60,
                          **kwargs,
                      )

                      if response.status_code in {429, 500, 502, 503, 504}:
                          last_error = RuntimeError(
                              f"GitHub returned HTTP {response.status_code}"
                          )

                          if attempt < 3:
                              import time
                              time.sleep(2 ** attempt)
                              continue

                      response.raise_for_status()
                      return response

                  except requests.RequestException as exc:
                      last_error = exc

                      if attempt < 3:
                          import time
                          time.sleep(2 ** attempt)
                          continue

              raise RuntimeError(
                  f"GitHub API request failed after retries: {last_error}"
              )


          def graphql_request(query, variables):
              response = request_with_retry(
                  "POST",
                  GRAPHQL_URL,
                  json={
                      "query": query,
                      "variables": variables,
                  },
              )

              payload = response.json()

              if payload.get("errors"):
                  errors = []

                  for error in payload["errors"]:
                      message = error.get("message", "Unknown GraphQL error")
                      error_type = error.get("type", "")
                      errors.append(
                          f"{error_type}: {message}" if error_type else message
                      )

                  raise RuntimeError(
                      "GitHub GraphQL returned errors:\n"
                      + "\n".join(errors)
                  )

              if "data" not in payload:
                  raise RuntimeError(
                      "GitHub GraphQL response did not contain data."
                  )

              return payload["data"]


          def get_github_data():
              if not TOKEN:
                  fail(
                      "GITHUB_TOKEN is empty. "
                      "The GitHub Actions token was not provided."
                  )

              print(f"Collecting GitHub data for: {USERNAME}")

              query = """
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  login
                  name
                  followers {
                    totalCount
                  }
                  following {
                    totalCount
                  }
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalRepositoriesWithContributedCommits
                    restrictedContributionsCount
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
              """

              now = datetime.now(timezone.utc)
              start = now - timedelta(days=364)

              data = graphql_request(
                  query,
                  {
                      "login": USERNAME,
                      "from": start.isoformat(),
                      "to": now.isoformat(),
                  },
              )

              user = data.get("user")

              if not user:
                  fail(f"GitHub user '{USERNAME}' was not found.")

              contributions = user["contributionsCollection"]

              days = []

              for week in contributions["contributionCalendar"]["weeks"]:
                  for day in week["contributionDays"]:
                      days.append({
                          "date": day["date"],
                          "count": int(day["contributionCount"]),
                      })

              days.sort(key=lambda item: item["date"])

              cutoff = (datetime.now(timezone.utc).date() - timedelta(days=364))

              filtered_days = [
                  item
                  for item in days
                  if datetime.fromisoformat(item["date"]).date() >= cutoff
              ]

              while len(filtered_days) < 365:
                  missing = 365 - len(filtered_days)

                  if filtered_days:
                      first_date = datetime.fromisoformat(
                          filtered_days[0]["date"]
                      ).date()
                  else:
                      first_date = datetime.now(timezone.utc).date()

                  extra = []

                  for index in range(missing):
                      date_value = first_date - timedelta(days=missing - index)

                      extra.append({
                          "date": date_value.isoformat(),
                          "count": 0,
                      })

                  filtered_days = extra + filtered_days

              filtered_days = filtered_days[-365:]

              rest_user = request_with_retry(
                  "GET",
                  f"{REST_URL}/users/{USERNAME}",
              ).json()

              repos = []
              page = 1

              while True:
                  response = request_with_retry(
                      "GET",
                      f"{REST_URL}/users/{USERNAME}/repos",
                      params={
                          "per_page": 100,
                          "page": page,
                          "type": "owner",
                          "sort": "updated",
                      },
                  )

                  batch = response.json()

                  if not batch:
                      break

                  repos.extend(batch)

                  if len(batch) < 100:
                      break

                  page += 1

                  if page > 20:
                      break

              language_counts = {}

              for repo in repos:
                  language = repo.get("language")

                  if language:
                      language_counts[language] = (
                          language_counts.get(language, 0) + 1
                      )

              total_stars = sum(
                  int(repo.get("stargazers_count", 0))
                  for repo in repos
              )

              total_forks = sum(
                  int(repo.get("forks_count", 0))
                  for repo in repos
              )

              print(f"Repositories: {len(repos)}")
              print(f"Stars: {total_stars}")
              print(f"Forks: {total_forks}")
              print(
                  f"Total contributions: "
                  f"{contributions['contributionCalendar']['totalContributions']}"
              )

              return {
                  "name": user.get("name") or USERNAME,
                  "followers": int(
                      user.get("followers", {}).get("totalCount", 0)
                  ),
                  "following": int(
                      user.get("following", {}).get("totalCount", 0)
                  ),
                  "total_contributions": int(
                      contributions["contributionCalendar"]["totalContributions"]
                  ),
                  "commits": int(
                      contributions["totalCommitContributions"]
                  ),
                  "issues": int(
                      contributions["totalIssueContributions"]
                  ),
                  "pull_requests": int(
                      contributions["totalPullRequestContributions"]
                  ),
                  "contributed_repositories": int(
                      contributions["totalRepositoriesWithContributedCommits"]
                  ),
                  "restricted": int(
                      contributions["restrictedContributionsCount"]
                  ),
                  "days": filtered_days,
                  "repos": len(repos),
                  "stars": total_stars,
                  "forks": total_forks,
                  "languages": language_counts,
                  "public_repos": int(
                      rest_user.get("public_repos", len(repos))
                  ),
              }


          def save(fig, filename):
              path = os.path.join(OUTPUT_DIR, filename)

              fig.savefig(
                  path,
                  transparent=True,
                  bbox_inches="tight",
                  pad_inches=0.35,
              )

              plt.close(fig)

              print(f"Created: {path}")


          def base_figure(title, subtitle=None, width=16, height=8):
              fig = plt.figure(figsize=(width, height))
              ax = fig.add_axes([0.055, 0.16, 0.89, 0.70])

              ax.set_facecolor("none")

              for spine in ax.spines.values():
                  spine.set_visible(False)

              ax.tick_params(
                  colors=ICE_WHITE,
                  labelsize=16,
                  length=0,
              )

              ax.set_title(
                  title,
                  color=ELECTRIC_BLUE,
                  fontsize=29,
                  fontweight="bold",
                  pad=26,
              )

              if subtitle:
                  fig.text(
                      0.5,
                      0.055,
                      subtitle,
                      ha="center",
                      va="center",
                      color=STEEL_GREY,
                      fontsize=17,
                  )

              return fig, ax


          def add_value(ax, x, y, value, color=ICE_WHITE):
              ax.text(
                  x,
                  y,
                  f"{int(value):,}",
                  ha="center",
                  va="bottom",
                  fontsize=23,
                  fontweight="bold",
                  color=color,
              )


          def make_area_chart(days):
              values = np.array([d["count"] for d in days])

              fig, ax = base_figure(
                  "GITHUB CONTRIBUTION ACTIVITY",
                  "365-day contribution history",
              )

              x = np.arange(len(values))

              ax.fill_between(
                  x,
                  values,
                  alpha=0.20,
                  color=ELECTRIC_BLUE,
              )

              ax.plot(
                  x,
                  values,
                  linewidth=3.5,
                  color=ELECTRIC_BLUE,
              )

              ax.plot(
                  x,
                  values,
                  linewidth=1.2,
                  color=ACID_GREEN,
                  alpha=0.9,
              )

              ax.set_xlim(0, len(values) - 1)
              ax.set_ylabel(
                  "Contributions",
                  color=STEEL_GREY,
                  fontsize=17,
              )

              ax.set_xticks([])

              save(fig, "github-area-chart.png")


          def make_bar_chart(data):
              labels = [
                  "Commits",
                  "Pull Requests",
                  "Issues",
                  "Repositories",
                  "Stars",
                  "Forks",
              ]

              values = [
                  data["commits"],
                  data["pull_requests"],
                  data["issues"],
                  data["repos"],
                  data["stars"],
                  data["forks"],
              ]

              fig, ax = base_figure(
                  "GITHUB ACTIVITY METRICS",
                  "Key activity indicators",
              )

              x = np.arange(len(labels))

              bars = ax.bar(
                  x,
                  values,
                  width=0.62,
                  color=[
                      ELECTRIC_BLUE,
                      ACID_GREEN,
                      ELECTRIC_VIOLET,
                      HOT_MAGENTA,
                      BLUE_LIGHT,
                      VIOLET_LIGHT,
                  ],
                  edgecolor="none",
              )

              ax.set_xticks(x)
              ax.set_xticklabels(
                  labels,
                  fontsize=17,
                  color=ICE_WHITE,
              )

              ax.set_ylim(
                  0,
                  max(values + [1]) * 1.25,
              )

              for bar, value in zip(bars, values):
                  add_value(
                      ax,
                      bar.get_x() + bar.get_width() / 2,
                      bar.get_height(),
                      value,
                  )

              save(fig, "github-bar-chart.png")


          def make_box_plot(days):
              values = np.array([d["count"] for d in days])

              fig, ax = base_figure(
                  "CONTRIBUTION DISTRIBUTION",
                  "Daily contribution spread across 365 days",
              )

              result = ax.boxplot(
                  values,
                  vert=False,
                  patch_artist=True,
                  widths=0.42,
                  boxprops={
                      "facecolor": ELECTRIC_VIOLET,
                      "edgecolor": VIOLET_LIGHT,
                      "linewidth": 3,
                  },
                  medianprops={
                      "color": ACID_GREEN,
                      "linewidth": 4,
                  },
                  whiskerprops={
                      "color": ELECTRIC_BLUE,
                      "linewidth": 3,
                  },
                  capprops={
                      "color": ELECTRIC_BLUE,
                      "linewidth": 3,
                  },
                  flierprops={
                      "marker": "o",
                      "markerfacecolor": HOT_MAGENTA,
                      "markeredgecolor": HOT_MAGENTA,
                      "markersize": 8,
                  },
              )

              ax.set_yticks([1])
              ax.set_yticklabels(
                  ["Daily contributions"],
                  color=ICE_WHITE,
                  fontsize=18,
              )

              save(fig, "github-box-plot.png")


          def make_bubble_chart(data):
              labels = [
                  "Commits",
                  "PRs",
                  "Issues",
                  "Repos",
                  "Stars",
                  "Forks",
              ]

              values = np.array([
                  data["commits"],
                  data["pull_requests"],
                  data["issues"],
                  data["repos"],
                  data["stars"],
                  data["forks"],
              ], dtype=float)

              sizes = np.maximum(values, 1)
              sizes = 500 + (sizes / max(sizes)) * 5000

              fig, ax = base_figure(
                  "GITHUB ACTIVITY BUBBLE MAP",
                  "Relative scale of major GitHub metrics",
              )

              x = np.arange(len(labels))
              y = np.ones(len(labels))

              ax.scatter(
                  x,
                  y,
                  s=sizes,
                  c=COLORS[:len(labels)],
                  alpha=0.78,
                  edgecolors=ICE_WHITE,
                  linewidths=1.5,
              )

              for index, value in enumerate(values):
                  ax.text(
                      index,
                      1,
                      f"{int(value):,}",
                      ha="center",
                      va="center",
                      color=ICE_WHITE,
                      fontsize=19,
                      fontweight="bold",
                  )

              ax.set_xticks(x)
              ax.set_xticklabels(
                  labels,
                  color=ICE_WHITE,
                  fontsize=17,
              )

              ax.set_yticks([])
              ax.set_xlim(-0.8, len(labels) - 0.2)
              ax.set_ylim(0.35, 1.65)

              save(fig, "github-bubble-chart.png")


          def make_telemetry(data):
              metrics = {
                  "Contributions": data["total_contributions"],
                  "Commits": data["commits"],
                  "Pull Requests": data["pull_requests"],
                  "Issues": data["issues"],
                  "Repositories": data["repos"],
                  "Stars": data["stars"],
              }

              labels = list(metrics.keys())
              values = np.array(list(metrics.values()), dtype=float)

              max_value = max(values.max(), 1)

              fig, ax = base_figure(
                  "DEVELOPER TELEMETRY",
                  "Current GitHub activity signal",
              )

              normalized = values / max_value

              y = np.arange(len(labels))

              ax.barh(
                  y,
                  normalized,
                  height=0.58,
                  color=[
                      ELECTRIC_BLUE,
                      ACID_GREEN,
                      ELECTRIC_VIOLET,
                      HOT_MAGENTA,
                      BLUE_LIGHT,
                      VIOLET_LIGHT,
                  ],
              )

              ax.set_yticks(y)
              ax.set_yticklabels(
                  labels,
                  color=ICE_WHITE,
                  fontsize=18,
              )

              ax.set_xlim(0, 1.15)
              ax.set_xticks([])

              for index, value in enumerate(values):
                  ax.text(
                      min(value / max_value + 0.03, 1.04),
                      index,
                      f"{int(value):,}",
                      va="center",
                      color=ICE_WHITE,
                      fontsize=20,
                      fontweight="bold",
                  )

              ax.invert_yaxis()

              save(fig, "github-developer-telemetry.png")


          def make_donut(data):
              labels = [
                  "Commits",
                  "Pull Requests",
                  "Issues",
                  "Other",
              ]

              commits = data["commits"]
              prs = data["pull_requests"]
              issues = data["issues"]
              total = data["total_contributions"]

              other = max(total - commits - prs - issues, 0)

              values = np.array(
                  [commits, prs, issues, other],
                  dtype=float,
              )

              fig = plt.figure(figsize=(16, 8))
              ax = fig.add_axes([0.05, 0.10, 0.90, 0.80])

              ax.set_facecolor("none")
              ax.axis("equal")
              ax.axis("off")

              ax.set_title(
                  "CONTRIBUTION COMPOSITION",
                  color=ELECTRIC_BLUE,
                  fontsize=29,
                  fontweight="bold",
                  pad=25,
              )

              if values.sum() == 0:
                  ring = Circle(
                      (0, 0),
                      0.72,
                      fill=False,
                      edgecolor=STEEL_GREY,
                      linewidth=8,
                      alpha=0.35,
                  )
                  ax.add_patch(ring)

                  ax.text(
                      0,
                      0,
                      "0",
                      ha="center",
                      va="center",
                      fontsize=40,
                      fontweight="bold",
                      color=ICE_WHITE,
                  )
              else:
                  ax.pie(
                      values,
                      colors=[
                          ELECTRIC_BLUE,
                          ACID_GREEN,
                          ELECTRIC_VIOLET,
                          HOT_MAGENTA,
                      ],
                      startangle=90,
                      counterclock=False,
                      wedgeprops={
                          "width": 0.34,
                          "edgecolor": "none",
                      },
                  )

                  ax.text(
                      0,
                      0,
                      f"{total:,}",
                      ha="center",
                      va="center",
                      fontsize=40,
                      fontweight="bold",
                      color=ICE_WHITE,
                  )

              ax.legend(
                  labels,
                  loc="lower center",
                  bbox_to_anchor=(0.5, -0.08),
                  ncol=4,
                  frameon=False,
                  fontsize=17,
                  labelcolor=ICE_WHITE,
              )

              save(fig, "github-donut-chart.png")


          def make_funnel(data):
              labels = [
                  "Total Contributions",
                  "Commits",
                  "Pull Requests",
                  "Issues",
                  "Repositories",
              ]

              values = np.array([
                  data["total_contributions"],
                  data["commits"],
                  data["pull_requests"],
                  data["issues"],
                  data["repos"],
              ], dtype=float)

              values = np.maximum(values, 1)

              fig, ax = base_figure(
                  "GITHUB ACTIVITY FUNNEL",
                  "Relative contribution flow",
              )

              max_value = values.max()

              for index, (label, value) in enumerate(zip(labels, values)):
                  width = 0.28 + 0.65 * (value / max_value)

                  left = 0.5 - width / 2

                  rect = FancyBboxPatch(
                      (left, len(labels) - index - 1 - 0.36),
                      width,
                      0.72,
                      boxstyle="round,pad=0.02,rounding_size=0.04",
                      linewidth=0,
                      facecolor=COLORS[index],
                      alpha=0.88,
                  )

                  ax.add_patch(rect)

                  ax.text(
                      0.5,
                      len(labels) - index - 1,
                      f"{label}   {int(value):,}",
                      ha="center",
                      va="center",
                      fontsize=20,
                      fontweight="bold",
                      color=ICE_WHITE,
                  )

              ax.set_xlim(0, 1)
              ax.set_ylim(-0.8, len(labels) - 0.1)
              ax.axis("off")

              save(fig, "github-funnel-chart.png")


          def make_heatmap(days):
              values = {
                  d["date"]: d["count"]
                  for d in days
              }

              start_date = datetime.fromisoformat(
                  days[0]["date"]
              ).date()

              end_date = datetime.fromisoformat(
                  days[-1]["date"]
              ).date()

              dates = []
              cursor = start_date

              while cursor <= end_date:
                  dates.append(cursor)
                  cursor += timedelta(days=1)

              matrix = np.zeros((7, 53), dtype=int)

              for date_value in dates:
                  index = (date_value - start_date).days
                  week = index // 7

                  if week >= 53:
                      continue

                  weekday = date_value.weekday()

                  matrix[weekday, week] = values.get(
                      date_value.isoformat(),
                      0,
                  )

              fig, ax = plt.subplots(figsize=(16, 8))

              fig.patch.set_alpha(0)
              ax.set_facecolor("none")

              ax.imshow(
                  matrix,
                  aspect="auto",
                  interpolation="nearest",
                  cmap="viridis",
              )

              ax.set_title(
                  "GITHUB CONTRIBUTION HEATMAP",
                  color=ELECTRIC_BLUE,
                  fontsize=29,
                  fontweight="bold",
                  pad=25,
              )

              ax.set_yticks(range(7))
              ax.set_yticklabels(
                  [
                      "Monday",
                      "Tuesday",
                      "Wednesday",
                      "Thursday",
                      "Friday",
                      "Saturday",
                      "Sunday",
                  ],
                  color=ICE_WHITE,
                  fontsize=16,
              )

              ax.set_xticks([])

              for spine in ax.spines.values():
                  spine.set_visible(False)

              ax.tick_params(length=0)

              save(fig, "github-heatmap.png")


          def make_histogram(days):
              values = np.array([d["count"] for d in days])

              fig, ax = base_figure(
                  "DAILY CONTRIBUTION SPREAD",
                  "Frequency of daily GitHub contributions",
              )

              ax.hist(
                  values,
                  bins=min(18, max(5, len(np.unique(values)))),
                  color=ELECTRIC_BLUE,
                  alpha=0.82,
                  edgecolor=ICE_WHITE,
                  linewidth=1,
              )

              ax.set_xlabel(
                  "Contributions per day",
                  color=STEEL_GREY,
                  fontsize=18,
              )

              ax.set_ylabel(
                  "Days",
                  color=STEEL_GREY,
                  fontsize=18,
              )

              save(fig, "github-histogram.png")


          def make_line_graph(days):
              values = np.array([d["count"] for d in days])

              window = 14

              if len(values) >= window:
                  moving = np.convolve(
                      values,
                      np.ones(window) / window,
                      mode="valid",
                  )
              else:
                  moving = values

              fig, ax = base_figure(
                  "CONTRIBUTION TREND",
                  "Daily activity with 14-day moving average",
              )

              x = np.arange(len(values))

              ax.plot(
                  x,
                  values,
                  color=ELECTRIC_BLUE,
                  linewidth=2,
                  alpha=0.45,
              )

              moving_x = np.arange(
                  window - 1,
                  window - 1 + len(moving),
              )

              ax.plot(
                  moving_x,
                  moving,
                  color=ACID_GREEN,
                  linewidth=4,
              )

              ax.set_xticks([])

              save(fig, "github-line-graph.png")


          def make_pie(data):
              labels = [
                  "Commits",
                  "Pull Requests",
                  "Issues",
                  "Other",
              ]

              values = np.array([
                  data["commits"],
                  data["pull_requests"],

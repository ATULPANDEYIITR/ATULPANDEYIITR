              "GITHUB\nACTIVITY",

              ha="center",

              va="center",

              fontsize=LARGE_VALUE_SIZE,

              fontweight="bold",

              color=ICE_WHITE,

          )


          for name, value, ypos, color in zip(

              source_names,

              source_values,

              source_y,

              source_colors,

          ):

              source_x = 0.05


              axis.add_patch(

                  FancyBboxPatch(

                      (

                          source_x,

                          ypos - 0.065,

                      ),

                      0.18,

                      0.13,

                      boxstyle="round,pad=0.02",

                      facecolor=color,

                      edgecolor="none",

                  )

              )


              axis.text(

                  source_x + 0.09,

                  ypos,

                  f"{name}\n{fmt(value)}",

                  ha="center",

                  va="center",

                  fontsize=LABEL_SIZE,

                  fontweight="bold",

                  color=ICE_WHITE,

              )


              line_width = (

                  2.5

                  + 10

                  * (
                      value
                      / source_maximum
                  )

              )


              arrow = FancyArrowPatch(

                  (

                      source_x + 0.18,

                      ypos,

                  ),

                  (

                      destination_x,

                      0.50,

                  ),

                  connectionstyle="arc3,rad=0.18",

                  arrowstyle="-",

                  linewidth=line_width,

                  color=color,

                  alpha=0.65,

              )


              axis.add_patch(
                  arrow
              )


          axis.text(

              0.50,

              0.08,

              "Contribution signals flowing into the GitHub activity system",

              ha="center",

              va="center",

              fontsize=SUBTITLE_SIZE,

              color=STEEL_GREY,

          )


          axis.set_title(

              "GITHUB ACTIVITY FLOW",

              fontsize=TITLE_SIZE,

              fontweight="bold",

              color=ICE_WHITE,

              pad=25,

          )


          save_figure(

              figure,

              "github-sankey-diagram.png",

          )


          # ============================================================
          # 16. FULL-WIDTH STREAK SYSTEM
          # ============================================================

          figure, axis = create_figure(
              16,
              7,
          )


          axis.axis("off")


          streak_cards = [

              (

                  "CURRENT STREAK",

                  current_streak,

                  ELECTRIC_BLUE,

              ),

              (

                  "LONGEST STREAK",

                  longest_streak,

                  ACID_GREEN,

              ),

              (

                  "ACTIVE DAYS",

                  active_days,

                  ELECTRIC_VIOLET,

              ),

          ]


          for index, (

              label,

              value,

              color,

          ) in enumerate(

              streak_cards

          ):

              x_position = (

                  0.05
                  + index * 0.315

              )


              axis.add_patch(

                  FancyBboxPatch(

                      (

                          x_position,

                          0.18,

                      ),

                      0.27,

                      0.60,

                      boxstyle="round,pad=0.025",

                      facecolor="none",

                      edgecolor=color,

                      linewidth=4,

                  )

              )


              axis.text(

                  x_position + 0.135,

                  0.61,

                  label,

                  ha="center",

                  va="center",

                  fontsize=LABEL_SIZE,

                  fontweight="bold",

                  color=STEEL_GREY,

              )


              axis.text(

                  x_position + 0.135,

                  0.38,

                  fmt(value),

                  ha="center",

                  va="center",

                  fontsize=HUGE_VALUE_SIZE,

                  fontweight="bold",

                  color=ICE_WHITE,

              )


          axis.set_title(

              "GITHUB STREAK SYSTEM",

              fontsize=TITLE_SIZE,

              fontweight="bold",

              color=ICE_WHITE,

              pad=25,

          )


          save_figure(

              figure,

              "github-streak-system.png",

          )


          # ============================================================
          # 17. FULL-WIDTH DEVELOPER TELEMETRY
          # ============================================================

          telemetry_names = [

              "TOTAL CONTRIBUTIONS",

              "COMMITS",

              "PULL REQUESTS",

              "ISSUES",

              "REPOSITORIES",

              "ACTIVE DAYS",

          ]


          telemetry_values = [

              current["total"],

              current["commits"],

              current["pull_requests"],

              current["issues"],

              len(owned_repositories),

              active_days,

          ]


          telemetry_colors = [

              ELECTRIC_BLUE,

              ACID_GREEN,

              ELECTRIC_VIOLET,

              HOT_MAGENTA,

              BLUE_LIGHT,

              VIOLET_LIGHT,

          ]


          log_values = np.log1p(

              np.array(

                  telemetry_values,

                  dtype=float,

              )

          )


          telemetry_maximum = float(

              log_values.max()

          )


          if telemetry_maximum > 0:

              normalized = (

                  log_values
                  / telemetry_maximum

              )

          else:

              normalized = np.zeros(

                  len(log_values)

              )


          figure, axis = create_figure()


          y_positions = np.arange(

              len(telemetry_names)

          )


          for index, (

              label,

              value,

              width,

              color,

          ) in enumerate(

              zip(

                  telemetry_names,

                  telemetry_values,

                  normalized,

                  telemetry_colors,

              )

          ):

              axis.barh(

                  index,

                  width,

                  height=0.52,

                  color=color,

              )


              axis.text(

                  0.01,

                  index,

                  label,

                  transform=axis.get_yaxis_transform(),

                  ha="left",

                  va="center",

                  fontsize=LABEL_SIZE,

                  fontweight="bold",

                  color=ICE_WHITE,

              )


              axis.text(

                  1.02,

                  index,

                  fmt(value),

                  transform=axis.get_yaxis_transform(),

                  ha="left",

                  va="center",

                  fontsize=LARGE_VALUE_SIZE,

                  fontweight="bold",

                  color=ICE_WHITE,

              )


          axis.set_xlim(

              0,

              1.20,

          )


          axis.set_yticks([])

          axis.set_xticks([])


          style_axis(
              axis
          )


          axis.invert_yaxis()


          axis.set_title(

              "DEVELOPER TELEMETRY",

              fontsize=TITLE_SIZE,

              fontweight="bold",

              color=ICE_WHITE,

              pad=25,

          )


          save_figure(

              figure,

              "github-developer-telemetry.png",

          )


          # ============================================================
          # FINAL IMAGE VALIDATION
          # ============================================================

          required_files = [

              "github-area-chart.png",

              "github-bar-chart.png",

              "github-box-plot.png",

              "github-bubble-chart.png",

              "github-developer-telemetry.png",

              "github-donut-chart.png",

              "github-funnel-chart.png",

              "github-heatmap.png",

              "github-histogram.png",

              "github-line-graph.png",

              "github-pie-chart.png",

              "github-radar-chart.png",

              "github-sankey-diagram.png",

              "github-scatter-plot.png",

              "github-streak-system.png",

              "github-treemap.png",

              "github-waterfall-chart.png",

          ]


          print("")
          print("=" * 75)
          print("VALIDATING DASHBOARD IMAGES")
          print("=" * 75)


          missing_files = []


          for filename in required_files:

              path = (

                  OUTPUT_DIR
                  / filename

              )


              if not path.is_file():

                  missing_files.append(
                      filename
                  )

                  continue


              size = path.stat().st_size


              if size <= 0:

                  missing_files.append(
                      filename
                  )

                  continue


              print(

                  f"OK  "
                  f"{filename:<42}"
                  f"{size:>12,} bytes"

              )


          if missing_files:

              print("")

              print(
                  "ERROR: Missing or empty images:"
              )

              for filename in missing_files:

                  print(
                      f" - {filename}"
                  )

              raise RuntimeError(
                  "Dashboard image validation failed."
              )


          print("")
          print(
              f"SUCCESS: "
              f"{len(required_files)} images generated."
          )


          # ============================================================
          # FINAL SUMMARY
          # ============================================================

          print("")
          print("=" * 75)
          print("GITHUB PROFILE DASHBOARD COMPLETE")
          print("=" * 75)

          print(
              f"User:             {USERNAME}"
          )

          print(
              f"Contributions:    "
              f"{fmt(current['total'])}"
          )

          print(
              f"Commits:          "
              f"{fmt(current['commits'])}"
          )

          print(
              f"Pull Requests:    "
              f"{fmt(current['pull_requests'])}"
          )

          print(
              f"Issues:           "
              f"{fmt(current['issues'])}"
          )

          print(
              f"Repositories:     "
              f"{fmt(len(owned_repositories))}"
          )

          print(
              f"Stars:            "
              f"{fmt(total_stars)}"
          )

          print(
              f"Forks:            "
              f"{fmt(total_forks)}"
          )

          print(
              f"Followers:        "
              f"{fmt(followers)}"
          )

          print(
              f"Following:        "
              f"{fmt(following)}"
          )

          print(
              f"Active Days:      "
              f"{fmt(active_days)}"
          )

          print(
              f"Current Streak:   "
              f"{fmt(current_streak)}"
          )

          print(
              f"Longest Streak:   "
              f"{fmt(longest_streak)}"
          )

          print("=" * 75)

          PYTHON


          # ========================================================
          # PYTHON SYNTAX CHECK
          # ========================================================

          echo ""
          echo "Checking Python syntax..."

          python -m py_compile generate_profile.py

          echo "Python syntax check: PASSED"


          # ========================================================
          # RUN GENERATOR
          # ========================================================

          echo ""
          echo "Generating dashboard images..."

          python generate_profile.py


          # ========================================================
          # FINAL SHELL VALIDATION
          # ========================================================

          echo ""
          echo "Running final image validation..."


          required_files=(

            "assets/github-area-chart.png"

            "assets/github-bar-chart.png"

            "assets/github-box-plot.png"

            "assets/github-bubble-chart.png"

            "assets/github-developer-telemetry.png"

            "assets/github-donut-chart.png"

            "assets/github-funnel-chart.png"

            "assets/github-heatmap.png"

            "assets/github-histogram.png"

            "assets/github-line-graph.png"

            "assets/github-pie-chart.png"

            "assets/github-radar-chart.png"

            "assets/github-sankey-diagram.png"

            "assets/github-scatter-plot.png"

            "assets/github-streak-system.png"

            "assets/github-treemap.png"

            "assets/github-waterfall-chart.png"

          )


          for file in "${required_files[@]}"; do

            if [ ! -s "$file" ]; then

              echo ""
              echo "ERROR: Missing or empty:"
              echo "$file"

              exit 1

            fi

            echo "VALID: $file"

          done


          echo ""
          echo "============================================================"
          echo "ALL 17 DASHBOARD IMAGES ARE VALID"
          echo "============================================================"


      # ============================================================
      # 5. COMMIT AND PUSH
      # ============================================================

      - name: Commit updated dashboard images

        shell: bash

        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

        run: |

          set -Eeuo pipefail


          echo ""
          echo "Preparing Git commit..."


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add assets/


          if git diff --cached --quiet; then

            echo ""
            echo "No dashboard image changes detected."

          else

            echo ""
            echo "Dashboard images changed."

            git status --short

            git commit \
              -m "Update GitHub activity dashboard"

            echo ""
            echo "Pushing dashboard images..."

            git push \
              origin \
              "HEAD:${DEFAULT_BRANCH}"

          fi


          echo ""
          echo "============================================================"
          echo "WORKFLOW COMPLETED SUCCESSFULLY"
          echo "============================================================"

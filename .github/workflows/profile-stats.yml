name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate GitHub profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ATULPANDEYIITR
          cards: "overview,contributions,repositories,languages"
          output-dir: assets
          themes: "dark,light"
          language-limit: 8
          commit: false
                - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
                - name: Install Python package
        run: pip install requests
              - name: Generate Dynamic GitHub Activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR
        run: |
          cat > generate_profile.py <<'PYTHON'
          import os
          import requests

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json"
          }

          query = """
          query($login: String!) {
            user(login: $login) {
              login
              name
              followers {
                totalCount
              }
              following {
                totalCount
              }
              repositories(first: 20, ownerAffiliations: OWNER, orderBy: {field: UPDATED_AT, direction: DESC}) {
                totalCount
                nodes {
                  name
                  stargazerCount
                  forkCount
                  watchers {
                    totalCount
                  }
                  defaultBranchRef {
                    target {
                      ... on Commit {
                        history(first: 5) {
                          nodes {
                            messageHeadline
                            committedDate
                            url
                          }
                        }
                      }
                    }
                  }
                }
              }
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
              pullRequests(first: 1) {
                totalCount
              }
              issues(first: 1) {
                totalCount
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={"query": query, "variables": {"login": USERNAME}},
              headers=headers
          )

          response.raise_for_status()

          data = response.json()

          if "errors" in data:
              raise RuntimeError(data["errors"])

          user = data["data"]["user"]

          print(f"GitHub activity data collected for {user['login']}")
          print(f"Followers: {user['followers']['totalCount']}")
          print(f"Repositories: {user['repositories']['totalCount']}")
          print(
              f"Contributions: "
              f"{user['contributionsCollection']['contributionCalendar']['totalContributions']}"
          )

          print("Dynamic activity data collected successfully.")
          PYTHON

          python generate_profile.py
          commit-message: "Update GitHub profile statistics"

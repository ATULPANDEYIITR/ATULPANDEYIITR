              VIOLET_LIGHT,
          ]


          for index, (
              label,
              value,
              width,
          ) in enumerate(
              zip(
                  telemetry_names,
                  telemetry_values,
                  normalized,
              )
          ):

              axis.barh(
                  index,
                  width,
                  height=0.52,
                  color=telemetry_colors[
                      index
                  ],
              )


              axis.text(
                  0.02,
                  index,
                  label,
                  transform=axis.get_yaxis_transform(),
                  ha="left",
                  va="center",
                  fontsize=LABEL_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )


              axis.text(
                  1.02,
                  index,
                  fmt(value),
                  transform=axis.get_yaxis_transform(),
                  ha="left",
                  va="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )


          axis.set_xlim(
              0,
              1.20,
          )


          axis.set_yticks([])

          axis.set_xticks([])

          style(
              axis
          )


          axis.set_title(
              "DEVELOPER TELEMETRY",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=20,
          )


          save(
              figure,
              "github-developer-telemetry.png",
          )


          # ============================================================
          # REQUIRED FILE VALIDATION
          # ============================================================

          required_files = [
              "github-area-chart.png",
              "github-bar-chart.png",
              "github-box-plot.png",
              "github-bubble-chart.png",
              "github-developer-telemetry.png",
              "github-donut-chart.png",
              "github-funnel-chart.png",
              "github-heatmap.png",
              "github-histogram.png",
              "github-line-graph.png",
              "github-pie-chart.png",
              "github-radar-chart.png",
              "github-sankey-diagram.png",
              "github-scatter-plot.png",
              "github-streak-system.png",
              "github-treemap.png",
              "github-waterfall-chart.png",
          ]


          print("")
          print(
              "=" * 70
          )
          print(
              "VALIDATING DASHBOARD FILES"
          )
          print(
              "=" * 70
          )


          missing_files = []


          for filename in required_files:

              path = (
                  OUTPUT_DIR
                  / filename
              )


              if not path.is_file():

                  missing_files.append(
                      filename
                  )

                  continue


              file_size = (
                  path.stat().st_size
              )


              if file_size <= 0:

                  missing_files.append(
                      filename
                  )

                  continue


              print(
                  f"OK  {filename:<40}"
                  f"{file_size:>10,} bytes"
              )


          if missing_files:

              print("")
              print(
                  "ERROR: Missing or empty files:"
              )

              for filename in missing_files:

                  print(
                      f"  - {filename}"
                  )

              raise RuntimeError(
                  "Dashboard file validation failed."
              )


          print("")
          print(
              f"SUCCESS: "
              f"{len(required_files)} dashboard images generated."
          )


          # ============================================================
          # FINAL OUTPUT
          # ============================================================

          print("")
          print(
              "=" * 70
          )
          print(
              "GITHUB PROFILE DASHBOARD COMPLETE"
          )
          print(
              "=" * 70
          )

          print(
              f"User:              {USERNAME}"
          )

          print(
              f"Contributions:     {fmt(current['total'])}"
          )

          print(
              f"Commits:           {fmt(current['commits'])}"
          )

          print(
              f"Pull Requests:     {fmt(current['pull_requests'])}"
          )

          print(
              f"Issues:            {fmt(current['issues'])}"
          )

          print(
              f"Repositories:      {fmt(current['repositories'])}"
          )

          print(
              f"Stars:             {fmt(total_stars)}"
          )

          print(
              f"Forks:             {fmt(total_forks)}"
          )

          print(
              f"Active Days:       {fmt(active_days)}"
          )

          print(
              f"Current Streak:    {fmt(current_streak)}"
          )

          print(
              f"Longest Streak:    {fmt(longest_streak)}"
          )

          print(
              "=" * 70
          )

          PYTHON

          # ----------------------------------------------------------
          # Validate Python before execution
          # ----------------------------------------------------------

          echo ""
          echo "Checking Python syntax..."

          python -m py_compile generate_profile.py

          echo "Python syntax check: PASSED"

          # ----------------------------------------------------------
          # Run generator
          # ----------------------------------------------------------

          echo ""
          echo "Running dashboard generator..."

          python generate_profile.py

          # ----------------------------------------------------------
          # Validate output files again from shell
          # ----------------------------------------------------------

          echo ""
          echo "Final shell validation..."

          required_files=(
            "assets/github-area-chart.png"
            "assets/github-bar-chart.png"
            "assets/github-box-plot.png"
            "assets/github-bubble-chart.png"
            "assets/github-developer-telemetry.png"
            "assets/github-donut-chart.png"
            "assets/github-funnel-chart.png"
            "assets/github-heatmap.png"
            "assets/github-histogram.png"
            "assets/github-line-graph.png"
            "assets/github-pie-chart.png"
            "assets/github-radar-chart.png"
            "assets/github-sankey-diagram.png"
            "assets/github-scatter-plot.png"
            "assets/github-streak-system.png"
            "assets/github-treemap.png"
            "assets/github-waterfall-chart.png"
          )

          for file in "${required_files[@]}"; do

            if [ ! -s "$file" ]; then
              echo "ERROR: Missing or empty file: $file"
              exit 1
            fi

            echo "OK: $file"

          done

          echo ""
          echo "ALL 17 DASHBOARD IMAGES ARE VALID."

      # ============================================================
      # 5. COMMIT GENERATED IMAGES
      # ============================================================

      - name: Commit updated dashboard images
        shell: bash
        run: |

          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then

            echo "No dashboard image changes detected."

          else

            echo "Dashboard images changed."

            git commit \
              -m "Update GitHub activity dashboard"

            git push

          fi

          echo ""
          echo "============================================================"
          echo "WORKFLOW COMPLETED"
          echo "============================================================"

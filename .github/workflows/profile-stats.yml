          )

          fig, ax = plt.subplots(
              figsize=(16, 10)
          )

          ax.axis("off")

          table_data = []

          for repo in matrix_repositories:

              language = (
                  repo.get("language")
                  or "-"
              )

              updated = repo.get(
                  "updated_at",
                  "-"
              )

              if updated != "-":

                  updated = datetime.fromisoformat(
                      updated.replace(
                          "Z",
                          "+00:00"
                      )
                  ).strftime(
                      "%d-%m-%Y"
                  )

              table_data.append([
                  repo["name"][:24],
                  language[:14],
                  repo["stargazers_count"],
                  repo["forks_count"],
                  repo["watchers_count"],
                  f"{repo.get('size', 0):,}",
                  updated
              ])

          table = ax.table(

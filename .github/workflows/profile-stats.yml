      - name: Validate generated dashboard
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Generated dashboard files:"
          find assets -maxdepth 1 -type f -name "*.png" -print | sort

          COUNT="$(find assets -maxdepth 1 -type f -name "*.png" | wc -l)"

          echo "PNG count: $COUNT"

          if [ "$COUNT" -ne 17 ]; then
            echo "Expected 17 PNG files but found $COUNT"
            exit 1
          fi

          echo "Dashboard validation successful."

      - name: Commit updated dashboard images
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.png

          echo "Git status:"
          git status --short

          if git diff --cached --quiet; then
            echo "No dashboard changes detected."
            exit 0
          fi

          git commit -m "Update GitHub profile dashboard"

          git push origin "HEAD:${DEFAULT_BRANCH}"

          echo "Dashboard images pushed successfully."

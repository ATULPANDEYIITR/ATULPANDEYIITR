    def heat_color(
        value,
    ):

        if value <= 0:
            return STEEL_GREY

        ratio = (
            value
            / heat_maximum
        )

        if ratio < 0.25:
            return BLUE_LIGHT

        if ratio < 0.50:
            return ELECTRIC_BLUE

        if ratio < 0.75:
            return ELECTRIC_VIOLET

        return ACID_GREEN



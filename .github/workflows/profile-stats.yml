name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:

  generate-profile:

    name: Generate GitHub Profile Dashboard

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      GITHUB_USERNAME: ATULPANDEYIITR
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      MPLCONFIGDIR: /tmp/matplotlib

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository

        uses: actions/checkout@v6

        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1


      # ============================================================
      # 2. SET UP PYTHON
      #
      # IMPORTANT:
      # No "cache: pip" is used.
      #
      # This avoids the previous error:
      #
      # No file matched to requirements.txt or pyproject.toml
      # ============================================================

      - name: Set up Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages

        shell: bash

        run: |

          set -Eeuo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            matplotlib \
            numpy

          echo ""
          echo "Python packages installed successfully."


      # ============================================================
      # 4. GENERATE ALL DASHBOARD IMAGES
      # ============================================================

      - name: Generate GitHub Activity Dashboard

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |

          set -Eeuo pipefail

          echo ""
          echo "============================================================"
          echo "GITHUB PROFILE DASHBOARD GENERATOR"
          echo "============================================================"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "User       : $GITHUB_USERNAME"
          echo "Python     : $(python --version)"
          echo "============================================================"
          echo ""


          # ========================================================
          # CREATE PYTHON GENERATOR
          # ========================================================

          cat > generate_profile.py <<'PYTHON'

          import os
          import math
          import time

          from datetime import (
              datetime,
              timedelta,
              timezone,
              date,
          )

          from pathlib import Path

          import requests
          import numpy as np

          import matplotlib
          matplotlib.use("Agg")

          import matplotlib.pyplot as plt

          from matplotlib.patches import (
              FancyBboxPatch,
              FancyArrowPatch,
              Rectangle,
          )


          # ============================================================
          # BASIC CONFIGURATION
          # ============================================================

          USERNAME = os.environ.get(
              "GITHUB_USERNAME",
              "ATULPANDEYIITR",
          )

          TOKEN = os.environ.get(
              "GITHUB_TOKEN",
              "",
          )

          REST_URL = "https://api.github.com"

          GRAPHQL_URL = (
              "https://api.github.com/graphql"
          )

          OUTPUT_DIR = Path("assets")

          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True,
          )


          # ============================================================
          # VISUAL COLOR SYSTEM
          # ============================================================

          ELECTRIC_BLUE = "#0057FF"

          ACID_GREEN = "#39FF14"

          ELECTRIC_VIOLET = "#8A2BE2"

          HOT_MAGENTA = "#FF007F"

          ICE_WHITE = "#E8F1FF"

          STEEL_GREY = "#7B8CA8"

          BLUE_LIGHT = "#3D7BFF"

          GREEN_LIGHT = "#7CFF5B"

          VIOLET_LIGHT = "#B266FF"

          MAGENTA_LIGHT = "#FF4DA6"


          # ============================================================
          # LARGE READABLE FONT SYSTEM
          # ============================================================

          TITLE_SIZE = 28

          SUBTITLE_SIZE = 18

          LABEL_SIZE = 18

          TICK_SIZE = 17

          VALUE_SIZE = 23

          LARGE_VALUE_SIZE = 29

          HUGE_VALUE_SIZE = 40

          LEGEND_SIZE = 17

          HEATMAP_SIZE = 16


          # ============================================================
          # MATPLOTLIB CONFIGURATION
          #
          # Transparent background.
          # No grid.
          # Large text.
          # Wide figures.
          # ============================================================

          plt.rcParams.update({

              "font.family": "DejaVu Sans",

              "font.size": TICK_SIZE,

              "axes.titlesize": TITLE_SIZE,

              "axes.labelsize": LABEL_SIZE,

              "xtick.labelsize": TICK_SIZE,

              "ytick.labelsize": TICK_SIZE,

              "legend.fontsize": LEGEND_SIZE,

              "figure.dpi": 180,

              "savefig.dpi": 180,

              "axes.grid": False,

              "axes.facecolor": "none",

              "figure.facecolor": "none",

              "savefig.facecolor": "none",

          })


          # ============================================================
          # HTTP SESSION
          # ============================================================

          SESSION = requests.Session()

          SESSION.headers.update({

              "Accept":
                  "application/vnd.github+json",

              "Authorization":
                  f"Bearer {TOKEN}",

              "X-GitHub-Api-Version":
                  "2022-11-28",

              "User-Agent":
                  "ATULPANDEYIITR-GitHub-Profile-Dashboard",

          })


          # ============================================================
          # API REQUEST WITH RETRIES
          # ============================================================

          def request_with_retry(
              method,
              url,
              **kwargs,
          ):

              last_error = None

              retry_statuses = {
                  429,
                  500,
                  502,
                  503,
                  504,
              }

              for attempt in range(1, 4):

                  try:

                      response = SESSION.request(
                          method,
                          url,
                          timeout=45,
                          **kwargs,
                      )

                      if (
                          response.status_code
                          in retry_statuses
                      ):

                          if attempt < 3:

                              retry_after = (
                                  response.headers.get(
                                      "Retry-After"
                                  )
                              )

                              try:

                                  wait_seconds = int(
                                      retry_after
                                      or 2
                                  )

                              except Exception:

                                  wait_seconds = 2

                              wait_seconds = min(
                                  wait_seconds,
                                  10,
                              )

                              print(
                                  f"GitHub API returned "
                                  f"{response.status_code}. "
                                  f"Retrying in "
                                  f"{wait_seconds}s..."
                              )

                              time.sleep(
                                  wait_seconds
                              )

                              continue

                      if not response.ok:

                          print("")
                          print(
                              "GITHUB API ERROR"
                          )
                          print(
                              "----------------"
                          )
                          print(
                              f"Method: "
                              f"{method}"
                          )
                          print(
                              f"URL: "
                              f"{url}"
                          )
                          print(
                              f"HTTP: "
                              f"{response.status_code}"
                          )
                          print(
                              f"Rate remaining: "
                              f"{response.headers.get('X-RateLimit-Remaining', 'unknown')}"
                          )
                          print(
                              response.text[:5000]
                          )
                          print("")

                          response.raise_for_status()

                      return response

                  except requests.RequestException as error:

                      last_error = error

                      if attempt < 3:

                          wait_seconds = (
                              2 ** attempt
                          )

                          print(
                              f"Network/API error. "
                              f"Retrying in "
                              f"{wait_seconds}s..."
                          )

                          time.sleep(
                              wait_seconds
                          )

                          continue

                      raise

              raise RuntimeError(
                  f"GitHub request failed: "
                  f"{last_error}"
              )


          # ============================================================
          # REST JSON
          # ============================================================

          def rest_json(
              url,
              params=None,
          ):

              response = request_with_retry(
                  "GET",
                  url,
                  params=params,
              )

              try:

                  return response.json()

              except Exception as error:

                  raise RuntimeError(
                      f"GitHub returned invalid JSON "
                      f"for {url}: {error}"
                  )


          # ============================================================
          # GRAPHQL
          # ============================================================

          def graphql(
              query,
              variables,
          ):

              response = request_with_retry(
                  "POST",
                  GRAPHQL_URL,
                  json={
                      "query": query,
                      "variables": variables,
                  },
              )

              try:

                  payload = response.json()

              except Exception as error:

                  raise RuntimeError(
                      f"GitHub GraphQL returned "
                      f"invalid JSON: {error}"
                  )

              if payload.get("errors"):

                  print("")
                  print(
                      "GITHUB GRAPHQL ERROR"
                  )
                  print(
                      "--------------------"
                  )

                  for error in payload["errors"]:

                      print(
                          error
                      )

                  print("")

                  raise RuntimeError(
                      "GitHub GraphQL returned errors."
                  )

              data = payload.get(
                  "data"
              )

              if not data:

                  raise RuntimeError(
                      "GitHub GraphQL returned no data."
                  )

              return data


          # ============================================================
          # INTEGER HELPER
          # ============================================================

          def safe_int(
              value,
          ):

              try:

                  return int(
                      value or 0
                  )

              except Exception:

                  return 0


          # ============================================================
          # NUMBER FORMATTER
          # ============================================================

          def fmt(
              value,
          ):

              return (
                  f"{safe_int(value):,}"
              )


          # ============================================================
          # GRAPHQL CONTRIBUTION QUERY
          #
          # One contribution request only.
          # This removes the fragile repeated yearly requests.
          # ============================================================

          CONTRIBUTION_QUERY = """

          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {

            user(
              login: $login
            ) {

              contributionsCollection(
                from: $from,
                to: $to
              ) {

                totalContributions

                totalCommitContributions

                totalIssueContributions

                totalPullRequestContributions

                contributionCalendar {

                  weeks {

                    contributionDays {

                      contributionCount

                      date

                    }

                  }

                }

              }

            }

          }

          """


          # ============================================================
          # FETCH CONTRIBUTIONS
          # ============================================================

          def get_contributions(
              start_datetime,
              end_datetime,
          ):

              data = graphql(

                  CONTRIBUTION_QUERY,

                  {
                      "login":
                          USERNAME,

                      "from":
                          start_datetime.isoformat(),

                      "to":
                          end_datetime.isoformat(),
                  },

              )

              user = data.get(
                  "user"
              )

              if not user:

                  raise RuntimeError(
                      f"GitHub user "
                      f"'{USERNAME}' was not found."
                  )

              collection = user.get(
                  "contributionsCollection"
              )

              if not collection:

                  raise RuntimeError(
                      "GitHub returned no "
                      "contribution collection."
                  )

              days = {}

              calendar = collection.get(
                  "contributionCalendar",
                  {},
              )

              for week in calendar.get(
                  "weeks",
                  [],
              ):

                  for contribution_day in week.get(
                      "contributionDays",
                      [],
                  ):

                      date_string = (
                          contribution_day.get(
                              "date"
                          )
                      )

                      count = safe_int(
                          contribution_day.get(
                              "contributionCount"
                          )
                      )

                      if date_string:

                          days[
                              date_string
                          ] = count

              return {

                  "total":
                      safe_int(
                          collection.get(
                              "totalContributions"
                          )
                      ),

                  "commits":
                      safe_int(
                          collection.get(
                              "totalCommitContributions"
                          )
                      ),

                  "issues":
                      safe_int(
                          collection.get(
                              "totalIssueContributions"
                          )
                      ),

                  "pull_requests":
                      safe_int(
                          collection.get(
                              "totalPullRequestContributions"
                          )
                      ),

                  "days":
                      days,
              }


          # ============================================================
          # CURRENT TIME
          # ============================================================

          now = datetime.now(
              timezone.utc
          )

          today = now.date()

          first_day = (
              today
              - timedelta(
                  days=364
              )
          )

          start_datetime = datetime(
              first_day.year,
              first_day.month,
              first_day.day,
              tzinfo=timezone.utc,
          )


          # ============================================================
          # GET CONTRIBUTION DATA
          # ============================================================

          print(
              "Fetching contribution data..."
          )

          current = get_contributions(
              start_datetime,
              now,
          )

          print(
              f"Total contributions: "
              f"{fmt(current['total'])}"
          )

          print(
              f"Commits: "
              f"{fmt(current['commits'])}"
          )

          print(
              f"Pull requests: "
              f"{fmt(current['pull_requests'])}"
          )

          print(
              f"Issues: "
              f"{fmt(current['issues'])}"
          )


          # ============================================================
          # EXACT 365 DAYS
          # ============================================================

          dates = [

              first_day
              + timedelta(days=i)

              for i in range(365)

          ]


          daily = [

              safe_int(
                  current["days"].get(
                      current_date.isoformat(),
                      0,
                  )
              )

              for current_date in dates

          ]


          # ============================================================
          # MONTH HELPER
          # ============================================================

          def previous_month(
              month_date,
          ):

              if month_date.month == 1:

                  return date(
                      month_date.year - 1,
                      12,
                      1,
                  )

              return date(
                  month_date.year,
                  month_date.month - 1,
                  1,
              )


          # ============================================================
          # LAST 12 MONTHS
          # ============================================================

          month_cursor = date(
              today.year,
              today.month,
              1,
          )

          month_starts = []

          for _ in range(12):

              month_starts.append(
                  month_cursor
              )

              month_cursor = previous_month(
                  month_cursor
              )

          month_starts.reverse()


          month_labels = [

              month_date.strftime(
                  "%b %y"
              )

              for month_date
              in month_starts

          ]


          monthly = []


          for month_start in month_starts:

              if month_start.month == 12:

                  next_month = date(
                      month_start.year + 1,
                      1,
                      1,
                  )

              else:

                  next_month = date(
                      month_start.year,
                      month_start.month + 1,
                      1,
                  )

              value = 0

              for current_date, contribution_count in zip(
                  dates,
                  daily,
              ):

                  if (
                      current_date
                      >= month_start
                      and current_date
                      < next_month
                  ):

                      value += contribution_count

              monthly.append(
                  value
              )


          # ============================================================
          # WEEKDAY RELATIONSHIP
          # ============================================================

          weekday_names = [

              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday",

          ]


          weekdays = [

              0
              for _ in range(7)

          ]


          for current_date, contribution_count in zip(
              dates,
              daily,
          ):

              weekdays[
                  current_date.weekday()
              ] += contribution_count


          # ============================================================
          # STREAKS
          # ============================================================

          active_days = sum(

              1
              for value in daily
              if value > 0

          )


          current_streak = 0

          streak_day = today


          if current["days"].get(
              streak_day.isoformat(),
              0,
          ) == 0:

              streak_day -= timedelta(
                  days=1
              )


          while (

              streak_day >= first_day

              and current["days"].get(
                  streak_day.isoformat(),
                  0,
              ) > 0

          ):

              current_streak += 1

              streak_day -= timedelta(
                  days=1
              )


          longest_streak = 0

          running_streak = 0


          for value in daily:

              if value > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak,
                  )

              else:

                  running_streak = 0


          # ============================================================
          # PROFILE
          # ============================================================

          print(
              "Fetching profile information..."
          )

          profile = rest_json(
              f"{REST_URL}/users/{USERNAME}"
          )


          followers = safe_int(
              profile.get(
                  "followers"
              )
          )

          following = safe_int(
              profile.get(
                  "following"
              )
          )


          # ============================================================
          # REPOSITORIES WITH FULL PAGINATION
          # ============================================================

          print(
              "Fetching repositories..."
          )

          repositories = []

          page = 1


          while True:

              batch = rest_json(

                  f"{REST_URL}/users/"
                  f"{USERNAME}/repos",

                  params={

                      "per_page": 100,

                      "page": page,

                      "sort": "updated",

                      "direction": "desc",

                  },

              )


              if not isinstance(
                  batch,
                  list,
              ):

                  raise RuntimeError(
                      "GitHub repository API "
                      "returned an unexpected response."
                  )


              repositories.extend(
                  batch
              )


              if len(batch) < 100:

                  break


              page += 1


              if page > 100:

                  raise RuntimeError(
                      "Repository pagination exceeded "
                      "100 pages."
                  )


          print(
              f"Repositories loaded: "
              f"{len(repositories)}"
          )


          # ============================================================
          # REPOSITORY METRICS
          # ============================================================

          owned_repositories = [

              repository

              for repository in repositories

              if not repository.get(
                  "fork",
                  False,
              )

          ]


          total_stars = sum(

              safe_int(
                  repository.get(
                      "stargazers_count"
                  )
              )

              for repository
              in owned_repositories

          )


          total_forks = sum(

              safe_int(
                  repository.get(
                      "forks_count"
                  )
              )

              for repository
              in owned_repositories

          )


          # ============================================================
          # PRIMARY LANGUAGE DATA
          # ============================================================

          language_counts = {}


          for repository in owned_repositories:

              language = repository.get(
                  "language"
              )

              if language:

                  language_counts[
                      language
                  ] = (

                      language_counts.get(
                          language,
                          0,
                      )

                      + 1

                  )


          if not language_counts:

              language_counts = {
                  "Python": 1,
              }


          # ============================================================
          # COMMON METRICS
          # ============================================================

          metric_names = [

              "Commits",

              "Pull Requests",

              "Issues",

              "Repositories",

          ]


          metric_values = [

              current["commits"],

              current["pull_requests"],

              current["issues"],

              len(owned_repositories),

          ]


          metric_colors = [

              ELECTRIC_BLUE,

              ACID_GREEN,

              ELECTRIC_VIOLET,

              HOT_MAGENTA,

          ]


          # ============================================================
          # GENERAL FIGURE FUNCTIONS
          # ============================================================

          def create_figure(
              width=16,
              height=8,
          ):

              figure, axis = plt.subplots(
                  figsize=(
                      width,
                      height,
                  )
              )

              figure.patch.set_alpha(
                  0
              )

              axis.set_facecolor(
                  "none"
              )

              return (
                  figure,
                  axis,
              )


          # ============================================================
          # STYLE AXIS
          # ============================================================

          def style_axis(
              axis,
          ):

              axis.set_facecolor(
                  "none"
              )

              for spine in axis.spines.values():

                  spine.set_visible(
                      False
                  )

              axis.grid(
                  False
              )

              axis.tick_params(
                  colors=STEEL_GREY,
                  labelsize=TICK_SIZE,
                  length=0,
                  pad=8,
              )


          # ============================================================
          # TITLE
          # ============================================================

          def add_title(
              axis,
              title,
              subtitle=None,
          ):

              axis.set_title(

                  title,

                  fontsize=TITLE_SIZE,

                  fontweight="bold",

                  color=ICE_WHITE,

                  pad=30,

              )


              if subtitle:

                  axis.text(

                      0.5,

                      1.015,

                      subtitle,

                      transform=axis.transAxes,

                      ha="center",

                      va="bottom",

                      fontsize=SUBTITLE_SIZE,

                      color=STEEL_GREY,

                  )


          # ============================================================
          # SAVE IMAGE
          # ============================================================

          def save_figure(
              figure,
              filename,
          ):

              output_path = (
                  OUTPUT_DIR
                  / filename
              )

              figure.patch.set_alpha(
                  0
              )

              figure.savefig(

                  output_path,

                  transparent=True,

                  dpi=180,

                  bbox_inches="tight",

                  pad_inches=0.30,

              )

              plt.close(
                  figure
              )

              if not output_path.is_file():

                  raise RuntimeError(
                      f"Image was not created: "
                      f"{output_path}"
                  )

              if output_path.stat().st_size <= 0:

                  raise RuntimeError(
                      f"Image is empty: "
                      f"{output_path}"
                  )

              print(
                  f"CREATED: "
                  f"{output_path}"
              )


          # ============================================================
          # 1. FULL-WIDTH BAR CHART
          # ============================================================

          figure, axis = create_figure()

          positions = np.arange(
              len(metric_names)
          )


          bars = axis.bar(

              positions,

              metric_values,

              width=0.62,

              color=metric_colors,

          )


          add_title(

              axis,

              "GITHUB CONTRIBUTION ACTIVITY",

              "Rolling 365-day activity",

          )


          axis.set_xticks(
              positions
          )


          axis.set_xticklabels(

              metric_names,

              fontsize=LABEL_SIZE,

              fontweight="bold",

              color=ICE_WHITE,

          )


          style_axis(
              axis
          )


          maximum = max(
              metric_values + [1]
          )


          for bar, value in zip(
              bars,
              metric_values,
          ):

              label_height = (

                  bar.get_height()

                  + maximum * 0.035

              )


              axis.text(

                  bar.get_x()
                  + bar.get_width() / 2,

                  label_height,

                  fmt(value),

                  ha="center",

                  va="bottom",

                  fontsize=LARGE_VALUE_SIZE,

                  fontweight="bold",

                  color=ICE_WHITE,

              )


          axis.set_ylim(

              0,

              maximum * 1.25,

          )


          save_figure(

              figure,

              "github-bar-chart.png",

          )


          # ============================================================
          # 2. FULL-WIDTH LINE GRAPH
          # ============================================================

          figure, axis = create_figure()

          x = np.arange(
              len(monthly)
          )


          axis.plot(

              x,

              monthly,

              color=ELECTRIC_BLUE,

              linewidth=5,

              marker="o",

              markersize=12,

          )


          add_title(

              axis,

              "MONTHLY CONTRIBUTION MOMENTUM",

              "Rolling 12-month contribution activity",

          )


          axis.set_xticks(
              x
          )


          axis.set_xticklabels(

              month_labels,

              fontsize=LABEL_SIZE,

              fontweight="bold",

              color=ICE_WHITE,

          )


          style_axis(
              axis
          )


          maximum = max(
              monthly + [1]
          )


          for x_position, value in zip(
              x,
              monthly,
          ):

              axis.annotate(

                  fmt(value),

                  (
                      x_position,
                      value,
                  ),

                  xytext=(
                      0,
                      18,
                  ),

                  textcoords="offset points",

                  ha="center",

                  fontsize=VALUE_SIZE,

                  fontweight="bold",

                  color=ICE_WHITE,

              )


          axis.set_ylim(

              0,

              maximum * 1.32,

          )


          save_figure(

              figure,

              "github-line-graph.png",

          )


          # ============================================================
          # 3. FULL-WIDTH AREA CHART
          # ============================================================

          cumulative = np.cumsum(
              monthly
          )


          figure, axis = create_figure()


          axis.fill_between(

              x,

              cumulative,

              color=ELECTRIC_BLUE,

              alpha=0.28,

          )


          axis.plot(

              x,

              cumulative,

              color=ELECTRIC_BLUE,

              linewidth=5,

              marker="o",

              markersize=11,

          )


          add_title(

              axis,

              "CUMULATIVE CONTRIBUTION GROWTH",

              "Rolling 12-month accumulation",

          )


          axis.set_xticks(
              x
          )


          axis.set_xticklabels(


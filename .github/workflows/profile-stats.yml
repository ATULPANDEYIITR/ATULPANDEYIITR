name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  # 9:47 PM IST = 16:17 UTC
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib numpy

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR
        run: |
          set -euo pipefail

          cat > generate_profile.py <<'PYTHON'
          import os
          import math
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          import requests
          import numpy as np

          import matplotlib
          matplotlib.use("Agg")

          import matplotlib.pyplot as plt
          from matplotlib.patches import FancyBboxPatch, PathPatch, Rectangle
          from matplotlib.path import Path as MplPath


          # ============================================================
          # CONFIGURATION
          # ============================================================

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          API_URL = "https://api.github.com"
          GRAPHQL_URL = "https://api.github.com/graphql"

          OUTPUT_DIR = Path("assets")
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }


          # ============================================================
          # VISUAL THEME
          # ============================================================

          ELECTRIC_BLUE = "#0057FF"
          ACID_GREEN = "#39FF14"
          ELECTRIC_VIOLET = "#8A2BE2"
          HOT_MAGENTA = "#FF007F"

          ICE_WHITE = "#E8F1FF"
          STEEL_GREY = "#7B8CA8"

          BLUE_LIGHT = "#3D7BFF"
          GREEN_LIGHT = "#7CFF5B"
          VIOLET_LIGHT = "#B266FF"
          MAGENTA_LIGHT = "#FF4DA6"

          FONT_MAIN = "DejaVu Sans"

          # Large readable typography
          TITLE_SIZE = 22
          SUBTITLE_SIZE = 14
          AXIS_LABEL_SIZE = 13
          TICK_SIZE = 12
          VALUE_SIZE = 16
          VALUE_SIZE_LARGE = 21
          SMALL_VALUE_SIZE = 13
          LEGEND_SIZE = 12
          HEATMAP_LABEL_SIZE = 11
          BIG_NUMBER_SIZE = 30

          DPI = 180


          # ============================================================
          # MATPLOTLIB GLOBAL SETTINGS
          # ============================================================

          plt.rcParams.update({
              "font.family": FONT_MAIN,
              "font.size": TICK_SIZE,
              "axes.titlesize": TITLE_SIZE,
              "axes.labelsize": AXIS_LABEL_SIZE,
              "xtick.labelsize": TICK_SIZE,
              "ytick.labelsize": TICK_SIZE,
              "legend.fontsize": LEGEND_SIZE,
              "figure.dpi": DPI,
              "savefig.dpi": DPI,
          })


          # ============================================================
          # HELPERS
          # ============================================================

          def api_get(url, params=None):
              response = requests.get(
                  url,
                  headers=HEADERS,
                  params=params,
                  timeout=30,
              )

              if not response.ok:
                  print("GitHub REST API error:")
                  print("Status:", response.status_code)
                  print(response.text)
                  response.raise_for_status()

              return response.json()


          def graphql_query(query, variables):
              response = requests.post(
                  GRAPHQL_URL,
                  headers=HEADERS,
                  json={
                      "query": query,
                      "variables": variables,
                  },
                  timeout=30,
              )

              if not response.ok:
                  print("GitHub GraphQL HTTP error:")
                  print("Status:", response.status_code)
                  print(response.text)
                  response.raise_for_status()

              payload = response.json()

              if payload.get("errors"):
                  print("GitHub GraphQL errors:")
                  for error in payload["errors"]:
                      print(error)

                  raise RuntimeError("GitHub GraphQL returned errors.")

              if not payload.get("data"):
                  raise RuntimeError("GitHub GraphQL returned no data.")

              return payload["data"]


          def safe_int(value):
              try:
                  return int(value or 0)
              except Exception:
                  return 0


          def format_number(value):
              return f"{int(value):,}"


          def add_title(ax, title, subtitle=None):
              ax.set_title(
                  title,
                  fontsize=TITLE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
                  pad=18,
              )

              if subtitle:
                  ax.text(
                      0.5,
                      1.015,
                      subtitle,
                      transform=ax.transAxes,
                      ha="center",
                      va="bottom",
                      fontsize=SUBTITLE_SIZE,
                      color=STEEL_GREY,
                  )


          def style_axis(ax):
              ax.set_facecolor("none")

              for spine in ax.spines.values():
                  spine.set_visible(False)

              ax.tick_params(
                  axis="both",
                  colors=STEEL_GREY,
                  labelsize=TICK_SIZE,
                  length=0,
              )


          def save_figure(fig, filename):
              path = OUTPUT_DIR / filename

              fig.patch.set_alpha(0)
              fig.savefig(
                  path,
                  transparent=True,
                  bbox_inches="tight",
                  pad_inches=0.20,
                  dpi=DPI,
              )

              plt.close(fig)

              print(f"Generated: {path}")


          def annotate_value(
              ax,
              x,
              y,
              value,
              color=ICE_WHITE,
              fontsize=VALUE_SIZE,
              offset=0.02,
          ):
              ax.text(
                  x,
                  y + offset,
                  format_number(value),
                  ha="center",
                  va="bottom",
                  fontsize=fontsize,
                  fontweight="bold",
                  color=color,
              )


          def normalize(values):
              values = np.asarray(values, dtype=float)

              if len(values) == 0:
                  return values

              maximum = np.max(values)

              if maximum <= 0:
                  return np.ones_like(values) * 0.25

              return values / maximum


          # ============================================================
          # GITHUB CONTRIBUTION DATA
          # ============================================================

          contribution_query = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(
                from: $from,
                to: $to
              ) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalRepositoryContributions
                totalContributions

                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """


          def get_contribution_period(start_dt, end_dt):
              data = graphql_query(
                  contribution_query,
                  {
                      "login": USERNAME,
                      "from": start_dt.isoformat(),
                      "to": end_dt.isoformat(),
                  },
              )

              user = data.get("user")

              if not user:
                  raise RuntimeError(
                      f"GitHub user '{USERNAME}' was not found."
                  )

              collection = user["contributionsCollection"]

              calendar = collection.get("contributionCalendar") or {}

              days = []

              for week in calendar.get("weeks", []):
                  for day in week.get("contributionDays", []):
                      days.append({
                          "date": day["date"],
                          "count": safe_int(day["contributionCount"]),
                      })

              return {
                  "commits": safe_int(
                      collection.get("totalCommitContributions")
                  ),
                  "issues": safe_int(
                      collection.get("totalIssueContributions")
                  ),
                  "pull_requests": safe_int(
                      collection.get("totalPullRequestContributions")
                  ),
                  "repositories": safe_int(
                      collection.get("totalRepositoryContributions")
                  ),
                  "total": safe_int(
                      collection.get("totalContributions")
                  ),
                  "days": days,
              }


          now_utc = datetime.now(timezone.utc)

          rolling_start = now_utc - timedelta(days=365)

          current = get_contribution_period(
              rolling_start,
              now_utc,
          )


          # ============================================================
          # BUILD EXACT 365-DAY DATASET
          # ============================================================

          today = now_utc.date()
          start_date = today - timedelta(days=364)

          raw_day_map = {
              datetime.fromisoformat(
                  item["date"]
              ).date(): item["count"]
              for item in current["days"]
          }

          dates = [
              start_date + timedelta(days=i)
              for i in range(365)
          ]

          daily_counts = [
              raw_day_map.get(day, 0)
              for day in dates
          ]


          # ============================================================
          # MONTHLY DATA
          # ============================================================

          monthly_counts = [0] * 12
          monthly_commits = [0] * 12

          for day, count in zip(dates, daily_counts):
              if day.year == today.year:
                  monthly_counts[day.month - 1] += count


          # Approximate monthly commit signal from current collection.
          # The actual commit total is retained for the headline metrics.
          if current["commits"] > 0:
              month_weights = np.array(
                  [max(x, 1) for x in monthly_counts],
                  dtype=float,
              )
              month_weights /= month_weights.sum()
              monthly_commits = [
                  int(round(current["commits"] * weight))
                  for weight in month_weights
              ]


          # ============================================================
          # WEEKDAY DATA
          # ============================================================

          weekday_counts = [0] * 7

          for day, count in zip(dates, daily_counts):
              weekday_counts[day.weekday()] += count

          weekday_names = [
              "Mon",
              "Tue",
              "Wed",
              "Thu",
              "Fri",
              "Sat",
              "Sun",
          ]


          # ============================================================
          # STREAK CALCULATIONS
          # ============================================================

          current_streak = 0

          check_date = today

          if raw_day_map.get(check_date, 0) == 0:
              check_date -= timedelta(days=1)

          while raw_day_map.get(check_date, 0) > 0:
              current_streak += 1
              check_date -= timedelta(days=1)


          longest_streak = 0
          running_streak = 0

          for count in daily_counts:
              if count > 0:
                  running_streak += 1
                  longest_streak = max(
                      longest_streak,
                      running_streak,
                  )
              else:
                  running_streak = 0


          active_days = sum(
              1 for count in daily_counts
              if count > 0
          )


          # ============================================================
          # YEARLY CONTRIBUTION DATA
          # ============================================================

          yearly_values = []

          for year in range(today.year - 3, today.year + 1):
              year_start = datetime(
                  year,
                  1,
                  1,
                  tzinfo=timezone.utc,
              )

              if year == today.year:
                  year_end = now_utc
              else:
                  year_end = datetime(
                      year + 1,
                      1,
                      1,
                      tzinfo=timezone.utc,
                  ) - timedelta(seconds=1)

              try:
                  yearly = get_contribution_period(
                      year_start,
                      year_end,
                  )

                  yearly_values.append({
                      "year": year,
                      "value": yearly["total"],
                  })

              except Exception as exc:
                  print(
                      f"Could not retrieve yearly data for {year}: {exc}"
                  )

                  yearly_values.append({
                      "year": year,
                      "value": 0,
                  })


          # ============================================================
          # REPOSITORY DATA
          # ============================================================

          repositories = api_get(
              f"{API_URL}/users/{USERNAME}/repos",
              params={
                  "per_page": 100,
                  "sort": "updated",
              },
          )

          public_repositories = [
              repo for repo in repositories
              if not repo.get("fork", False)
          ]

          language_counts = {}

          for repo in public_repositories:
              language = repo.get("language")

              if language:
                  language_counts[language] = (
                      language_counts.get(language, 0) + 1
                  )

          if not language_counts:
              language_counts = {
                  "Python": 1,
                  "Other": 1,
              }


          # ============================================================
          # COMMON VALUES
          # ============================================================

          contribution_metrics = {
              "Commits": current["commits"],
              "Pull Requests": current["pull_requests"],
              "Issues": current["issues"],
              "Repositories": current["repositories"],
          }

          metric_names = list(contribution_metrics.keys())
          metric_values = list(contribution_metrics.values())

          metric_colors = [
              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
          ]


          # ============================================================
          # 1. BAR CHART
          # ============================================================

          fig, ax = plt.subplots(figsize=(11, 6))

          x = np.arange(len(metric_names))

          bars = ax.bar(
              x,
              metric_values,
              width=0.62,
              color=metric_colors,
              alpha=0.95,
          )

          add_title(
              ax,
              "GITHUB CONTRIBUTION ACTIVITY",
              "Rolling 365-day activity",
          )

          ax.set_xticks(x)
          ax.set_xticklabels(
              metric_names,
              fontsize=AXIS_LABEL_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          ax.set_ylabel(
              "Count",
              fontsize=AXIS_LABEL_SIZE,
              color=STEEL_GREY,
          )

          style_axis(ax)

          maximum = max(metric_values + [1])

          for bar, value in zip(bars, metric_values):
              ax.text(
                  bar.get_x() + bar.get_width() / 2,
                  bar.get_height() + maximum * 0.025,
                  format_number(value),
                  ha="center",
                  va="bottom",
                  fontsize=VALUE_SIZE_LARGE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              max(maximum * 1.22, 1),
          )

          save_figure(
              fig,
              "github-bar-chart.png",
          )


          # ============================================================
          # 2. LINE GRAPH
          # ============================================================

          fig, ax = plt.subplots(figsize=(11, 6))

          monthly_x = np.arange(1, 13)

          ax.plot(
              monthly_x,
              monthly_counts,
              linewidth=4,
              marker="o",
              markersize=9,
              color=ELECTRIC_BLUE,
          )

          add_title(
              ax,
              "MONTHLY CONTRIBUTION MOMENTUM",
              "Current calendar year",
          )

          ax.set_xticks(monthly_x)

          ax.set_xticklabels(
              [
                  "Jan", "Feb", "Mar", "Apr",
                  "May", "Jun", "Jul", "Aug",
                  "Sep", "Oct", "Nov", "Dec"
              ],
              fontsize=AXIS_LABEL_SIZE,
              color=ICE_WHITE,
          )

          style_axis(ax)

          max_month = max(monthly_counts + [1])

          for i, value in enumerate(monthly_counts):
              ax.annotate(
                  format_number(value),
                  (
                      i + 1,
                      value
                  ),
                  xytext=(0, 13),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              max_month * 1.30,
          )

          save_figure(
              fig,
              "github-line-graph.png",
          )


          # ============================================================
          # 3. PIE CHART
          # ============================================================

          pie_values = np.array(metric_values, dtype=float)

          if pie_values.sum() <= 0:
              pie_values = np.ones(4)

          fig, ax = plt.subplots(figsize=(9, 7))

          wedges, texts, autotexts = ax.pie(
              pie_values,
              colors=metric_colors,
              startangle=90,
              autopct="%1.0f%%",
              pctdistance=0.70,
              wedgeprops={
                  "linewidth": 2,
                  "edgecolor": "none",
              },
              textprops={
                  "color": ICE_WHITE,
                  "fontsize": VALUE_SIZE,
                  "fontweight": "bold",
              },
          )

          for text in texts:
              text.set_fontsize(AXIS_LABEL_SIZE)
              text.set_color(ICE_WHITE)

          for text in autotexts:
              text.set_fontsize(VALUE_SIZE)
              text.set_fontweight("bold")
              text.set_color(ICE_WHITE)

          ax.set_title(
              "ACTIVITY SIGNAL DISTRIBUTION",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=22,
          )

          ax.legend(
              wedges,
              [
                  f"{name}: {format_number(value)}"
                  for name, value in zip(
                      metric_names,
                      metric_values,
                  )
              ],
              loc="lower center",
              bbox_to_anchor=(0.5, -0.10),
              ncol=2,
              frameon=False,
              fontsize=LEGEND_SIZE,
              labelcolor=ICE_WHITE,
          )

          save_figure(
              fig,
              "github-pie-chart.png",
          )


          # ============================================================
          # 4. HISTOGRAM
          # ============================================================

          fig, ax = plt.subplots(figsize=(11, 6))

          bins = min(20, max(5, int(math.sqrt(len(daily_counts)))))

          ax.hist(
              daily_counts,
              bins=bins,
              color=ELECTRIC_VIOLET,
              alpha=0.90,
              edgecolor="none",
          )

          add_title(
              ax,
              "DAILY CONTRIBUTION DISTRIBUTION",
              "365-day activity frequency",
          )

          ax.set_xlabel(
              "Daily contributions",
              fontsize=AXIS_LABEL_SIZE,
              color=STEEL_GREY,
          )

          ax.set_ylabel(
              "Number of days",
              fontsize=AXIS_LABEL_SIZE,
              color=STEEL_GREY,
          )

          style_axis(ax)

          save_figure(
              fig,
              "github-histogram.png",
          )


          # ============================================================
          # 5. SCATTER PLOT
          # ============================================================

          fig, ax = plt.subplots(figsize=(11, 6))

          weekday_x = np.arange(1, 8)

          sizes = [
              max(100, value * 10 + 100)
              for value in weekday_counts
          ]

          ax.scatter(
              weekday_x,
              weekday_counts,
              s=sizes,
              color=HOT_MAGENTA,
              alpha=0.85,
              edgecolors="none",
          )

          add_title(
              ax,
              "WEEKDAY ACTIVITY PATTERN",
              "Contribution volume by day of week",
          )

          ax.set_xticks(weekday_x)
          ax.set_xticklabels(
              weekday_names,
              fontsize=AXIS_LABEL_SIZE,
              color=ICE_WHITE,
          )

          style_axis(ax)

          max_weekday = max(weekday_counts + [1])

          for x_pos, value in zip(
              weekday_x,
              weekday_counts,
          ):
              ax.annotate(
                  format_number(value),
                  (x_pos, value),
                  xytext=(0, 14),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              max_weekday * 1.30,
          )

          save_figure(
              fig,
              "github-scatter-plot.png",
          )


          # ============================================================
          # 6. BOX PLOT
          # ============================================================

          fig, ax = plt.subplots(figsize=(9, 6))

          box = ax.boxplot(
              daily_counts if daily_counts else [0],
              vert=True,
              patch_artist=True,
              widths=0.42,
              boxprops={
                  "facecolor": "none",
                  "edgecolor": ACID_GREEN,
                  "linewidth": 3,
              },
              whiskerprops={
                  "color": ACID_GREEN,
                  "linewidth": 2,
              },
              capprops={
                  "color": ACID_GREEN,
                  "linewidth": 2,
              },
              medianprops={
                  "color": HOT_MAGENTA,
                  "linewidth": 4,
              },
              flierprops={
                  "marker": "o",
                  "markerfacecolor": ELECTRIC_VIOLET,
                  "markeredgecolor": ELECTRIC_VIOLET,
                  "markersize": 7,
                  "alpha": 0.7,
              },
          )

          add_title(
              ax,
              "DAILY CONTRIBUTION SPREAD",
              "Distribution across 365 days",
          )

          ax.set_xticks([1])
          ax.set_xticklabels(
              ["Daily activity"],
              fontsize=AXIS_LABEL_SIZE,
              color=ICE_WHITE,
          )

          style_axis(ax)

          median = float(np.median(daily_counts))
          mean = float(np.mean(daily_counts))

          ax.text(
              0.78,
              0.92,
              f"Median: {format_number(median)}",
              transform=ax.transAxes,
              ha="center",
              fontsize=VALUE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          ax.text(
              0.78,
              0.84,
              f"Mean: {format_number(mean)}",
              transform=ax.transAxes,
              ha="center",
              fontsize=VALUE_SIZE,
              fontweight="bold",
              color=STEEL_GREY,
          )

          save_figure(
              fig,
              "github-box-plot.png",
          )


          # ============================================================
          # 7. AREA CHART
          # ============================================================

          cumulative_monthly = np.cumsum(monthly_counts)

          fig, ax = plt.subplots(figsize=(11, 6))

          ax.fill_between(
              monthly_x,
              cumulative_monthly,
              alpha=0.28,
              color=ELECTRIC_BLUE,
          )

          ax.plot(
              monthly_x,
              cumulative_monthly,
              linewidth=4,
              color=ELECTRIC_BLUE,
              marker="o",
              markersize=8,
          )

          add_title(
              ax,
              "CUMULATIVE CONTRIBUTION GROWTH",
              "Current calendar year",
          )

          ax.set_xticks(monthly_x)

          ax.set_xticklabels(
              [
                  "Jan", "Feb", "Mar", "Apr",
                  "May", "Jun", "Jul", "Aug",
                  "Sep", "Oct", "Nov", "Dec"
              ],
              fontsize=AXIS_LABEL_SIZE,
              color=ICE_WHITE,
          )

          style_axis(ax)

          max_area = max(
              list(cumulative_monthly) + [1]
          )

          for x_pos, value in zip(
              monthly_x,
              cumulative_monthly,
          ):
              ax.annotate(
                  format_number(value),
                  (x_pos, value),
                  xytext=(0, 13),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              max_area * 1.25,
          )

          save_figure(
              fig,
              "github-area-chart.png",
          )


          # ============================================================
          # 8. BUBBLE CHART
          # ============================================================

          fig, ax = plt.subplots(figsize=(11, 6))

          bubble_sizes = [
              max(120, value * 12 + 120)
              for value in monthly_counts
          ]

          ax.scatter(
              monthly_x,
              monthly_counts,
              s=bubble_sizes,
              color=ACID_GREEN,
              alpha=0.72,
              edgecolors="none",
          )

          add_title(
              ax,
              "MONTHLY ACTIVITY BUBBLE MAP",
              "Bubble size reflects contribution volume",
          )

          ax.set_xticks(monthly_x)

          ax.set_xticklabels(
              [
                  "Jan", "Feb", "Mar", "Apr",
                  "May", "Jun", "Jul", "Aug",
                  "Sep", "Oct", "Nov", "Dec"
              ],
              fontsize=AXIS_LABEL_SIZE,
              color=ICE_WHITE,
          )

          style_axis(ax)

          max_bubble = max(monthly_counts + [1])

          for x_pos, value in zip(
              monthly_x,
              monthly_counts,
          ):
              ax.annotate(
                  format_number(value),
                  (x_pos, value),
                  xytext=(0, 15),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              max_bubble * 1.35,
          )

          save_figure(
              fig,
              "github-bubble-chart.png",
          )


          # ============================================================
          # 9. HEATMAP
          # ============================================================

          heat_start = start_date - timedelta(
              days=(start_date.weekday() + 1) % 7
          )

          heat_end = today + timedelta(
              days=6 - ((today.weekday() + 1) % 7)
          )

          total_heat_days = (
              heat_end - heat_start
          ).days + 1

          heat_weeks = total_heat_days // 7

          heat_matrix = np.zeros(
              (7, heat_weeks)
          )

          for i in range(total_heat_days):
              current_date = (
                  heat_start + timedelta(days=i)
              )

              week_index = i // 7
              weekday_index = (
                  current_date.weekday() + 1
              ) % 7

              if week_index < heat_weeks:
                  heat_matrix[
                      weekday_index,
                      week_index
                  ] = raw_day_map.get(
                      current_date,
                      0,
                  )

          fig, ax = plt.subplots(
              figsize=(15, 5.5)
          )

          max_heat = max(
              float(np.max(heat_matrix)),
              1,
          )

          for row in range(7):
              for col in range(heat_weeks):
                  value = heat_matrix[row, col]

                  if value <= 0:
                      marker_color = "#243047"
                  else:
                      ratio = min(
                          value / max_heat,
                          1,
                      )

                      if ratio < 0.33:
                          marker_color = BLUE_LIGHT
                      elif ratio < 0.66:
                          marker_color = ELECTRIC_VIOLET
                      else:
                          marker_color = ACID_GREEN

                  ax.scatter(
                      col,

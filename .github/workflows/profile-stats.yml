          def make_radar(data):
              labels = [
                  "Commits",
                  "Pull Requests",
                  "Issues",
                  "Repositories",
                  "Stars",
                  "Forks",
              ]

              raw = np.array([
                  data["commits"],
                  data["pull_requests"],
                  data["issues"],
                  data["repos"],
                  data["stars"],
                  data["forks"],
              ], dtype=float)

              max_value = max(raw.max(), 1)
              values = raw / max_value

              angles = np.linspace(
                  0,
                  2 * np.pi,
                  len(labels),
                  endpoint=False,
              )

              values = np.concatenate(
                  [values, values[:1]]
              )

              angles = np.concatenate(
                  [angles, angles[:1]]
              )

              fig = plt.figure(figsize=(16, 9))

              ax = fig.add_subplot(
                  111,
                  polar=True,
              )

              fig.patch.set_alpha(0)
              ax.set_facecolor("none")

              ax.plot(
                  angles,
                  values,
                  color=ELECTRIC_BLUE,
                  linewidth=4,
              )

              ax.fill(
                  angles,
                  values,
                  color=ELECTRIC_VIOLET,
                  alpha=0.25,
              )

              ax.scatter(
                  angles[:-1],
                  values[:-1],
                  color=ACID_GREEN,
                  s=90,
                  zorder=5,
              )

              ax.set_xticks(angles[:-1])
              ax.set_xticklabels(
                  labels,
                  color=ICE_WHITE,
                  fontsize=16,
              )

              ax.set_yticklabels([])

              ax.grid(False)

              ax.set_title(
                  "GITHUB ACTIVITY RADAR",
                  color=ELECTRIC_BLUE,
                  fontsize=29,
                  fontweight="bold",
                  pad=35,
              )


          def calculate_streak(days):
              if not days:
                  return 0, 0

              ordered = sorted(days, key=lambda x: x["date"])

              today = datetime.now(timezone.utc).date()

              lookup = {
                  datetime.fromisoformat(
                      item["date"]
                  ).date(): item["count"]
                  for item in ordered
              }

              current = 0
              cursor = today

              if lookup.get(cursor, 0) == 0:
                  cursor = today - timedelta(days=1)

              while lookup.get(cursor, 0) > 0:
                  current += 1
                  cursor -= timedelta(days=1)

              best = 0
              running = 0

              for item in ordered:
                  if item["count"] > 0:
                      running += 1
                      best = max(best, running)
                  else:
                      running = 0

              return current, best


          def make_streak(data):
              current, best = calculate_streak(data["days"])

              fig = plt.figure(figsize=(16, 8))

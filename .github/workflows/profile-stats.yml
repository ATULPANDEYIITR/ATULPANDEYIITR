name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests matplotlib numpy

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR

        run: |

          cat > generate_profile.py <<'PYTHON'

          import os
          import requests
          import numpy as np
          import matplotlib.pyplot as plt

          from collections import Counter
          from datetime import datetime, timezone, timedelta
          from matplotlib.patches import FancyBboxPatch
          from matplotlib.path import Path
          from matplotlib.patches import PathPatch


          # ============================================================
          # CONFIGURATION
          # ============================================================

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          API_HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json"
          }

          GRAPHQL_HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json"
          }

          os.makedirs("assets", exist_ok=True)


          # ============================================================
          # CLEAN OLD GENERATED PNG FILES
          # ============================================================

          for filename in os.listdir("assets"):

              if filename.endswith(".png"):

                  os.remove(
                      os.path.join(
                          "assets",
                          filename
                      )
                  )


          # ============================================================
          # ELECTRIC GAMING + SCIENTIFIC COLOR SYSTEM
          # ============================================================

          ELECTRIC_BLUE = "#0057FF"
          ACID_GREEN = "#39FF14"
          ELECTRIC_VIOLET = "#8A2BE2"
          HOT_MAGENTA = "#FF007F"

          ICE_WHITE = "#E8F1FF"
          STEEL_GREY = "#7B8CA8"

          BLUE_LIGHT = "#3D7BFF"
          GREEN_LIGHT = "#7CFF5B"
          VIOLET_LIGHT = "#B266FF"
          MAGENTA_LIGHT = "#FF4DA6"


          # ============================================================
          # MATPLOTLIB SETTINGS
          # ============================================================

          plt.rcParams.update({
              "font.family": "DejaVu Sans",
              "font.size": 9,
              "text.color": ICE_WHITE,
              "axes.labelcolor": ICE_WHITE,
              "axes.titlecolor": ELECTRIC_BLUE,
              "xtick.color": STEEL_GREY,
              "ytick.color": STEEL_GREY,
              "axes.edgecolor": ELECTRIC_BLUE,
              "figure.facecolor": "none",
              "axes.facecolor": "none",
              "savefig.facecolor": "none",
              "savefig.edgecolor": "none"
          })


          # ============================================================
          # HELPER FUNCTIONS
          # ============================================================

          def clean_axis(ax):

              ax.set_facecolor("none")

              try:
                  ax.grid(False)
              except Exception:
                  pass

              for spine in ax.spines.values():
                  spine.set_visible(False)

              ax.tick_params(
                  axis="both",
                  which="both",
                  length=0
              )


          def clean_3d_axis(ax):

              ax.set_facecolor("none")

              try:
                  ax.grid(False)
              except Exception:
                  pass

              try:

                  ax.xaxis.pane.fill = False
                  ax.yaxis.pane.fill = False
                  ax.zaxis.pane.fill = False

                  ax.xaxis.pane.set_edgecolor(
                      (0, 0, 0, 0)
                  )

                  ax.yaxis.pane.set_edgecolor(
                      (0, 0, 0, 0)
                  )

                  ax.zaxis.pane.set_edgecolor(
                      (0, 0, 0, 0)
                  )

              except Exception:
                  pass

              try:

                  ax.xaxis._axinfo["grid"]["color"] = (
                      0, 0, 0, 0
                  )

                  ax.yaxis._axinfo["grid"]["color"] = (
                      0, 0, 0, 0
                  )

                  ax.zaxis._axinfo["grid"]["color"] = (
                      0, 0, 0, 0
                  )

              except Exception:
                  pass

              try:

                  ax.tick_params(
                      axis="both",
                      which="both",
                      length=0
                  )

              except Exception:
                  pass


          def save(name):

              plt.tight_layout()

              plt.savefig(
                  f"assets/{name}.png",
                  dpi=190,
                  bbox_inches="tight",
                  transparent=True,
                  pad_inches=0.15
              )

              plt.close()


          def add_header(
              ax,
              title,
              code
          ):

              ax.text(
                  0.01,
                  1.05,
                  title,
                  transform=ax.transAxes,
                  fontsize=16,
                  fontweight="bold",
                  color=ELECTRIC_BLUE,
                  ha="left",
                  va="bottom"
              )

              ax.text(
                  0.99,
                  1.055,
                  code,
                  transform=ax.transAxes,
                  fontsize=7,
                  family="monospace",
                  color=STEEL_GREY,
                  ha="right",
                  va="bottom"
              )


          def add_value(
              ax,
              x,
              y,
              value,
              color=ACID_GREEN,
              fontsize=9
          ):

              ax.text(
                  x,
                  y,
                  f"{value:,}",
                  ha="center",
                  va="bottom",
                  fontsize=fontsize,
                  fontweight="bold",
                  family="monospace",
                  color=color
              )


          def add_3d_value(
              ax,
              x,
              y,
              z,
              value,
              color=ACID_GREEN
          ):

              ax.text(
                  x,
                  y,
                  z,
                  f"{value:,}",
                  fontsize=9,
                  fontweight="bold",
                  family="monospace",
                  color=color,
                  ha="center",
                  va="bottom"
              )


          def graphql_request(
              query,
              variables
          ):

              response = requests.post(
                  "https://api.github.com/graphql",
                  json={
                      "query": query,
                      "variables": variables
                  },
                  headers=GRAPHQL_HEADERS,
                  timeout=30
              )

              response.raise_for_status()

              result = response.json()

              if "errors" in result:

                  raise RuntimeError(
                      result["errors"]
                  )

              return result["data"]


          # ============================================================
          # GET ALL REPOSITORIES
          # ============================================================

          print("Collecting repository data...")

          repositories = []

          page = 1

          while True:

              response = requests.get(
                  f"https://api.github.com/users/{USERNAME}/repos",
                  headers=API_HEADERS,
                  params={
                      "per_page": 100,
                      "page": page,
                      "type": "owner",
                      "sort": "updated",
                      "direction": "desc"
                  },
                  timeout=30
              )

              response.raise_for_status()

              batch = response.json()

              if not batch:
                  break

              repositories.extend(batch)

              if len(batch) < 100:
                  break

              page += 1


          # ============================================================
          # CURRENT TIME
          # ============================================================

          now_utc = datetime.now(
              timezone.utc
          )

          ist = timezone(
              timedelta(
                  hours=5,
                  minutes=30
              )
          )

          now_ist = now_utc.astimezone(
              ist
          )

          generated_date = (
              now_ist.strftime(
                  "%d %B %Y"
              )
          )

          generated_time = (
              now_ist.strftime(
                  "%I:%M %p IST"
              )
          )

          current_year = now_ist.year


          # ============================================================
          # CONTRIBUTION QUERY
          # ============================================================

          CONTRIBUTION_QUERY = """
          query(
              $login: String!,
              $from: DateTime!,
              $to: DateTime!
          ) {

              user(login: $login) {

                  contributionsCollection(
                      from: $from,
                      to: $to
                  ) {

                      totalCommitContributions
                      totalPullRequestContributions
                      totalIssueContributions
                      totalRepositoryContributions

                      contributionCalendar {

                          totalContributions

                          weeks {

                              contributionDays {
                                  contributionCount
                                  date
                              }

                          }

                      }

                  }

              }

          }
          """


          def get_contribution_data(
              start_datetime,
              end_datetime
          ):

              data = graphql_request(
                  CONTRIBUTION_QUERY,
                  {
                      "login": USERNAME,
                      "from": start_datetime,
                      "to": end_datetime
                  }
              )

              return data[
                  "user"
              ][
                  "contributionsCollection"
              ]


          # ============================================================
          # LAST 365 DAYS
          # ============================================================

          rolling_start = (
              now_utc -
              timedelta(days=365)
          )

          rolling_end = now_utc

          contributions = get_contribution_data(
              rolling_start.isoformat(),
              rolling_end.isoformat()
          )

          calendar = (
              contributions[
                  "contributionCalendar"
              ]
          )


          total_contributions = (
              calendar[
                  "totalContributions"
              ]
          )

          commits = (
              contributions[
                  "totalCommitContributions"
              ]
          )

          prs = (
              contributions[
                  "totalPullRequestContributions"
              ]
          )

          issue_contributions = (
              contributions[
                  "totalIssueContributions"
              ]
          )

          repository_contributions = (
              contributions[
                  "totalRepositoryContributions"
              ]
          )


          # ============================================================
          # CONTRIBUTION DAYS
          # ============================================================

          contribution_days = []

          for week in calendar["weeks"]:

              for day in week[
                  "contributionDays"
              ]:

                  contribution_days.append(
                      day
                  )

          contribution_days.sort(
              key=lambda item: item["date"]
          )


          contribution_lookup = {

              day["date"]:
              day["contributionCount"]

              for day in contribution_days

          }


          # ============================================================
          # REPOSITORY METRICS
          # ============================================================

          repository_count = len(
              repositories
          )

          public_repositories = sum(

              1

              for repo in repositories

              if not repo["private"]

          )

          private_repositories = (
              repository_count -
              public_repositories
          )

          total_stars = sum(

              repo["stargazers_count"]

              for repo in repositories

          )

          total_forks = sum(

              repo["forks_count"]

              for repo in repositories

          )

          total_watchers = sum(

              repo["watchers_count"]

              for repo in repositories

          )


          # ============================================================
          # LANGUAGE ANALYSIS
          # ============================================================

          languages = Counter()

          for repo in repositories:

              language = repo.get(
                  "language"
              )

              if language:

                  languages[
                      language
                  ] += 1


          # ============================================================
          # TOPICS
          # ============================================================

          topics = Counter()

          for repo in repositories:

              for topic in repo.get(
                  "topics",
                  []
              ):

                  topics[
                      topic.lower()
                  ] += 1


          # ============================================================
          # STREAK
          # ============================================================

          active_dates = [

              day["date"]

              for day in contribution_days

              if day["contributionCount"] > 0

          ]


          current_streak = 0

          if active_dates:

              latest_date = max(
                  active_dates
              )

              latest_date_obj = datetime.strptime(
                  latest_date,
                  "%Y-%m-%d"
              ).date()

              today_date = (
                  now_ist.date()
              )

              if (

                  latest_date_obj ==
                  today_date

                  or

                  latest_date_obj ==
                  today_date -
                  timedelta(days=1)

              ):

                  cursor = latest_date_obj

                  while True:

                      date_string = (
                          cursor.strftime(
                              "%Y-%m-%d"
                          )
                      )

                      if contribution_lookup.get(
                          date_string,
                          0
                      ) <= 0:

                          break

                      current_streak += 1

                      cursor -= timedelta(
                          days=1
                      )


          longest_streak = 0
          running_streak = 0

          for day in contribution_days:

              if day["contributionCount"] > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:

                  running_streak = 0


          active_days = sum(

              1

              for day in contribution_days

              if day["contributionCount"] > 0

          )

          total_days = len(
              contribution_days
          )

          consistency = (

              active_days /
              total_days *
              100

              if total_days

              else 0

          )


          # ============================================================
          # MONTHLY CONTRIBUTIONS
          # ============================================================

          monthly_activity = Counter()

          for day in contribution_days:

              year = int(
                  day["date"][:4]
              )

              if year == current_year:

                  month = int(
                      day["date"][5:7]
                  )

                  monthly_activity[
                      month
                  ] += day[
                      "contributionCount"
                  ]


          current_month = now_ist.month

          month_labels = [

              "JAN",
              "FEB",
              "MAR",
              "APR",
              "MAY",
              "JUN",
              "JUL",
              "AUG",
              "SEP",
              "OCT",
              "NOV",
              "DEC"

          ]

          month_values = [

              monthly_activity.get(
                  month,
                  0
              )

              if month <= current_month

              else 0

              for month in range(1, 13)

          ]


          # ============================================================
          # ACTUAL MONTHLY COMMITS
          # ============================================================

          commit_month_values = []

          for month in range(
              1,
              current_month + 1
          ):

              month_start = datetime(
                  current_year,
                  month,
                  1,
                  tzinfo=timezone.utc
              )

              if month == 12:

                  month_end = datetime(
                      current_year + 1,
                      1,
                      1,
                      tzinfo=timezone.utc
                  )

              else:

                  month_end = datetime(
                      current_year,
                      month + 1,
                      1,
                      tzinfo=timezone.utc
                  )

              month_end = min(
                  month_end,
                  now_utc
              )

              if month_start >= month_end:

                  commit_month_values.append(
                      0
                  )

                  continue

              month_data = (
                  get_contribution_data(
                      month_start.isoformat(),
                      month_end.isoformat()
                  )
              )

              commit_month_values.append(

                  month_data[
                      "totalCommitContributions"
                  ]

              )


          commit_month_values += [

              0

              for _ in range(
                  12 -
                  len(commit_month_values)
              )

          ]


          # ============================================================
          # WEEKDAY ACTIVITY
          # ============================================================

          weekday_values = [0] * 7

          for day in contribution_days:

              dt = datetime.strptime(
                  day["date"],
                  "%Y-%m-%d"
              )

              weekday_values[
                  dt.weekday()
              ] += day[
                  "contributionCount"
              ]


          weekday_names = [

              "MON",
              "TUE",
              "WED",
              "THU",
              "FRI",
              "SAT",
              "SUN"

          ]


          # ============================================================
          # FOUR-YEAR ACTIVITY
          # ============================================================

          yearly_values = []

          for year in range(
              current_year - 3,
              current_year + 1
          ):

              year_start = datetime(
                  year,
                  1,
                  1,
                  tzinfo=timezone.utc
              )

              year_end = datetime(
                  year + 1,
                  1,
                  1,
                  tzinfo=timezone.utc
              )

              if year == current_year:

                  year_end = min(
                      year_end,
                      now_utc
                  )

              if year_start >= year_end:

                  value = 0

              else:

                  year_data = (
                      get_contribution_data(
                          year_start.isoformat(),
                          year_end.isoformat()
                      )
                  )

                  value = (
                      year_data[
                          "contributionCalendar"
                      ][
                          "totalContributions"
                      ]
                  )

              yearly_values.append(
                  (year, value)
              )


          # ============================================================
          # REPOSITORY TIMELINE
          # ============================================================

          repository_dates = []

          for repo in repositories:

              created = repo.get(
                  "created_at"
              )

              if created:

                  repository_dates.append(
                      datetime.fromisoformat(
                          created.replace(
                              "Z",
                              "+00:00"
                          )
                      )
                  )


          repository_dates.sort()


          # ============================================================
          # MOST ACTIVE MONTH
          # ============================================================

          if any(month_values):

              active_month_index = int(
                  np.argmax(
                      month_values
                  )
              )

              most_active_month = (
                  month_labels[
                      active_month_index
                  ]
              )

              most_active_month_value = (
                  month_values[
                      active_month_index
                  ]
              )

          else:

              most_active_month = "N/A"
              most_active_month_value = 0


          # ============================================================
          # MOST ACTIVE DAY
          # ============================================================

          if any(weekday_values):

              active_day_index = int(
                  np.argmax(
                      weekday_values
                  )
              )

              most_active_weekday = (
                  weekday_names[
                      active_day_index
                  ]
              )

              most_active_weekday_value = (
                  weekday_values[
                      active_day_index
                  ]
              )

          else:

              most_active_weekday = "N/A"
              most_active_weekday_value = 0


          # ============================================================
          # 01. BAR CHART
          # ============================================================

          labels = [

              "COMMITS",
              "CONTRIB.",
              "PULL REQUESTS",
              "ISSUES",
              "REPOS",
              "STARS"

          ]

          values = [

              commits,
              total_contributions,
              prs,
              issue_contributions,
              repository_count,
              total_stars

          ]

          colors = [

              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
              BLUE_LIGHT,
              VIOLET_LIGHT

          ]


          fig, ax = plt.subplots(
              figsize=(15, 5.5)
          )

          clean_axis(ax)

          x = np.arange(
              len(labels)
          )

          bars = ax.bar(
              x,
              values,
              width=0.60,
              color=colors,
              alpha=0.95
          )

          for index, (
              bar,
              value
          ) in enumerate(
              zip(
                  bars,
                  values
              )
          ):

              add_value(
                  ax,
                  bar.get_x()
                  + bar.get_width() / 2,
                  bar.get_height(),
                  value,
                  colors[index]
              )

          ax.set_xticks(x)

          ax.set_xticklabels(
              labels,
              fontsize=8
          )

          ax.set_yticks([])

          add_header(
              ax,
              "GITHUB ACTIVITY BAR MATRIX",
              "CHART://BAR"
          )

          save(
              "github-bar-chart"
          )


          # ============================================================
          # 02. LINE GRAPH
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(15, 5)
          )

          clean_axis(ax)

          x = np.arange(
              1,
              len(contribution_days) + 1
          )

          y = np.array([

              day["contributionCount"]

              for day in contribution_days

          ])

          ax.plot(
              x,
              y,
              color=ELECTRIC_BLUE,
              linewidth=2
          )

          ax.fill_between(
              x,
              y,
              0,
              color=ELECTRIC_BLUE,
              alpha=0.08
          )

          if len(y) > 0:

              peak = int(
                  np.argmax(y)
              )

              ax.scatter(
                  [x[peak]],
                  [y[peak]],
                  color=HOT_MAGENTA,
                  s=55,
                  zorder=5
              )

              ax.annotate(
                  f"{int(y[peak]):,}",
                  (
                      x[peak],
                      y[peak]
                  ),
                  xytext=(0, 10),
                  textcoords="offset points",
                  ha="center",
                  color=HOT_MAGENTA,
                  fontweight="bold",
                  family="monospace"
              )

          ax.set_xticks([])
          ax.set_yticks([])

          add_header(
              ax,
              "CONTRIBUTION VELOCITY",
              "CHART://LINE"
          )

          save(
              "github-line-graph"
          )


          # ============================================================
          # 03. PIE CHART
          # ============================================================

          pie_labels = [

              "COMMITS",
              "PULL REQUESTS",
              "ISSUES",
              "REPOSITORY CONTRIBUTIONS"

          ]

          pie_values = [

              commits,
              prs,
              issue_contributions,
              repository_contributions

          ]

          pie_colors = [

              ELECTRIC_BLUE,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
              ACID_GREEN

          ]


          if sum(pie_values) == 0:

              pie_values = [
                  1,
                  1,
                  1,
                  1
              ]


          fig, ax = plt.subplots(
              figsize=(8, 7)
          )

          ax.set_facecolor("none")

          wedges, texts, autotexts = ax.pie(

              pie_values,

              colors=pie_colors,

              autopct=lambda p:
                  f"{p:.0f}%"
                  if p >= 4
                  else "",

              startangle=90,

              wedgeprops={
                  "linewidth": 1.5,
                  "edgecolor": ICE_WHITE,
                  "alpha": 0.92
              }

          )

          for text in texts:

              text.set_color(
                  ICE_WHITE
              )

              text.set_fontsize(8)

          for text in autotexts:

              text.set_color(
                  ICE_WHITE
              )

              text.set_fontsize(8)

              text.set_fontweight(
                  "bold"
              )

          ax.set_title(
              "CONTRIBUTION COMPOSITION",
              fontsize=16,
              fontweight="bold",
              color=ELECTRIC_BLUE,
              pad=20
          )

          ax.legend(
              wedges,
              pie_labels,
              loc="lower center",
              bbox_to_anchor=(0.5, -0.08),
              ncol=2,
              frameon=False,
              fontsize=7
          )

          save(
              "github-pie-chart"
          )


          # ============================================================
          # 04. HISTOGRAM
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(14, 5)
          )

          clean_axis(ax)

          histogram_values = [

              day["contributionCount"]

              for day in contribution_days

              if day["contributionCount"] > 0

          ]


          if histogram_values:

              ax.hist(
                  histogram_values,
                  bins=min(
                      15,
                      max(
                          5,
                          len(
                              set(
                                  histogram_values
                              )
                          )
                      )
                  ),
                  color=ELECTRIC_VIOLET,
                  alpha=0.90,
                  edgecolor=HOT_MAGENTA,
                  linewidth=0.8
              )

          else:

              ax.text(
                  0.5,
                  0.5,
                  "NO ACTIVE CONTRIBUTION DAYS",
                  transform=ax.transAxes,
                  ha="center",
                  va="center",
                  color=STEEL_GREY
              )

          ax.set_xticks([])
          ax.set_yticks([])

          add_header(
              ax,
              "DAILY CONTRIBUTION DISTRIBUTION",
              "CHART://HISTOGRAM"
          )

          save(
              "github-histogram"
          )


          # ============================================================
          # 05. SCATTER PLOT
          # ============================================================

          scatter_x = []
          scatter_y = []

          for index, value in enumerate(
              weekday_values
          ):

              scatter_x.append(
                  index + 1
              )

              scatter_y.append(
                  value
              )


          fig, ax = plt.subplots(
              figsize=(13, 5)
          )

          clean_axis(ax)

          ax.scatter(
              scatter_x,
              scatter_y,
              s=120,
              color=ACID_GREEN,
              edgecolors=HOT_MAGENTA,
              linewidths=1.2
          )

          for x_value, y_value in zip(
              scatter_x,
              scatter_y
          ):

              ax.text(
                  x_value,
                  y_value,
                  f"{y_value:,}",
                  xytext=(0, 9),
                  textcoords="offset points",
                  ha="center",
                  color=ICE_WHITE,
                  fontsize=7,
                  family="monospace"
              )

          ax.set_xticks(

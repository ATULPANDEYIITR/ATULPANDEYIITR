name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate GitHub profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ATULPANDEYIITR
          cards: "overview,contributions,composition,rhythm,lifetime,repositories,languages"
          output-dir: assets
          themes: "dark,light"
          language-limit: 8
          commit: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python package
        run: pip install requests

      - name: Generate Dynamic GitHub Activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR
        run: |
          cat > generate_profile.py <<'PYTHON'
          import os
          import requests

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json"
          }

          query = """
          query($login: String!) {
            user(login: $login) {
              login
              name

              followers {
                totalCount
              }

              following {
                totalCount
              }

              repositories(
                first: 20
                ownerAffiliations: OWNER
                orderBy: {field: UPDATED_AT, direction: DESC}
              ) {
                totalCount

                nodes {
                  name
                  stargazerCount
                  forkCount

                  watchers {
                    totalCount
                  }

                  defaultBranchRef {
                    target {
                      ... on Commit {
                        history(first: 5) {
                          nodes {
                            messageHeadline
                            committedDate
                            url
                          }
                        }
                      }
                    }
                  }
                }
              }

              contributionsCollection {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }

              pullRequests(first: 1) {
                totalCount
              }

              issues(first: 1) {
                totalCount
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {
                      "login": USERNAME
                  }
              },
              headers=headers
          )

          response.raise_for_status()

          data = response.json()

          if "errors" in data:
              raise RuntimeError(data["errors"])

          user = data["data"]["user"]

          contributions = (
              user["contributionsCollection"]
              ["contributionCalendar"]
              ["totalContributions"]
          )

          print(f"GitHub activity data collected for {user['login']}")
          print(f"Followers: {user['followers']['totalCount']}")
          print(f"Following: {user['following']['totalCount']}")
          print(f"Repositories: {user['repositories']['totalCount']}")
          print(f"Pull Requests: {user['pullRequests']['totalCount']}")
          print(f"Issues: {user['issues']['totalCount']}")
          print(f"Contributions: {contributions}")

          print("Dynamic GitHub activity data collected successfully.")
          PYTHON

          python generate_profile.py

      - name: Save updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update GitHub profile statistics"
          git push

name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  generate-profile-dashboard:
    name: Generate GitHub Profile Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      GITHUB_USERNAME: ATULPANDEYIITR
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests matplotlib numpy

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import math
          import requests
          import numpy as np
          import matplotlib.pyplot as plt
          from collections import Counter
          from datetime import datetime, timezone, timedelta

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          ASSETS = "assets"
          os.makedirs(ASSETS, exist_ok=True)

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          graphql_url = "https://api.github.com/graphql"

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              login
              name
              followers {
                totalCount
              }
              following {
                totalCount
              }
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalRepositoriesWithContributedCommits
                restrictedContributionsCount

                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          now = datetime.now(timezone.utc)
          from_date = now - timedelta(days=364)

          response = requests.post(
              graphql_url,
              headers=headers,
              json={
                  "query": query,
                  "variables": {
                      "login": USERNAME,
                      "from": from_date.isoformat(),
                      "to": now.isoformat(),
                  },
              },
              timeout=60,
          )

          response.raise_for_status()
          payload = response.json()

          if "errors" in payload:
              raise RuntimeError(payload["errors"])

          user = payload["data"]["user"]

          if not user:
              raise RuntimeError(f"GitHub user not found: {USERNAME}")

          contributions = user["contributionsCollection"]
          calendar = contributions["contributionCalendar"]

          days = []
          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"],
                  })

          counts = [d["count"] for d in days]

          total_contributions = calendar["totalContributions"]
          commits = contributions["totalCommitContributions"]
          issues = contributions["totalIssueContributions"]
          prs = contributions["totalPullRequestContributions"]
          contributed_repos = contributions["totalRepositoriesWithContributedCommits"]
          restricted = contributions["restrictedContributionsCount"]

          rest_url = f"https://api.github.com/users/{USERNAME}"

          profile_response = requests.get(
              rest_url,
              headers=headers,
              timeout=60,
          )

          profile_response.raise_for_status()
          profile = profile_response.json()

          public_repos = profile.get("public_repos", 0)

          repos = []

          for page in range(1, 21):
              repo_response = requests.get(
                  f"https://api.github.com/users/{USERNAME}/repos",
                  headers=headers,
                  params={
                      "per_page": 100,
                      "page": page,
                      "sort": "updated",
                      "direction": "desc",
                  },
                  timeout=60,
              )

              repo_response.raise_for_status()
              page_data = repo_response.json()

              if not page_data:
                  break

              repos.extend(page_data)

              if len(page_data) < 100:
                  break

          language_counts = Counter()

          total_stars = 0
          total_forks = 0

          for repo in repos:
              if repo.get("fork"):
                  continue

              total_stars += repo.get("stargazers_count", 0)
              total_forks += repo.get("forks_count", 0)

              language = repo.get("language")

              if language:
                  language_counts[language] += 1

          repo_count = len([r for r in repos if not r.get("fork")])

          if repo_count == 0:
              repo_count = public_repos

          # ------------------------------------------------------------
          # Helper functions
          # ------------------------------------------------------------

          def save(fig, filename):
              path = os.path.join(ASSETS, filename)

              fig.savefig(
                  path,
                  dpi=180,
                  bbox_inches="tight",
                  transparent=True,
              )

              plt.close(fig)

              if not os.path.exists(path):
                  raise RuntimeError(f"Failed to generate {path}")

              if os.path.getsize(path) < 1000:
                  raise RuntimeError(f"Generated file is suspiciously small: {path}")

          def title_text():
              return f"{USERNAME} | GitHub Activity"

          # ------------------------------------------------------------
          # 1. Area chart
          # ------------------------------------------------------------

          fig, ax = plt.subplots(figsize=(14, 5))

          x = np.arange(len(counts))

          ax.fill_between(x, counts, alpha=0.35)
          ax.plot(x, counts, linewidth=1.5)

          ax.set_title(title_text() + " | Contribution Area")
          ax.set_xlabel("Contribution days")
          ax.set_ylabel("Contributions")

          ax.grid(alpha=0.2)

          save(fig, "github-area-chart.png")

          # ------------------------------------------------------------
          # 2. Bar chart
          # ------------------------------------------------------------

          categories = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Contributions",
          ]

          values = [
              commits,
              prs,
              issues,
              total_contributions,
          ]

          fig, ax = plt.subplots(figsize=(12, 6))

          ax.bar(categories, values)

          ax.set_title(title_text() + " | Activity Breakdown")
          ax.set_ylabel("Count")

          ax.tick_params(axis="x", rotation=20)
          ax.grid(axis="y", alpha=0.2)

          save(fig, "github-bar-chart.png")

          # ------------------------------------------------------------
          # 3. Box plot
          # ------------------------------------------------------------

          fig, ax = plt.subplots(figsize=(10, 6))

          ax.boxplot(counts)

          ax.set_title(title_text() + " | Contribution Distribution")
          ax.set_ylabel("Daily Contributions")

          ax.grid(axis="y", alpha=0.2)

          save(fig, "github-box-plot.png")

          # ------------------------------------------------------------
          # 4. Bubble chart
          # ------------------------------------------------------------

          x_values = np.arange(len(categories))
          bubble_sizes = [max(v, 1) * 20 for v in values]

          fig, ax = plt.subplots(figsize=(12, 7))

          ax.scatter(
              x_values,
              values,
              s=bubble_sizes,
              alpha=0.6,
          )

          ax.set_xticks(x_values)
          ax.set_xticklabels(categories, rotation=20)

          ax.set_title(title_text() + " | Activity Bubble Map")
          ax.set_ylabel("Activity")

          ax.grid(alpha=0.2)

          save(fig, "github-bubble-chart.png")

          # ------------------------------------------------------------
          # 5. Developer telemetry
          # ------------------------------------------------------------

          telemetry_labels = [
              "Commits",
              "PRs",
              "Issues",
              "Repos",
              "Stars",
              "Forks",
          ]

          telemetry_values = [
              commits,
              prs,
              issues,
              repo_count,
              total_stars,
              total_forks,
          ]

          fig, ax = plt.subplots(figsize=(14, 6))

          ax.plot(
              telemetry_labels,
              telemetry_values,
              marker="o",
              linewidth=2,
          )

          ax.set_title(title_text() + " | Developer Telemetry")
          ax.set_ylabel("Value")

          ax.tick_params(axis="x", rotation=25)
          ax.grid(alpha=0.2)

          save(fig, "github-developer-telemetry.png")

          # ------------------------------------------------------------
          # 6. Donut chart
          # ------------------------------------------------------------

          donut_labels = [
              "Commits",
              "PRs",
              "Issues",
          ]

          donut_values = [
              max(commits, 0),
              max(prs, 0),
              max(issues, 0),
          ]

          if sum(donut_values) == 0:
              donut_values = [1, 1, 1]

          fig, ax = plt.subplots(figsize=(8, 8))

          ax.pie(
              donut_values,
              labels=donut_labels,
              autopct="%1.1f%%",
              wedgeprops={"width": 0.4},
          )

          ax.set_title(title_text() + " | Contribution Composition")

          save(fig, "github-donut-chart.png")

          # ------------------------------------------------------------
          # 7. Funnel chart
          # ------------------------------------------------------------

          funnel_labels = [
              "Repositories",
              "Commits",
              "Pull Requests",
              "Issues",
          ]

          funnel_values = [
              repo_count,
              commits,
              prs,
              issues,
          ]

          fig, ax = plt.subplots(figsize=(11, 7))

          y = np.arange(len(funnel_labels))

          ax.barh(y, funnel_values)

          ax.set_yticks(y)
          ax.set_yticklabels(funnel_labels)

          ax.invert_yaxis()

          ax.set_title(title_text() + " | Activity Funnel")
          ax.set_xlabel("Count")

          ax.grid(axis="x", alpha=0.2)

          save(fig, "github-funnel-chart.png")

          # ------------------------------------------------------------
          # 8. Heatmap
          # ------------------------------------------------------------

          heatmap = np.zeros((7, 53))

          for index, item in enumerate(days):
              week = index // 7
              weekday = index % 7

              if week < 53:
                  heatmap[weekday, week] = item["count"]

          fig, ax = plt.subplots(figsize=(16, 6))

          image = ax.imshow(
              heatmap,
              aspect="auto",
              interpolation="nearest",
          )

          ax.set_title(title_text() + " | Contribution Heatmap")
          ax.set_xlabel("Weeks")
          ax.set_ylabel("Day of week")

          ax.set_yticks(range(7))
          ax.set_yticklabels([
              "Mon",
              "Tue",
              "Wed",
              "Thu",
              "Fri",
              "Sat",
              "Sun",
          ])

          fig.colorbar(image, ax=ax, label="Contributions")

          save(fig, "github-heatmap.png")

          # ------------------------------------------------------------
          # 9. Histogram
          # ------------------------------------------------------------

          fig, ax = plt.subplots(figsize=(12, 6))

          bins = max(5, min(30, int(math.sqrt(len(counts)))))

          ax.hist(
              counts,
              bins=bins,
              edgecolor="black",
          )

          ax.set_title(title_text() + " | Daily Contribution Histogram")
          ax.set_xlabel("Daily Contributions")
          ax.set_ylabel("Number of Days")

          ax.grid(axis="y", alpha=0.2)

          save(fig, "github-histogram.png")

          # ------------------------------------------------------------
          # 10. Line graph
          # ------------------------------------------------------------

          fig, ax = plt.subplots(figsize=(14, 6))

          ax.plot(
              x,
              counts,
              linewidth=2,
          )

          ax.set_title(title_text() + " | Contribution Trend")
          ax.set_xlabel("Days")
          ax.set_ylabel("Contributions")

          ax.grid(alpha=0.2)

          save(fig, "github-line-graph.png")

          # ------------------------------------------------------------
          # 11. Pie chart
          # ------------------------------------------------------------

          pie_labels = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Restricted",
          ]

          pie_values = [
              commits,
              prs,
              issues,
              restricted,
          ]

          if sum(pie_values) == 0:
              pie_values = [1, 1, 1, 1]

          fig, ax = plt.subplots(figsize=(8, 8))

          ax.pie(
              pie_values,
              labels=pie_labels,
              autopct="%1.1f%%",
          )

          ax.set_title(title_text() + " | Activity Distribution")

          save(fig, "github-pie-chart.png")

          # ------------------------------------------------------------
          # 12. Radar chart
          # ------------------------------------------------------------

          radar_labels = [
              "Commits",
              "PRs",
              "Issues",
              "Repos",
              "Stars",
              "Forks",
          ]

          radar_values = np.array([
              commits,
              prs,
              issues,
              repo_count,
              total_stars,
              total_forks,
          ], dtype=float)

          max_value = max(radar_values.max(), 1)

          radar_values = radar_values / max_value

          angles = np.linspace(
              0,
              2 * np.pi,
              len(radar_labels),
              endpoint=False,
          )

          radar_values = np.concatenate([
              radar_values,
              [radar_values[0]],
          ])

          angles = np.concatenate([
              angles,
              [angles[0]],
          ])

          fig = plt.figure(figsize=(8, 8))

          ax = fig.add_subplot(111, polar=True)

          ax.plot(angles, radar_values, linewidth=2)
          ax.fill(angles, radar_values, alpha=0.25)

          ax.set_xticks(angles[:-1])
          ax.set_xticklabels(radar_labels)

          ax.set_title(title_text() + " | Developer Radar")

          save(fig, "github-radar-chart.png")

          # ------------------------------------------------------------
          # 13. Sankey-style diagram
          # ------------------------------------------------------------

          source_labels = [
              "Repositories",
              "Commits",
              "Pull Requests",
              "Issues",
          ]

          source_values = [
              repo_count,
              commits,
              prs,
              issues,
          ]

          fig, ax = plt.subplots(figsize=(12, 7))

          left_x = 0
          right_x = 1

          left_positions = np.linspace(
              0.85,
              0.15,
              len(source_labels),
          )

          for y_pos, label, value in zip(
              left_positions,
              source_labels,
              source_values,
          ):
              ax.text(
                  left_x,
                  y_pos,
                  f"{label}\n{value}",
                  ha="center",
                  va="center",
                  fontsize=10,
              )

          ax.text(
              right_x,
              0.5,
              f"GitHub Activity\n{total_contributions}",
              ha="center",
              va="center",
              fontsize=12,
              fontweight="bold",
          )

          for y_pos in left_positions:
              ax.plot(
                  [0.12, 0.88],
                  [y_pos, 0.5],
                  linewidth=2,
                  alpha=0.5,
              )

          ax.set_xlim(-0.1, 1.1)
          ax.set_ylim(0, 1)
          ax.axis("off")

          ax.set_title(title_text() + " | Activity Flow")

          save(fig, "github-sankey-diagram.png")

          # ------------------------------------------------------------
          # 14. Scatter plot
          # ------------------------------------------------------------

          cumulative = np.cumsum(counts)

          fig, ax = plt.subplots(figsize=(12, 7))

          ax.scatter(
              counts,
              cumulative,
              alpha=0.65,
          )

          ax.set_title(title_text() + " | Contribution Scatter")
          ax.set_xlabel("Daily Contributions")
          ax.set_ylabel("Cumulative Contributions")

          ax.grid(alpha=0.2)

          save(fig, "github-scatter-plot.png")

          # ------------------------------------------------------------
          # 15. Streak system
          # ------------------------------------------------------------

          longest_streak = 0
          current_streak = 0

          for count in counts:
              if count > 0:
                  current_streak += 1
                  longest_streak = max(
                      longest_streak,
                      current_streak,
                  )
              else:
                  current_streak = 0

          current_streak = 0

          for count in reversed(counts):
              if count > 0:
                  current_streak += 1
              else:
                  break

          streak_labels = [
              "Current streak",
              "Longest streak",
          ]

          streak_values = [
              current_streak,
              longest_streak,
          ]

          fig, ax = plt.subplots(figsize=(10, 6))

          ax.bar(
              streak_labels,
              streak_values,
          )

          ax.set_title(title_text() + " | Streak System")
          ax.set_ylabel("Days")

          ax.grid(axis="y", alpha=0.2)

          save(fig, "github-streak-system.png")

          # ------------------------------------------------------------
          # 16. Treemap-style chart
          # ------------------------------------------------------------

          top_languages = language_counts.most_common(10)

          if not top_languages:
              top_languages = [("No language data", 1)]

          labels = [
              f"{name}\n{count}"
              for name, count in top_languages
          ]

          sizes = [
              count
              for _, count in top_languages
          ]

          fig, ax = plt.subplots(figsize=(14, 7))

          ax.bar(
              labels,
              sizes,
          )

          ax.set_title(title_text() + " | Repository Language Landscape")
          ax.set_ylabel("Repositories")

          ax.tick_params(axis="x", rotation=35)

          ax.grid(axis="y", alpha=0.2)

          save(fig, "github-treemap.png")

          # ------------------------------------------------------------
          # 17. Waterfall chart
          # ------------------------------------------------------------

          waterfall_labels = [
              "Repositories",
              "Commits",
              "Pull Requests",
              "Issues",
              "Stars",
              "Forks",
          ]

          waterfall_values = [
              repo_count,
              commits,
              prs,
              issues,
              total_stars,
              total_forks,
          ]

          cumulative_values = np.cumsum(waterfall_values)

          fig, ax = plt.subplots(figsize=(14, 7))

          ax.bar(
              waterfall_labels,
              waterfall_values,
          )

          ax.plot(
              waterfall_labels,
              cumulative_values,
              marker="o",
              linewidth=2,
          )

          ax.set_title(title_text() + " | Developer Metrics Waterfall")
          ax.set_ylabel("Value")

          ax.tick_params(axis="x", rotation=25)

          ax.grid(axis="y", alpha=0.2)

          save(fig, "github-waterfall-chart.png")

          # ------------------------------------------------------------
          # Final validation inside Python
          # ------------------------------------------------------------

          expected_files = [
              "github-area-chart.png",
              "github-bar-chart.png",
              "github-box-plot.png",
              "github-bubble-chart.png",
              "github-developer-telemetry.png",
              "github-donut-chart.png",
              "github-funnel-chart.png",
              "github-heatmap.png",
              "github-histogram.png",
              "github-line-graph.png",
              "github-pie-chart.png",
              "github-radar-chart.png",
              "github-sankey-diagram.png",
              "github-scatter-plot.png",
              "github-streak-system.png",
              "github-treemap.png",
              "github-waterfall-chart.png",
          ]

          print("")
          print("Generated dashboard files:")

          for filename in expected_files:
              path = os.path.join(ASSETS, filename)

              if not os.path.isfile(path):
                  raise RuntimeError(
                      f"Expected dashboard file was not generated: {path}"
                  )

              size = os.path.getsize(path)

              if size < 1000:
                  raise RuntimeError(
                      f"Dashboard file is too small: {path} ({size} bytes)"
                  )

              print(f"OK  {path}  {size:,} bytes")

          print("")
          print(f"GitHub user: {USERNAME}")
          print(f"Repositories: {repo_count}")
          print(f"Stars: {total_stars}")
          print(f"Forks: {total_forks}")
          print(f"Commits: {commits}")
          print(f"Pull Requests: {prs}")
          print(f"Issues: {issues}")
          print(f"Contributions: {total_contributions}")
          print(f"Current streak: {current_streak}")
          print(f"Longest streak: {longest_streak}")

          print("")
          print("Dashboard generation completed successfully.")
          PY

      - name: Validate generated dashboard
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Validating required GitHub dashboard files..."

          EXPECTED_FILES=(
            "github-area-chart.png"
            "github-bar-chart.png"
            "github-box-plot.png"
            "github-bubble-chart.png"
            "github-developer-telemetry.png"
            "github-donut-chart.png"
            "github-funnel-chart.png"
            "github-heatmap.png"
            "github-histogram.png"
            "github-line-graph.png"
            "github-pie-chart.png"
            "github-radar-chart.png"
            "github-sankey-diagram.png"
            "github-scatter-plot.png"
            "github-streak-system.png"
            "github-treemap.png"
            "github-waterfall-chart.png"
          )

          FAILED=0

          for FILE in "${EXPECTED_FILES[@]}"; do
            PATH_TO_FILE="assets/$FILE"

            if [ ! -f "$PATH_TO_FILE" ]; then
              echo "MISSING: $PATH_TO_FILE"
              FAILED=1
              continue
            fi

            SIZE="$(stat -c%s "$PATH_TO_FILE")"

            if [ "$SIZE" -lt 1000 ]; then
              echo "TOO SMALL: $PATH_TO_FILE ($SIZE bytes)"
              FAILED=1
              continue
            fi

            echo "OK: $PATH_TO_FILE ($SIZE bytes)"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Dashboard validation FAILED."
            exit 1
          fi

          echo ""
          echo "Dashboard validation successful."
          echo ""
          echo "Other PNG assets are allowed and will not cause validation failure."

          echo ""
          echo "All PNG assets currently in assets/:"
          find assets -maxdepth 1 -type f -name "*.png" -print | sort

      - name: Commit updated dashboard images
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.png

          echo "Git status:"
          git status --short

          if git diff --cached --quiet; then
            echo "No dashboard changes detected."
            exit 0
          fi

          git commit -m "Update GitHub profile dashboard"

          git push origin "HEAD:${DEFAULT_BRANCH}"

name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests matplotlib numpy

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR
        run: |

          cat > generate_profile.py <<'PYTHON'

          import os
          import requests
          import numpy as np
          import matplotlib.pyplot as plt

          from collections import Counter
          from datetime import datetime, timezone, timedelta


          # ============================================================
          # CONFIGURATION
          # ============================================================

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          API_HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json"
          }

          GRAPHQL_HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json"
          }

          os.makedirs("assets", exist_ok=True)


          # ============================================================
          # CYAN + BLUE + VIOLET VISUAL SYSTEM
          # ============================================================

          # Primary data
          CYAN = "#00E5FF"
          CYAN_LIGHT = "#00B8D4"
          CYAN_BRIGHT = "#18FFFF"

          # Secondary data
          BLUE = "#2979FF"
          BLUE_LIGHT = "#448AFF"

          # Highlights / peaks
          VIOLET = "#7C4DFF"
          VIOLET_LIGHT = "#B388FF"

          # Supporting information
          TEXT = "#00B8D4"
          TEXT_LIGHT = "#4DB6AC"
          MUTED = "#78909C"

          TRANSPARENT = True

          plt.rcParams.update({
              "font.family": "DejaVu Sans",
              "font.size": 9,
              "text.color": TEXT,
              "axes.labelcolor": TEXT,
              "axes.titlecolor": CYAN,
              "xtick.color": TEXT_LIGHT,
              "ytick.color": TEXT_LIGHT,
              "axes.edgecolor": CYAN,
              "figure.facecolor": "none",
              "axes.facecolor": "none",
              "savefig.facecolor": "none",
              "savefig.edgecolor": "none"
          })


          # ============================================================
          # HELPER FUNCTIONS
          # ============================================================

          def clean_axis(ax):
              """
              Remove conventional chart background and grid.
              """

              ax.set_facecolor("none")

              try:
                  ax.grid(False)
              except Exception:
                  pass

              for spine in ax.spines.values():
                  spine.set_visible(False)

              ax.tick_params(
                  axis="both",
                  which="both",
                  length=0
              )


          def clean_3d_axis(ax):
              """
              Fully transparent dimensional visualization.
              """

              ax.set_facecolor("none")

              try:
                  ax.grid(False)
              except Exception:
                  pass

              try:
                  ax.xaxis.pane.fill = False
                  ax.yaxis.pane.fill = False
                  ax.zaxis.pane.fill = False

                  ax.xaxis.pane.set_edgecolor(
                      (0, 0, 0, 0)
                  )

                  ax.yaxis.pane.set_edgecolor(
                      (0, 0, 0, 0)
                  )

                  ax.zaxis.pane.set_edgecolor(
                      (0, 0, 0, 0)
                  )
              except Exception:
                  pass

              try:
                  ax.xaxis._axinfo["grid"]["color"] = (
                      0, 0, 0, 0
                  )

                  ax.yaxis._axinfo["grid"]["color"] = (
                      0, 0, 0, 0
                  )

                  ax.zaxis._axinfo["grid"]["color"] = (
                      0, 0, 0, 0
                  )
              except Exception:
                  pass

              try:
                  ax.tick_params(
                      axis="both",
                      which="both",
                      length=0
                  )
              except Exception:
                  pass


          def save(name):
              """
              Save completely transparent PNG.
              """

              plt.tight_layout()

              plt.savefig(
                  f"assets/{name}.png",
                  dpi=190,
                  bbox_inches="tight",
                  transparent=True,
                  pad_inches=0.12
              )

              plt.close()


          def add_hud_header(
              ax,
              title,
              code
          ):
              """
              Minimal technical heading.
              """

              ax.text(
                  0.01,
                  1.04,
                  title,
                  transform=ax.transAxes,
                  fontsize=16,
                  fontweight="bold",
                  color=CYAN,
                  ha="left",
                  va="bottom"
              )

              ax.text(
                  0.99,
                  1.045,
                  code,
                  transform=ax.transAxes,
                  fontsize=7,
                  family="monospace",
                  color=MUTED,
                  ha="right",
                  va="bottom"
              )


          def add_value(
              ax,
              x,
              y,
              value,
              color=CYAN
          ):
              ax.text(
                  x,
                  y,
                  f"{value:,}",
                  fontsize=10,
                  fontweight="bold",
                  family="monospace",
                  color=color,
                  ha="center",
                  va="bottom"
              )


          def add_3d_value(
              ax,
              x,
              y,
              z,
              value,
              color=CYAN
          ):
              ax.text(
                  x,
                  y,
                  z,
                  f"{value:,}",
                  fontsize=9,
                  fontweight="bold",
                  family="monospace",
                  color=color,
                  ha="center",
                  va="bottom"
              )


          # ============================================================
          # GET ALL REPOSITORIES
          # ============================================================

          print("Collecting repository data...")

          repositories = []

          page = 1

          while True:

              response = requests.get(
                  f"https://api.github.com/users/{USERNAME}/repos",
                  headers=API_HEADERS,
                  params={
                      "per_page": 100,
                      "page": page,
                      "type": "owner",
                      "sort": "updated",
                      "direction": "desc"
                  },
                  timeout=30
              )

              response.raise_for_status()

              batch = response.json()

              if not batch:
                  break

              repositories.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          print(
              f"Repositories discovered: "
              f"{len(repositories)}"
          )


          # ============================================================
          # GRAPHQL CONTRIBUTION DATA
          # ============================================================

          QUERY = """
          query($login: String!) {

            user(login: $login) {

              contributionsCollection {

                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                totalRepositoryContributions

                contributionCalendar {

                  totalContributions

                  weeks {

                    contributionDays {
                      contributionCount
                      date
                    }

                  }

                }

              }

            }

          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": QUERY,
                  "variables": {
                      "login": USERNAME
                  }
              },
              headers=GRAPHQL_HEADERS,
              timeout=30
          )

          response.raise_for_status()

          graphql_result = response.json()

          if "errors" in graphql_result:
              raise RuntimeError(
                  graphql_result["errors"]
              )

          user = graphql_result["data"]["user"]

          contributions = (
              user["contributionsCollection"]
          )

          calendar = (
              contributions["contributionCalendar"]
          )


          # ============================================================
          # CORE CONTRIBUTION VALUES
          # ============================================================

          total_contributions = (
              calendar["totalContributions"]
          )

          commits = (
              contributions[
                  "totalCommitContributions"
              ]
          )

          prs = (
              contributions[
                  "totalPullRequestContributions"
              ]
          )

          issue_contributions = (
              contributions[
                  "totalIssueContributions"
              ]
          )

          repository_contributions = (
              contributions[
                  "totalRepositoryContributions"
              ]
          )


          # ============================================================
          # CONTRIBUTION DAYS
          # ============================================================

          contribution_days = []

          for week in calendar["weeks"]:

              for day in week["contributionDays"]:

                  contribution_days.append(day)

          contribution_days.sort(
              key=lambda item: item["date"]
          )


          # ============================================================
          # CURRENT DATE
          # ============================================================

          now_utc = datetime.now(timezone.utc)

          ist = timezone(
              timedelta(
                  hours=5,
                  minutes=30
              )
          )

          now_ist = now_utc.astimezone(ist)

          generated_date = (
              now_ist.strftime("%d %B %Y")
          )

          generated_time = (
              now_ist.strftime("%I:%M %p IST")
          )

          current_year = now_ist.year


          # ============================================================
          # REPOSITORY METRICS
          # ============================================================

          repository_count = len(
              repositories
          )

          public_repositories = sum(
              1
              for repo in repositories
              if not repo["private"]
          )

          total_stars = sum(
              repo["stargazers_count"]
              for repo in repositories
          )

          total_forks = sum(
              repo["forks_count"]
              for repo in repositories
          )

          total_watchers = sum(
              repo["watchers_count"]
              for repo in repositories
          )


          # ============================================================
          # LANGUAGE ANALYSIS
          # ============================================================

          languages = Counter()

          for repo in repositories:

              language = repo.get("language")

              if language:
                  languages[language] += 1


          # ============================================================
          # TOPICS / DOMAIN DATA
          # ============================================================

          topics = Counter()

          for repo in repositories:

              repo_topics = repo.get(
                  "topics",
                  []
              )

              for topic in repo_topics:
                  topics[topic.lower()] += 1


          # ============================================================
          # STREAK ANALYSIS
          # ============================================================

          contribution_lookup = {
              day["date"]: day["contributionCount"]
              for day in contribution_days
          }

          today = now_ist.strftime(
              "%Y-%m-%d"
          )

          current_streak = 0

          streak_date = today

          if contribution_lookup.get(
              streak_date,
              0
          ) == 0:

              previous_day = (
                  now_ist -
                  timedelta(days=1)
              ).strftime("%Y-%m-%d")

              if contribution_lookup.get(
                  previous_day,
                  0
              ) > 0:

                  streak_date = previous_day

          while contribution_lookup.get(
              streak_date,
              0
          ) > 0:

              current_streak += 1

              current_date = datetime.strptime(
                  streak_date,
                  "%Y-%m-%d"
              )

              current_date -= timedelta(
                  days=1
              )

              streak_date = (
                  current_date.strftime(
                      "%Y-%m-%d"
                  )
              )


          longest_streak = 0
          running_streak = 0

          for day in contribution_days:

              if day["contributionCount"] > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:

                  running_streak = 0


          active_days = sum(
              1
              for day in contribution_days
              if day["contributionCount"] > 0
          )


          total_days = len(
              contribution_days
          )

          consistency = (
              active_days /
              total_days * 100
              if total_days
              else 0
          )


          # ============================================================
          # MONTHLY ACTIVITY
          # ============================================================

          monthly_activity = Counter()

          for day in contribution_days:

              if day["date"].startswith(
                  str(current_year)
              ):

                  month = int(
                      day["date"][5:7]
                  )

                  monthly_activity[
                      month
                  ] += day[
                      "contributionCount"
                  ]


          month_values = [
              monthly_activity.get(
                  month,
                  0
              )
              for month in range(1, 13)
          ]

          month_labels = [
              "JAN",
              "FEB",
              "MAR",
              "APR",
              "MAY",
              "JUN",
              "JUL",
              "AUG",
              "SEP",
              "OCT",
              "NOV",
              "DEC"
          ]


          # ============================================================
          # WEEKDAY ACTIVITY
          # ============================================================

          weekday_counts = Counter()

          for day in contribution_days:

              dt = datetime.strptime(
                  day["date"],
                  "%Y-%m-%d"
              )

              weekday_counts[
                  dt.strftime("%A")
              ] += day[
                  "contributionCount"
              ]

          weekday_names = [
              "MON",
              "TUE",
              "WED",
              "THU",
              "FRI",
              "SAT",
              "SUN"
          ]

          weekday_full = [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
          ]

          weekday_values = [
              weekday_counts.get(
                  name,
                  0
              )
              for name in weekday_full
          ]


          # ============================================================
          # YEARLY ACTIVITY
          # ============================================================

          yearly_values = []

          for year_offset in range(4):

              year = current_year - year_offset

              value = sum(
                  day["contributionCount"]
                  for day in contribution_days
                  if day["date"].startswith(
                      str(year)
                  )
              )

              yearly_values.append(
                  (year, value)
              )

          yearly_values.reverse()


          # ============================================================
          # REPOSITORY TIMELINE
          # ============================================================

          repository_dates = []

          for repo in repositories:

              created = repo.get(
                  "created_at"
              )

              if created:

                  dt = datetime.fromisoformat(
                      created.replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  repository_dates.append(
                      dt
                  )

          repository_dates.sort()


          # ============================================================
          # MOST ACTIVE MONTH
          # ============================================================

          if any(month_values):

              index = int(
                  np.argmax(
                      month_values
                  )
              )

              most_active_month = (
                  month_labels[index]
              )

              most_active_month_value = (
                  month_values[index]
              )

          else:

              most_active_month = "N/A"
              most_active_month_value = 0


          # ============================================================
          # MOST ACTIVE WEEKDAY
          # ============================================================

          if any(weekday_values):

              weekday_index = int(
                  np.argmax(
                      weekday_values
                  )
              )

              most_active_weekday = (
                  weekday_names[
                      weekday_index
                  ]
              )

              most_active_weekday_value = (
                  weekday_values[
                      weekday_index
                  ]
              )

          else:

              most_active_weekday = "N/A"
              most_active_weekday_value = 0


          # ============================================================
          # 1. GITHUB ACTIVITY SUMMARY
          # ============================================================

          labels = [
              "COMMITS",
              "CONTRIBUTIONS",
              "PULL REQUESTS",
              "ISSUES",
              "REPOSITORIES",
              "STARS"
          ]

          values = [
              commits,
              total_contributions,
              prs,
              issue_contributions,
              repository_count,
              total_stars
          ]

          bar_colors = [
              CYAN,
              CYAN,
              BLUE,
              BLUE,
              CYAN_LIGHT,
              VIOLET
          ]

          fig = plt.figure(
              figsize=(15, 6)
          )

          ax = fig.add_subplot(
              111,
              projection="3d"
          )

          clean_3d_axis(ax)

          x = np.arange(
              len(labels)
          )

          ax.bar3d(
              x,
              np.zeros(len(x)),
              np.zeros(len(x)),
              0.58,
              0.62,
              values,
              color=bar_colors,
              alpha=0.92,
              shade=True
          )

          for index, value in enumerate(values):

              add_3d_value(
                  ax,
                  index + 0.29,
                  0.31,
                  value,
                  value,
                  bar_colors[index]
              )

          ax.set_xticks(
              x + 0.29
          )

          ax.set_xticklabels(
              labels,
              rotation=18,
              ha="right",
              fontsize=8
          )

          ax.set_yticks([])

          ax.set_zticks([])

          ax.set_zlabel(
              ""
          )

          ax.set_title(
              "GITHUB ACTIVITY SUMMARY",
              fontsize=17,
              fontweight="bold",
              color=CYAN,
              pad=18
          )

          save(
              "github-activity-summary"
          )


          # ============================================================
          # 2. MONTHLY CONTRIBUTION ANALYTICS
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(14, 5)
          )

          clean_axis(ax)

          x = np.arange(12)

          bars = ax.bar(
              x,
              month_values,
              width=0.58,
              color=CYAN,
              alpha=0.90
          )

          for bar, value in zip(
              bars,
              month_values
          ):

              if value > 0:

                  ax.text(
                      bar.get_x()
                      + bar.get_width() / 2,
                      bar.get_height(),
                      f"{value:,}",
                      ha="center",
                      va="bottom",
                      fontsize=8,
                      fontweight="bold",
                      family="monospace",
                      color=CYAN
                  )

          ax.set_xticks(x)

          ax.set_xticklabels(
              month_labels
          )

          ax.set_yticks([])

          add_hud_header(
              ax,
              "CONTRIBUTION ACTIVITY",
              "ACTIVITY://MONTHLY"
          )

          ax.text(
              0.99,
              0.92,
              f"YEAR://{current_year}",
              transform=ax.transAxes,
              fontsize=7,
              family="monospace",
              color=MUTED,
              ha="right"
          )

          save(
              "github-contribution-analytics"
          )


          # ============================================================
          # 3. COMMIT ANALYTICS
          # ============================================================

          commit_month_values = [
              int(
                  value *
                  commits /
                  total_contributions
              )
              if total_contributions > 0
              else 0
              for value in month_values
          ]

          fig, ax = plt.subplots(
              figsize=(14, 5)
          )

          clean_axis(ax)

          x = np.arange(12)

          bars = ax.bar(
              x,
              commit_month_values,
              width=0.58,
              color=BLUE,
              alpha=0.95
          )

          for bar, value in zip(
              bars,
              commit_month_values
          ):

              if value > 0:

                  ax.text(
                      bar.get_x()
                      + bar.get_width() / 2,
                      bar.get_height(),
                      f"{value:,}",
                      ha="center",
                      va="bottom",
                      fontsize=8,
                      fontweight="bold",
                      family="monospace",
                      color=CYAN
                  )

          ax.set_xticks(x)

          ax.set_xticklabels(
              month_labels
          )

          ax.set_yticks([])

          add_hud_header(
              ax,
              "COMMIT ACTIVITY",
              "COMMITS://TELEMETRY"
          )

          ax.text(
              0.99,
              0.92,
              f"TOTAL://{commits:,}",
              transform=ax.transAxes,
              fontsize=8,
              family="monospace",
              color=CYAN,
              ha="right"
          )

          save(
              "github-commit-analytics"
          )


          # ============================================================
          # 4. CONTRIBUTION TREND
          # ============================================================

          activity_values = np.array([
              day["contributionCount"]
              for day in contribution_days
          ])

          fig, ax = plt.subplots(
              figsize=(15, 5)
          )

          clean_axis(ax)

          if len(activity_values) > 0:

              x = np.arange(
                  len(activity_values)
              )

              ax.plot(
                  x,
                  activity_values,
                  color=CYAN,
                  linewidth=1.8
              )

              ax.fill_between(
                  x,
                  activity_values,
                  0,
                  color=CYAN,
                  alpha=0.08
              )

              peak_index = int(
                  np.argmax(
                      activity_values
                  )
              )

              peak_value = int(
                  activity_values[
                      peak_index
                  ]
              )

              ax.scatter(
                  [peak_index],
                  [peak_value],
                  s=45,
                  color=VIOLET,
                  zorder=5
              )

              ax.annotate(
                  f"{peak_value:,}",
                  (
                      peak_index,
                      peak_value
                  ),
                  xytext=(0, 10),
                  textcoords="offset points",
                  ha="center",
                  fontsize=9,
                  fontweight="bold",
                  family="monospace",
                  color=VIOLET
              )

          ax.set_xticks([])

          ax.set_yticks([])

          add_hud_header(
              ax,
              "CONTRIBUTION VELOCITY",
              "ACTIVITY://TIMELINE"
          )

          save(
              "github-contribution-trend"
          )


          # ============================================================
          # 5. PULL REQUEST + ISSUE ANALYTICS
          # ============================================================

          pr_issue_labels = [
              "PULL REQUESTS",
              "ISSUES"
          ]

          pr_issue_values = [
              prs,
              issue_contributions
          ]

          fig = plt.figure(
              figsize=(11, 5)
          )

          ax = fig.add_subplot(
              111,
              projection="3d"
          )

          clean_3d_axis(ax)

          x = np.arange(2)

          ax.bar3d(
              x,
              np.zeros(2),
              np.zeros(2),
              0.65,
              0.65,
              pr_issue_values,
              color=[
                  BLUE,
                  VIOLET
              ],
              shade=True
          )

          for index, value in enumerate(
              pr_issue_values
          ):

              add_3d_value(
                  ax,
                  index + 0.325,
                  0.325,
                  value,
                  value,
                  [
                      BLUE,
                      VIOLET
                  ][index]
              )

          ax.set_xticks(
              x + 0.325
          )

          ax.set_xticklabels(
              pr_issue_labels
          )

          ax.set_yticks([])

          ax.set_zticks([])

          ax.set_zlabel(
              ""
          )

          ax.set_title(
              "COLLABORATION ACTIVITY",
              fontsize=16,
              fontweight="bold",
              color=CYAN,
              pad=18
          )

          save(
              "github-collaboration-analytics"
          )


          # ============================================================
          # 6. REPOSITORY ANALYTICS
          # ============================================================

          repository_months = Counter()

          for dt in repository_dates:

              if dt.year == current_year:

                  repository_months[
                      dt.month
                  ] += 1

          repository_growth = [
              repository_months.get(
                  month,
                  0
              )
              for month in range(1, 13)
          ]

          fig, ax = plt.subplots(
              figsize=(14, 5)
          )

          clean_axis(ax)

          x = np.arange(12)

          bars = ax.bar(
              x,
              repository_growth,
              width=0.58,
              color=CYAN_LIGHT,
              alpha=0.92
          )

          for bar, value in zip(
              bars,
              repository_growth
          ):

              if value > 0:

                  ax.text(
                      bar.get_x()
                      + bar.get_width() / 2,
                      bar.get_height(),
                      f"{value:,}",
                      ha="center",
                      va="bottom",
                      fontsize=8,
                      fontweight="bold",
                      family="monospace",
                      color=CYAN
                  )

          ax.set_xticks(x)

          ax.set_xticklabels(
              month_labels
          )

          ax.set_yticks([])

          add_hud_header(
              ax,
              "REPOSITORY ACTIVITY",
              "REPOSITORIES://GROWTH"
          )

          ax.text(
              0.99,
              0.92,
              f"PUBLIC://{public_repositories:,}",
              transform=ax.transAxes,
              fontsize=8,
              family="monospace",
              color=CYAN,
              ha="right"
          )

          save(
              "github-repository-analytics"
          )


          # ============================================================
          # 7. STARS + FORKS
          # ============================================================

          star_fork_labels = [
              "STARS",
              "FORKS",
              "WATCHERS"
          ]

          star_fork_values = [
              total_stars,
              total_forks,
              total_watchers
          ]

          fig = plt.figure(
              figsize=(13, 5)
          )

          ax = fig.add_subplot(
              111,

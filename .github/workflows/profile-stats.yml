name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:

  generate-profile:

    name: Generate GitHub Profile Dashboard

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      GITHUB_USERNAME: ATULPANDEYIITR
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository

        uses: actions/checkout@v6

        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL PACKAGES
      # ============================================================

      - name: Install Python packages

        shell: bash

        run: |

          set -Eeuo pipefail

          mkdir -p "$MPLCONFIGDIR"

          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            matplotlib \
            numpy

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Installed packages:"
          python -m pip show requests matplotlib numpy


      # ============================================================
      # 4. GENERATE DASHBOARD
      # ============================================================

      - name: Generate GitHub Profile Dashboard

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |

          set -Eeuo pipefail

          mkdir -p "$MPLCONFIGDIR"
          mkdir -p assets

          echo ""
          echo "============================================================"
          echo "GITHUB PROFILE DASHBOARD"
          echo "============================================================"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "User       : $GITHUB_USERNAME"
          echo "Python     : $(python --version)"
          echo "============================================================"
          echo ""

          cat > generate_profile.py <<'PYTHON'

import os
import math
import time
import traceback

from datetime import datetime, timedelta, timezone, date
from pathlib import Path

import requests
import numpy as np

import matplotlib
matplotlib.use("Agg")

import matplotlib.pyplot as plt

from matplotlib.patches import FancyBboxPatch, FancyArrowPatch, Rectangle


# ============================================================
# CONFIGURATION
# ============================================================

USERNAME = os.environ.get(
    "GITHUB_USERNAME",
    "ATULPANDEYIITR",
)

TOKEN = os.environ.get(
    "GITHUB_TOKEN",
    "",
)

REST_URL = "https://api.github.com"

GRAPHQL_URL = "https://api.github.com/graphql"

OUTPUT_DIR = Path("assets")

OUTPUT_DIR.mkdir(
    parents=True,
    exist_ok=True,
)


if not TOKEN:
    raise RuntimeError(
        "GITHUB_TOKEN is not available."
    )


# ============================================================
# COLOR SYSTEM
# ============================================================

ELECTRIC_BLUE = "#0057FF"
ACID_GREEN = "#39FF14"
ELECTRIC_VIOLET = "#8A2BE2"
HOT_MAGENTA = "#FF007F"

ICE_WHITE = "#E8F1FF"
STEEL_GREY = "#7B8CA8"

BLUE_LIGHT = "#3D7BFF"
GREEN_LIGHT = "#7CFF5B"
VIOLET_LIGHT = "#B266FF"
MAGENTA_LIGHT = "#FF4DA6"


# ============================================================
# LARGE TEXT SYSTEM
# ============================================================

TITLE_SIZE = 30
SUBTITLE_SIZE = 19
LABEL_SIZE = 18
TICK_SIZE = 17
VALUE_SIZE = 24
LARGE_VALUE_SIZE = 30
HUGE_VALUE_SIZE = 42
LEGEND_SIZE = 17
HEATMAP_SIZE = 16


# ============================================================
# MATPLOTLIB
# ============================================================

plt.rcParams.update({

    "font.family": "DejaVu Sans",

    "font.size": TICK_SIZE,

    "axes.titlesize": TITLE_SIZE,

    "axes.labelsize": LABEL_SIZE,

    "xtick.labelsize": TICK_SIZE,

    "ytick.labelsize": TICK_SIZE,

    "legend.fontsize": LEGEND_SIZE,

    "figure.dpi": 200,

    "savefig.dpi": 220,

    "axes.grid": False,

    "axes.facecolor": "none",

    "figure.facecolor": "none",

    "savefig.facecolor": "none",

})


# ============================================================
# HTTP SESSION
# ============================================================

SESSION = requests.Session()

SESSION.headers.update({

    "Accept":
        "application/vnd.github+json",

    "Authorization":
        f"Bearer {TOKEN}",

    "X-GitHub-Api-Version":
        "2022-11-28",

    "User-Agent":
        "ATULPANDEYIITR-GitHub-Profile-Dashboard",

})


# ============================================================
# HTTP REQUEST WITH RETRIES
# ============================================================

def request_with_retry(
    method,
    url,
    **kwargs,
):

    retry_statuses = {
        429,
        500,
        502,
        503,
        504,
    }

    last_error = None

    for attempt in range(1, 5):

        try:

            response = SESSION.request(
                method,
                url,
                timeout=60,
                **kwargs,
            )

            if (
                response.status_code
                in retry_statuses
            ):

                if attempt < 4:

                    retry_after = (
                        response.headers.get(
                            "Retry-After",
                            "2",
                        )
                    )

                    try:
                        wait_seconds = int(
                            retry_after
                        )
                    except ValueError:
                        wait_seconds = 2

                    wait_seconds = min(
                        max(wait_seconds, 2),
                        15,
                    )

                    print(
                        f"HTTP {response.status_code}; "
                        f"retrying in "
                        f"{wait_seconds}s..."
                    )

                    time.sleep(
                        wait_seconds
                    )

                    continue

            if not response.ok:

                print("")
                print(
                    "============================================================"
                )
                print("GITHUB API ERROR")
                print(
                    "============================================================"
                )

                print(
                    f"Method: {method}"
                )

                print(
                    f"URL: {url}"
                )

                print(
                    f"Status: {response.status_code}"
                )

                print(
                    "Rate remaining: "
                    + response.headers.get(
                        "X-RateLimit-Remaining",
                        "unknown",
                    )
                )

                print(
                    "Rate reset: "
                    + response.headers.get(
                        "X-RateLimit-Reset",
                        "unknown",
                    )
                )

                print(
                    "Response:"
                )

                print(
                    response.text[:10000]
                )

                print(
                    "============================================================"
                )

                response.raise_for_status()

            return response

        except requests.RequestException as error:

            last_error = error

            print(
                f"Request error on attempt "
                f"{attempt}: {error}"
            )

            if attempt < 4:

                time.sleep(
                    2 * attempt
                )

                continue

            raise

    raise RuntimeError(
        f"Request failed: {last_error}"
    )


# ============================================================
# REST
# ============================================================

def rest_json(
    url,
    params=None,
):

    response = request_with_retry(
        "GET",
        url,
        params=params,
    )

    try:

        return response.json()

    except Exception as error:

        raise RuntimeError(
            f"Invalid JSON from {url}: "
            f"{error}"
        )


# ============================================================
# GRAPHQL
# ============================================================

def graphql(
    query,
    variables,
):

    response = request_with_retry(

        "POST",

        GRAPHQL_URL,

        json={
            "query": query,
            "variables": variables,
        },

    )

    try:

        payload = response.json()

    except Exception as error:

        raise RuntimeError(
            f"Invalid GraphQL JSON: {error}"
        )

    if payload.get("errors"):

        print("")
        print("GRAPHQL ERRORS")
        print("--------------")

        for error in payload["errors"]:

            print(
                error
            )

        raise RuntimeError(
            "GitHub GraphQL returned errors."
        )

    data = payload.get(
        "data"
    )

    if not data:

        raise RuntimeError(
            "GitHub GraphQL returned no data."
        )

    return data


# ============================================================
# HELPERS
# ============================================================

def safe_int(value):

    try:
        return int(value or 0)
    except Exception:
        return 0


def fmt(value):

    return f"{safe_int(value):,}"


def previous_month(
    month_date,
):

    if month_date.month == 1:

        return date(
            month_date.year - 1,
            12,
            1,
        )

    return date(
        month_date.year,
        month_date.month - 1,
        1,
    )


def create_figure(
    width=16,
    height=8,
):

    figure, axis = plt.subplots(
        figsize=(
            width,
            height,
        )
    )

    figure.patch.set_alpha(0)

    axis.set_facecolor("none")

    return figure, axis


def style_axis(
    axis,
):

    axis.set_facecolor(
        "none"
    )

    for spine in axis.spines.values():

        spine.set_visible(False)

    axis.grid(False)

    axis.tick_params(
        colors=STEEL_GREY,
        labelsize=TICK_SIZE,
        length=0,
        pad=9,
    )


def add_title(
    axis,
    title,
    subtitle=None,
):

    axis.set_title(

        title,

        fontsize=TITLE_SIZE,

        fontweight="bold",

        color=ICE_WHITE,

        pad=30,

    )

    if subtitle:

        axis.text(

            0.5,

            1.015,

            subtitle,

            transform=axis.transAxes,

            ha="center",

            va="bottom",

            fontsize=SUBTITLE_SIZE,

            color=STEEL_GREY,

        )


def save_figure(
    figure,
    filename,
):

    output_path = (
        OUTPUT_DIR
        / filename
    )

    figure.patch.set_alpha(0)

    figure.savefig(

        output_path,

        transparent=True,

        dpi=220,

        bbox_inches="tight",

        pad_inches=0.35,

    )

    plt.close(
        figure
    )

    if not output_path.is_file():

        raise RuntimeError(
            f"Image was not created: "
            f"{output_path}"
        )

    if output_path.stat().st_size <= 0:

        raise RuntimeError(
            f"Image is empty: "
            f"{output_path}"
        )

    print(
        f"CREATED: "
        f"{output_path}"
    )


# ============================================================
# CONTRIBUTION QUERY
# ============================================================

CONTRIBUTION_QUERY = """

query(
  $login: String!,
  $from: DateTime!,
  $to: DateTime!
) {

  user(
    login: $login
  ) {

    contributionsCollection(
      from: $from,
      to: $to
    ) {

      totalContributions

      totalCommitContributions

      totalIssueContributions

      totalPullRequestContributions

      contributionCalendar {

        weeks {

          contributionDays {

            contributionCount

            date

          }

        }

      }

    }

  }

}

"""


# ============================================================
# FETCH CONTRIBUTIONS
# ============================================================

def get_contributions(
    start_datetime,
    end_datetime,
):

    data = graphql(

        CONTRIBUTION_QUERY,

        {
            "login":
                USERNAME,

            "from":
                start_datetime.isoformat(),

            "to":
                end_datetime.isoformat(),
        },

    )

    user = data.get(
        "user"
    )

    if not user:

        raise RuntimeError(
            f"GitHub user "
            f"'{USERNAME}' was not found."
        )

    collection = user.get(
        "contributionsCollection"
    )

    if not collection:

        raise RuntimeError(
            "No contribution collection returned."
        )

    days = {}

    calendar = collection.get(
        "contributionCalendar",
        {},
    )

    for week in calendar.get(
        "weeks",
        [],
    ):

        for contribution_day in week.get(
            "contributionDays",
            [],
        ):

            day_string = (
                contribution_day.get(
                    "date"
                )
            )

            if not day_string:
                continue

            days[
                day_string
            ] = safe_int(
                contribution_day.get(
                    "contributionCount"
                )
            )

    return {

        "total":
            safe_int(
                collection.get(
                    "totalContributions"
                )
            ),

        "commits":
            safe_int(
                collection.get(
                    "totalCommitContributions"
                )
            ),

        "issues":
            safe_int(
                collection.get(
                    "totalIssueContributions"
                )
            ),

        "pull_requests":
            safe_int(
                collection.get(
                    "totalPullRequestContributions"
                )
            ),

        "days":
            days,

    }


# ============================================================
# MAIN DATA COLLECTION
# ============================================================

try:

    now = datetime.now(
        timezone.utc
    )

    today = now.date()

    first_day = (
        today
        - timedelta(
            days=364
        )
    )

    start_datetime = datetime(
        first_day.year,
        first_day.month,
        first_day.day,
        tzinfo=timezone.utc,
    )

    print(
        "Fetching GitHub contribution calendar..."
    )

    current = get_contributions(
        start_datetime,
        now,
    )

    print(
        f"Contributions: "
        f"{fmt(current['total'])}"
    )

    print(
        f"Commits: "
        f"{fmt(current['commits'])}"
    )

    print(
        f"Pull Requests: "
        f"{fmt(current['pull_requests'])}"
    )

    print(
        f"Issues: "
        f"{fmt(current['issues'])}"
    )


    # ========================================================
    # 365 DAILY VALUES
    # ========================================================

    dates = [

        first_day
        + timedelta(days=index)

        for index in range(365)

    ]

    daily = [

        safe_int(
            current["days"].get(
                current_date.isoformat(),
                0,
            )
        )

        for current_date in dates

    ]


    # ========================================================
    # MONTHLY VALUES
    # ========================================================

    month_cursor = date(
        today.year,
        today.month,
        1,
    )

    month_starts = []

    for _ in range(12):

        month_starts.append(
            month_cursor
        )

        month_cursor = previous_month(
            month_cursor
        )

    month_starts.reverse()

    month_labels = [

        month_date.strftime(
            "%b %y"
        )

        for month_date
        in month_starts

    ]

    monthly = []

    for month_start in month_starts:

        if month_start.month == 12:

            next_month = date(
                month_start.year + 1,
                1,
                1,
            )

        else:

            next_month = date(
                month_start.year,
                month_start.month + 1,
                1,
            )

        total = 0

        for current_date, value in zip(
            dates,
            daily,
        ):

            if (
                month_start
                <= current_date
                < next_month
            ):

                total += value

        monthly.append(
            total
        )


    # ========================================================
    # WEEKDAY VALUES
    # ========================================================

    weekday_names = [

        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday",

    ]

    weekdays = [0] * 7

    for current_date, value in zip(
        dates,
        daily,
    ):

        weekdays[
            current_date.weekday()
        ] += value


    # ========================================================
    # STREAKS
    # ========================================================

    active_days = sum(
        1
        for value in daily
        if value > 0
    )

    current_streak = 0

    streak_day = today

    if current["days"].get(
        streak_day.isoformat(),
        0,
    ) == 0:

        streak_day -= timedelta(
            days=1
        )

    while (

        streak_day >= first_day

        and current["days"].get(
            streak_day.isoformat(),
            0,
        ) > 0

    ):

        current_streak += 1

        streak_day -= timedelta(
            days=1
        )

    longest_streak = 0

    running_streak = 0

    for value in daily:

        if value > 0:

            running_streak += 1

            longest_streak = max(
                longest_streak,
                running_streak,
            )

        else:

            running_streak = 0


    # ========================================================
    # PROFILE
    # ========================================================

    print(
        "Fetching profile..."
    )

    profile = rest_json(
        f"{REST_URL}/users/{USERNAME}"
    )

    followers = safe_int(
        profile.get(
            "followers"
        )
    )

    following = safe_int(
        profile.get(
            "following"
        )
    )


    # ========================================================
    # REPOSITORIES
    # ========================================================

    print(
        "Fetching repositories..."
    )

    repositories = []

    page = 1

    while True:

        batch = rest_json(

            f"{REST_URL}/users/"
            f"{USERNAME}/repos",

            params={

                "per_page": 100,

                "page": page,

                "sort": "updated",

                "direction": "desc",

            },

        )

        if not isinstance(
            batch,
            list,
        ):

            raise RuntimeError(
                "Unexpected repository response."
            )

        repositories.extend(
            batch
        )

        print(
            f"Repository page "
            f"{page}: "
            f"{len(batch)} repositories"
        )

        if len(batch) < 100:
            break

        page += 1

        if page > 100:

            raise RuntimeError(
                "Repository pagination exceeded 100 pages."
            )


    owned_repositories = [

        repository

        for repository in repositories

        if not repository.get(
            "fork",
            False,
        )

    ]

    total_stars = sum(

        safe_int(
            repository.get(
                "stargazers_count"
            )
        )

        for repository
        in owned_repositories

    )

    total_forks = sum(

        safe_int(
            repository.get(
                "forks_count"
            )
        )

        for repository
        in owned_repositories

    )


    # ========================================================
    # LANGUAGES
    # ========================================================

    language_counts = {}

    for repository in owned_repositories:

        language = repository.get(
            "language"
        )

        if language:

            language_counts[
                language
            ] = (

                language_counts.get(
                    language,
                    0,
                )

                + 1

            )

    if not language_counts:

        language_counts = {
            "Python": 1
        }


    # ========================================================
    # MAIN METRICS
    # ========================================================

    metric_names = [

        "Commits",
        "Pull Requests",
        "Issues",
        "Repositories",

    ]

    metric_values = [

        current["commits"],
        current["pull_requests"],
        current["issues"],
        len(owned_repositories),

    ]

    metric_colors = [

        ELECTRIC_BLUE,
        ACID_GREEN,
        ELECTRIC_VIOLET,
        HOT_MAGENTA,

    ]


    # ============================================================
    # 1. BAR CHART
    # ============================================================

    figure, axis = create_figure(
        16,
        8,
    )

    positions = np.arange(
        len(metric_names)
    )

    bars = axis.bar(

        positions,

        metric_values,

        width=0.62,

        color=metric_colors,

    )

    add_title(

        axis,

        "GITHUB CONTRIBUTION ACTIVITY",

        "Rolling 365-day activity",

    )

    axis.set_xticks(
        positions
    )

    axis.set_xticklabels(

        metric_names,

        fontsize=LABEL_SIZE,

        fontweight="bold",

        color=ICE_WHITE,

    )

    style_axis(
        axis
    )

    maximum = max(
        metric_values + [1]
    )

    for bar, value in zip(
        bars,
        metric_values,
    ):

        axis.text(

            bar.get_x()
            + bar.get_width() / 2,

            bar.get_height()
            + maximum * 0.035,

            fmt(value),

            ha="center",

            va="bottom",

            fontsize=LARGE_VALUE_SIZE,

            fontweight="bold",

            color=ICE_WHITE,

        )

    axis.set_ylim(
        0,
        maximum * 1.28,
    )

    save_figure(
        figure,
        "github-bar-chart.png",
    )


    # ============================================================
    # 2. LINE GRAPH
    # ============================================================

    figure, axis = create_figure(
        16,
        8,
    )

    x = np.arange(
        len(monthly)
    )

    axis.plot(

        x,

        monthly,

        color=ELECTRIC_BLUE,

        linewidth=5,

        marker="o",

        markersize=12,

    )

    add_title(

        axis,

        "MONTHLY CONTRIBUTION MOMENTUM",

        "Rolling 12-month contribution activity",

    )

    axis.set_xticks(
        x
    )

    axis.set_xticklabels(

        month_labels,

        fontsize=LABEL_SIZE,

        fontweight="bold",

        color=ICE_WHITE,

    )

    style_axis(
        axis
    )

    maximum = max(
        monthly + [1]
    )

    for position, value in zip(
        x,
        monthly,
    ):

        axis.annotate(

            fmt(value),

            (
                position,
                value,
            ),

            xytext=(
                0,
                18,
            ),

            textcoords="offset points",

            ha="center",

            fontsize=VALUE_SIZE,

            fontweight="bold",

            color=ICE_WHITE,

        )

    axis.set_ylim(
        0,
        maximum * 1.32,
    )

    save_figure(
        figure,
        "github-line-graph.png",
    )


    # ============================================================
    # 3. AREA CHART
    # ============================================================

    cumulative = np.cumsum(
        monthly
    )

    figure, axis = create_figure(
        16,
        8,
    )

    axis.fill_between(

        x,

        cumulative,

        color=ELECTRIC_BLUE,

        alpha=0.28,

    )

    axis.plot(

        x,

        cumulative,

        color=ELECTRIC_BLUE,

        linewidth=5,

        marker="o",

        markersize=11,

    )

    add_title(

        axis,

        "CUMULATIVE CONTRIBUTION GROWTH",

        "Rolling 12-month accumulation",

    )

    axis.set_xticks(
        x
    )

    axis.set_xticklabels(

        month_labels,

        fontsize=LABEL_SIZE,

        fontweight="bold",

        color=ICE_WHITE,

    )

    style_axis(
        axis
    )

    maximum = max(
        list(cumulative) + [1]
    )

    for position, value in zip(
        x,
        cumulative,
    ):

        axis.annotate(

            fmt(value),

            (
                position,
                value,
            ),

            xytext=(
                0,
                18,
            ),

            textcoords="offset points",

            ha="center",

            fontsize=VALUE_SIZE,

            fontweight="bold",

            color=ICE_WHITE,

        )

    axis.set_ylim(
        0,
        maximum * 1.28,
    )

    save_figure(
        figure,
        "github-area-chart.png",
    )


    # ============================================================
    # 4. PIE CHART
    # ============================================================

    figure, axis = create_figure(
        16,
        9,
    )

    values = np.array(
        metric_values,
        dtype=float,
    )

    has_data = (
        values.sum() > 0
    )

    if has_data:

        wedges, _, percentages = axis.pie(

            values,

            colors=metric_colors,

            startangle=90,

            autopct="%1.0f%%",

            pctdistance=0.68,

            radius=1.0,

            wedgeprops={
                "linewidth": 2,
                "edgecolor": "none",
            },

        )

        for text in percentages:

            text.set_color(
                ICE_WHITE
            )

            text.set_fontsize(
                VALUE_SIZE
            )

            text.set_fontweight(
                "bold"
            )

    else:

        wedges, _ = axis.pie(

            [1, 1, 1, 1],

            colors=metric_colors,

            startangle=90,

            radius=1.0,

            wedgeprops={
                "linewidth": 2,
                "edgecolor": "none",
            },

        )

    axis.set_title(


          def make_waterfall(data):
              labels = [
                  "Contributions",
                  "Commits",
                  "PRs",
                  "Issues",
                  "Repos",
                  "Stars",
                  "Forks",
              ]

              values = np.array([
                  data["total_contributions"],
                  data["commits"],
                  data["pull_requests"],
                  data["issues"],
                  data["repos"],
                  data["stars"],
                  data["forks"],
              ], dtype=float)

              changes = np.diff(
                  np.concatenate(
                      ([0], values)
                  )
              )

              fig, ax = base_figure(
                  "GITHUB METRIC WATERFALL",
                  "Change between successive activity metrics",
              )

              bottoms = []

              running = 0

              for change in changes:
                  if change >= 0:
                      bottoms.append(running)
                  else:
                      bottoms.append(running + change)

                  running += change

              colors = [
                  ELECTRIC_BLUE if value >= 0
                  else HOT_MAGENTA
                  for value in changes
              ]

              bars = ax.bar(
                  np.arange(len(labels)),
                  np.abs(changes),
                  bottom=bottoms,
                  color=colors,
                  width=0.62,
              )

              ax.set_xticks(np.arange(len(labels)))
              ax.set_xticklabels(
                  labels,
                  color=ICE_WHITE,
                  fontsize=16,
              )

              for index, value in enumerate(changes):
                  top = bottoms[index] + abs(value)

                  ax.text(
                      index,
                      top,
                      f"{int(value):+,}",
                      ha="center",
                      va="bottom",
                      fontsize=19,
                      color=ICE_WHITE,
                      fontweight="bold",
                  )

              save(fig, "github-waterfall-chart.png")



name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  generate-profile-dashboard:
    name: Generate GitHub Profile Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      GITHUB_USERNAME: ATULPANDEYIITR
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests matplotlib numpy

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import math
          import requests
          import numpy as np
          import matplotlib.pyplot as plt
          from collections import Counter
          from datetime import datetime, timezone, timedelta

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          ASSETS = "assets"
          README = "README.md"

          os.makedirs(ASSETS, exist_ok=True)

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          graphql_url = "https://api.github.com/graphql"

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              login
              name

              followers {
                totalCount
              }

              following {
                totalCount
              }

              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalRepositoriesWithContributedCommits
                restrictedContributionsCount

                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          now = datetime.now(timezone.utc)
          from_date = now - timedelta(days=364)

          response = requests.post(
              graphql_url,
              headers=headers,
              json={
                  "query": query,
                  "variables": {
                      "login": USERNAME,
                      "from": from_date.isoformat(),
                      "to": now.isoformat(),
                  },
              },
              timeout=60,
          )

          response.raise_for_status()

          payload = response.json()

          if "errors" in payload:
              raise RuntimeError(payload["errors"])

          user = payload["data"]["user"]

          if not user:
              raise RuntimeError(
                  f"GitHub user not found: {USERNAME}"
              )

          contributions = user["contributionsCollection"]
          calendar = contributions["contributionCalendar"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(
                      {
                          "date": day["date"],
                          "count": day["contributionCount"],
                      }
                  )

          days.sort(key=lambda item: item["date"])

          counts = [
              item["count"]
              for item in days
          ]

          total_contributions = calendar["totalContributions"]
          commits = contributions["totalCommitContributions"]
          issues = contributions["totalIssueContributions"]
          prs = contributions["totalPullRequestContributions"]
          contributed_repos = (
              contributions[
                  "totalRepositoriesWithContributedCommits"
              ]
          )
          restricted = contributions[
              "restrictedContributionsCount"
          ]

          rest_url = (
              f"https://api.github.com/users/{USERNAME}"
          )

          profile_response = requests.get(
              rest_url,
              headers=headers,
              timeout=60,
          )

          profile_response.raise_for_status()

          profile = profile_response.json()

          public_repos = profile.get(
              "public_repos",
              0,
          )

          repos = []

          for page in range(1, 21):
              repo_response = requests.get(
                  f"https://api.github.com/users/{USERNAME}/repos",
                  headers=headers,
                  params={
                      "per_page": 100,
                      "page": page,
                      "sort": "updated",
                      "direction": "desc",
                  },
                  timeout=60,
              )

              repo_response.raise_for_status()

              page_data = repo_response.json()

              if not page_data:
                  break

              repos.extend(page_data)

              if len(page_data) < 100:
                  break

          language_counts = Counter()

          total_stars = 0
          total_forks = 0

          for repo in repos:

              if repo.get("fork"):
                  continue

              total_stars += repo.get(
                  "stargazers_count",
                  0,
              )

              total_forks += repo.get(
                  "forks_count",
                  0,
              )

              language = repo.get("language")

              if language:
                  language_counts[language] += 1

          repo_count = len(
              [
                  repo
                  for repo in repos
                  if not repo.get("fork")
              ]
          )

          if repo_count == 0:
              repo_count = public_repos

          # ============================================================
          # COLOR SYSTEM
          # ============================================================

          COLORS = [
              "#39FF14",   # Green
              "#00BFFF",   # Blue
              "#FF3131",   # Red
              "#FFD700",   # Yellow
              "#00FFFF",   # Cyan
              "#BF40BF",   # Purple
              "#FF8C00",   # Orange
          ]

          TEXT_COLOR = "#39FF14"
          SECONDARY_TEXT = "#00BFFF"
          GRID_COLOR = "#666666"

          def chart_color(index):
              return COLORS[index % len(COLORS)]

          def style_axis(
              ax,
              color="#39FF14",
              secondary_color="#00BFFF",
          ):
              ax.tick_params(
                  axis="both",
                  colors=color,
                  labelcolor=color,
              )

              for spine in ax.spines.values():
                  spine.set_color(
                      secondary_color
                  )
                  spine.set_alpha(0.75)

              ax.xaxis.label.set_color(color)
              ax.yaxis.label.set_color(color)

          def style_title(
              ax,
              text,
              color="#39FF14",
          ):
              ax.set_title(
                  text,
                  color=color,
                  fontsize=15,
                  fontweight="bold",
                  pad=15,
              )

          def save(fig, filename):
              path = os.path.join(
                  ASSETS,
                  filename,
              )

              fig.patch.set_alpha(0)

              fig.savefig(
                  path,
                  dpi=180,
                  bbox_inches="tight",
                  transparent=True,
              )

              plt.close(fig)

              if not os.path.exists(path):
                  raise RuntimeError(
                      f"Failed to generate {path}"
                  )

              if os.path.getsize(path) < 1000:
                  raise RuntimeError(
                      f"Generated file is suspiciously small: "
                      f"{path}"
                  )

          def title_text():
              return (
                  f"{USERNAME} | GitHub Activity"
              )

          # ============================================================
          # STREAK CALCULATION
          # ============================================================

          positive_streaks = []

          running_streak = 0

          for count in counts:

              if count > 0:
                  running_streak += 1

              else:
                  if running_streak > 0:
                      positive_streaks.append(
                          running_streak
                      )

                  running_streak = 0

          if running_streak > 0:
              positive_streaks.append(
                  running_streak
              )

          highest_streak = (
              max(positive_streaks)
              if positive_streaks
              else 0
          )

          lowest_streak = (
              min(positive_streaks)
              if positive_streaks
              else 0
          )

          current_streak = 0

          for count in reversed(counts):

              if count > 0:
                  current_streak += 1

              else:
                  break

          # ============================================================
          # 1. AREA CHART
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(14, 5)
          )

          x = np.arange(len(counts))

          color = chart_color(0)

          ax.fill_between(
              x,
              counts,
              alpha=0.20,
              color=color,
          )

          ax.plot(
              x,
              counts,
              linewidth=2,
              color=color,
          )

          style_title(
              ax,
              title_text() + " | Contribution Area",
              color,
          )

          ax.set_xlabel(
              "Contribution days"
          )

          ax.set_ylabel(
              "Contributions"
          )

          style_axis(
              ax,
              color,
              chart_color(1),
          )

          ax.grid(
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-area-chart.png",
          )

          # ============================================================
          # 2. BAR CHART
          # ============================================================

          categories = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Contributions",
          ]

          values = [
              commits,
              prs,
              issues,
              total_contributions,
          ]

          fig, ax = plt.subplots(
              figsize=(12, 6)
          )

          colors = [
              COLORS[0],
              COLORS[1],
              COLORS[2],
              COLORS[3],
          ]

          bars = ax.bar(
              categories,
              values,
              color=colors,
              alpha=0.85,
          )

          for bar, color in zip(
              bars,
              colors,
          ):
              bar.set_edgecolor(color)

          style_title(
              ax,
              title_text() + " | Activity Breakdown",
              COLORS[0],
          )

          ax.set_ylabel(
              "Count"
          )

          ax.tick_params(
              axis="x",
              rotation=20,
          )

          style_axis(
              ax,
              COLORS[0],
              COLORS[1],
          )

          ax.grid(
              axis="y",
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-bar-chart.png",
          )

          # ============================================================
          # 3. BOX PLOT
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(10, 6)
          )

          ax.boxplot(
              counts,
              patch_artist=True,
              boxprops={
                  "facecolor": "none",
                  "edgecolor": COLORS[1],
                  "linewidth": 2,
              },
              whiskerprops={
                  "color": COLORS[0],
                  "linewidth": 2,
              },
              capprops={
                  "color": COLORS[2],
                  "linewidth": 2,
              },
              medianprops={
                  "color": COLORS[3],
                  "linewidth": 2,
              },
              flierprops={
                  "markeredgecolor": COLORS[4],
                  "markerfacecolor": "none",
              },
          )

          style_title(
              ax,
              title_text() + " | Contribution Distribution",
              COLORS[1],
          )

          ax.set_ylabel(
              "Daily Contributions"
          )

          style_axis(
              ax,
              COLORS[1],
              COLORS[2],
          )

          ax.grid(
              axis="y",
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-box-plot.png",
          )

          # ============================================================
          # 4. BUBBLE CHART
          # ============================================================

          x_values = np.arange(
              len(categories)
          )

          bubble_sizes = [
              max(value, 1) * 20
              for value in values
          ]

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          ax.scatter(
              x_values,
              values,
              s=bubble_sizes,
              c=COLORS[:len(categories)],
              alpha=0.70,
              edgecolors=COLORS[4],
              linewidths=1.5,
          )

          ax.set_xticks(
              x_values
          )

          ax.set_xticklabels(
              categories,
              rotation=20,
          )

          style_title(
              ax,
              title_text() + " | Activity Bubble Map",
              COLORS[4],
          )

          ax.set_ylabel(
              "Activity"
          )

          style_axis(
              ax,
              COLORS[4],
              COLORS[5],
          )

          ax.grid(
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-bubble-chart.png",
          )

          # ============================================================
          # 5. DEVELOPER TELEMETRY
          # ============================================================

          telemetry_labels = [
              "Commits",
              "PRs",
              "Issues",
              "Repos",
              "Stars",
              "Forks",
          ]

          telemetry_values = [
              commits,
              prs,
              issues,
              repo_count,
              total_stars,
              total_forks,
          ]

          fig, ax = plt.subplots(
              figsize=(14, 6)
          )

          ax.plot(
              telemetry_labels,
              telemetry_values,
              marker="o",
              linewidth=2.5,
              color=COLORS[1],
              markerfacecolor=COLORS[0],
              markeredgecolor=COLORS[2],
              markersize=8,
          )

          style_title(
              ax,
              title_text() + " | Developer Telemetry",
              COLORS[1],
          )

          ax.set_ylabel(
              "Value"
          )

          ax.tick_params(
              axis="x",
              rotation=25,
          )

          style_axis(
              ax,
              COLORS[1],
              COLORS[0],
          )

          ax.grid(
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-developer-telemetry.png",
          )

          # ============================================================
          # 6. DONUT CHART
          # ============================================================

          donut_labels = [
              "Commits",
              "PRs",
              "Issues",
          ]

          donut_values = [
              max(commits, 0),
              max(prs, 0),
              max(issues, 0),
          ]

          if sum(donut_values) == 0:
              donut_values = [
                  1,
                  1,
                  1,
              ]

          fig, ax = plt.subplots(
              figsize=(8, 8)
          )

          ax.pie(
              donut_values,
              labels=donut_labels,
              autopct="%1.1f%%",
              colors=COLORS[:3],
              textprops={
                  "color": COLORS[0],
                  "fontsize": 11,
                  "fontweight": "bold",
              },
              wedgeprops={
                  "width": 0.4,
                  "edgecolor": COLORS[5],
                  "linewidth": 1.5,
              },
          )

          style_title(
              ax,
              title_text() + " | Contribution Composition",
              COLORS[0],
          )

          save(
              fig,
              "github-donut-chart.png",
          )

          # ============================================================
          # 7. FUNNEL CHART
          # ============================================================

          funnel_labels = [
              "Repositories",
              "Commits",
              "Pull Requests",
              "Issues",
          ]

          funnel_values = [
              repo_count,
              commits,
              prs,
              issues,
          ]

          fig, ax = plt.subplots(
              figsize=(11, 7)
          )

          y = np.arange(
              len(funnel_labels)
          )

          bars = ax.barh(
              y,
              funnel_values,
              color=COLORS[:4],
              alpha=0.85,
          )

          for bar, color in zip(
              bars,
              COLORS[:4],
          ):
              bar.set_edgecolor(color)

          ax.set_yticks(y)

          ax.set_yticklabels(
              funnel_labels
          )

          ax.invert_yaxis()

          style_title(
              ax,
              title_text() + " | Activity Funnel",
              COLORS[2],
          )

          ax.set_xlabel(
              "Count"
          )

          style_axis(
              ax,
              COLORS[2],
              COLORS[3],
          )

          ax.grid(
              axis="x",
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-funnel-chart.png",
          )

          # ============================================================
          # 8. HEATMAP
          # ============================================================

          heatmap = np.zeros(
              (7, 53)
          )

          for index, item in enumerate(days):

              week = index // 7
              weekday = index % 7

              if week < 53:
                  heatmap[
                      weekday,
                      week
                  ] = item["count"]

          fig, ax = plt.subplots(
              figsize=(16, 6)
          )

          image = ax.imshow(
              heatmap,
              aspect="auto",
              interpolation="nearest",
              cmap="turbo",
          )

          style_title(
              ax,
              title_text() + " | Contribution Heatmap",
              COLORS[3],
          )

          ax.set_xlabel(
              "Weeks"
          )

          ax.set_ylabel(
              "Day of week"
          )

          ax.set_yticks(
              range(7)
          )

          ax.set_yticklabels(
              [
                  "Mon",
                  "Tue",
                  "Wed",
                  "Thu",
                  "Fri",
                  "Sat",
                  "Sun",
              ]
          )

          style_axis(
              ax,
              COLORS[3],
              COLORS[1],
          )

          colorbar = fig.colorbar(
              image,
              ax=ax,
              label="Contributions",
          )

          colorbar.ax.yaxis.label.set_color(
              COLORS[0]
          )

          colorbar.ax.tick_params(
              colors=COLORS[0]
          )

          save(
              fig,
              "github-heatmap.png",
          )

          # ============================================================
          # 9. HISTOGRAM
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(12, 6)
          )

          bins = max(
              5,
              min(
                  30,
                  int(
                      math.sqrt(
                          len(counts)
                      )
                  ),
              ),
          )

          ax.hist(
              counts,
              bins=bins,
              color=COLORS[4],
              edgecolor=COLORS[3],
              alpha=0.75,
              linewidth=1.2,
          )

          style_title(
              ax,
              title_text() + " | Daily Contribution Histogram",
              COLORS[4],
          )

          ax.set_xlabel(
              "Daily Contributions"
          )

          ax.set_ylabel(
              "Number of Days"
          )

          style_axis(
              ax,
              COLORS[4],
              COLORS[3],
          )

          ax.grid(
              axis="y",
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-histogram.png",
          )

          # ============================================================
          # 10. LINE GRAPH
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(14, 6)
          )

          ax.plot(
              x,
              counts,
              linewidth=2.5,
              color=COLORS[2],
          )

          style_title(
              ax,
              title_text() + " | Contribution Trend",
              COLORS[2],
          )

          ax.set_xlabel(
              "Days"
          )

          ax.set_ylabel(
              "Contributions"
          )

          style_axis(
              ax,
              COLORS[2],
              COLORS[0],
          )

          ax.grid(
              alpha=0.15,
              color=GRID_COLOR,
          )

          save(
              fig,
              "github-line-graph.png",
          )

          # ============================================================
          # 11. PIE CHART
          # ============================================================

          pie_labels = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Restricted",
          ]

          pie_values = [
              commits,
              prs,
              issues,
              restricted,
          ]

          if sum(pie_values) == 0:
              pie_values = [
                  1,
                  1,
                  1,
                  1,
              ]

          fig, ax = plt.subplots(
              figsize=(8, 8)
          )

          ax.pie(
              pie_values,
              labels=pie_labels,
              autopct="%1.1f%%",
              colors=COLORS[:4],
              textprops={
                  "color": COLORS[0],
                  "fontsize": 10,
                  "fontweight": "bold",
              },
              wedgeprops={
                  "edgecolor": COLORS[1],
                  "linewidth": 1.5,
              },
          )

          style_title(
              ax,
              title_text() + " | Activity Distribution",
              COLORS[3],
          )

          save(
              fig,
              "github-pie-chart.png",
          )

          # ============================================================
          # 12. RADAR CHART
          # ============================================================

          radar_labels = [
              "Commits",
              "PRs",
              "Issues",
              "Repos",
              "Stars",
              "Forks",
          ]

          radar_values = np.array(
              [
                  commits,
                  prs,
                  issues,
                  repo_count,
                  total_stars,
                  total_forks,
              ],
              dtype=float,
          )

          max_value = max(
              radar_values.max(),
              1,
          )

          radar_values = (
              radar_values / max_value
          )

          angles = np.linspace(
              0,
              2 * np.pi,
              len(radar_labels),
              endpoint=False,
          )

          radar_values = np.concatenate(
              [
                  radar_values,
                  [
                      radar_values[0]
                  ],
              ]
          )

          angles = np.concatenate(
              [
                  angles,
                  [
                      angles[0]
                  ],
              ]
          )

          fig = plt.figure(
              figsize=(8, 8)
          )

          ax = fig.add_subplot(
              111,
              polar=True,
          )

          ax.plot(
              angles,
              radar_values,
              linewidth=2.5,
              color=COLORS[5],
          )

          ax.fill(
              angles,
              radar_values,
              color=COLORS[5],
              alpha=0.18,
          )

          ax.set_xticks(
              angles[:-1]
          )

          ax.set_xticklabels(
              radar_labels,
              color=COLORS[0],
          )

          ax.tick_params(
              axis="y",
              colors=COLORS[1],
          )

          ax.grid(
              color=COLORS[1],
              alpha=0.20,
          )

          style_title(
              ax,
              title_text() + " | Developer Radar",
              COLORS[5],
          )

          save(
              fig,
              "github-radar-chart.png",
          )

          # ============================================================
          # 13. SANKEY-STYLE DIAGRAM
          # ============================================================

          source_labels = [
              "Repositories",
              "Commits",
              "Pull Requests",
              "Issues",
          ]

          source_values = [
              repo_count,
              commits,
              prs,
              issues,
          ]

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          left_x = 0
          right_x = 1

          left_positions = np.linspace(
              0.85,
              0.15,
              len(source_labels),
          )

          for index, (
              y_pos,
              label,
              value,
          ) in enumerate(
              zip(
                  left_positions,
                  source_labels,
                  source_values,
              )
          ):

              color = chart_color(index)

              ax.text(
                  left_x,
                  y_pos,
                  f"{label}\n{value}",
                  ha="center",
                  va="center",
                  fontsize=10,
                  fontweight="bold",
                  color=color,
              )

          ax.text(
              right_x,
              0.5,
              f"GitHub Activity\n{total_contributions}",
              ha="center",
              va="center",
              fontsize=12,
              fontweight="bold",
              color=COLORS[3],
          )

          for index, y_pos in enumerate(
              left_positions
          ):

              ax.plot(
                  [0.12, 0.88],
                  [y_pos, 0.5],
                  linewidth=2,
                  alpha=0.45,
                  color=chart_color(index),
              )

          ax.set_xlim(
              -0.1,
              1.1,
          )

          ax.set_ylim(
              0,
              1,
          )

          ax.axis("off")

          style_title(
              ax,
              title_text() + " | Activity Flow",
              COLORS[1],
          )

          save(
              fig,
              "github-sankey-diagram.png",
          )

          # ============================================================
          # 14. SCATTER PLOT
          # ============================================================

          cumulative = np.cumsum(
              counts
          )

          fig, ax = plt.subplots(

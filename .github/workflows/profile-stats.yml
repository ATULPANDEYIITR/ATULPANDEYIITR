                  )
              )

              last_date = datetime.strptime(
                  heat_days[-1]["date"],
                  "%Y-%m-%d"
              ).date()

              total_days_heat = (
                  last_date -
                  first_sunday
              ).days + 1

              heat_weeks = int(
                  np.ceil(
                      total_days_heat / 7
                  )
              )

          else:

              first_sunday = now_ist.date()
              heat_weeks = 52


          heat_matrix = np.zeros(
              (
                  7,
                  heat_weeks

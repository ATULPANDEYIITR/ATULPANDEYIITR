name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # INSTALL PACKAGES
      # ============================================================

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade requests matplotlib numpy


      # ============================================================
      # GENERATE DASHBOARD
      # ============================================================

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR

        run: |

          cat > generate_profile.py <<'PYTHON'

          import os
          import requests
          import numpy as np
          import matplotlib.pyplot as plt

          from collections import Counter
          from datetime import datetime, timezone, timedelta
          from matplotlib.patches import FancyBboxPatch
          from matplotlib.path import Path
          from matplotlib.patches import PathPatch


          # ============================================================
          # CONFIGURATION
          # ============================================================

          TOKEN = os.environ.get("GITHUB_TOKEN")
          USERNAME = os.environ.get(
              "GITHUB_USERNAME",
              "ATULPANDEYIITR"
          )

          if not TOKEN:
              raise RuntimeError(
                  "GITHUB_TOKEN was not provided."
              )

          if not USERNAME:
              raise RuntimeError(
                  "GITHUB_USERNAME was not provided."
              )


          API_HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }


          GRAPHQL_HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Content-Type": "application/json"
          }


          os.makedirs(
              "assets",
              exist_ok=True
          )


          # ============================================================
          # REMOVE OLD GENERATED PNG FILES
          # ============================================================

          print("Cleaning previous generated images...")

          for filename in os.listdir("assets"):

              if filename.endswith(".png"):

                  path = os.path.join(
                      "assets",
                      filename
                  )

                  try:
                      os.remove(path)

                  except OSError as error:

                      print(
                          f"Warning: could not remove {path}: {error}"
                      )


          # ============================================================
          # ELECTRIC GAMING + SCIENTIFIC COLOR SYSTEM
          # ============================================================

          ELECTRIC_BLUE = "#0057FF"
          ACID_GREEN = "#39FF14"
          ELECTRIC_VIOLET = "#8A2BE2"
          HOT_MAGENTA = "#FF007F"

          ICE_WHITE = "#E8F1FF"
          STEEL_GREY = "#7B8CA8"

          BLUE_LIGHT = "#3D7BFF"
          GREEN_LIGHT = "#7CFF5B"
          VIOLET_LIGHT = "#B266FF"
          MAGENTA_LIGHT = "#FF4DA6"


          # ============================================================
          # MATPLOTLIB SETTINGS
          # ============================================================

          plt.rcParams.update({
              "font.family": "DejaVu Sans",
              "font.size": 9,
              "text.color": ICE_WHITE,
              "axes.labelcolor": ICE_WHITE,
              "axes.titlecolor": ELECTRIC_BLUE,
              "xtick.color": STEEL_GREY,
              "ytick.color": STEEL_GREY,
              "axes.edgecolor": ELECTRIC_BLUE,
              "figure.facecolor": "none",
              "axes.facecolor": "none",
              "savefig.facecolor": "none",
              "savefig.edgecolor": "none"
          })


          # ============================================================
          # HELPER FUNCTIONS
          # ============================================================

          def clean_axis(ax):

              ax.set_facecolor("none")

              try:
                  ax.grid(False)
              except Exception:
                  pass

              for spine in ax.spines.values():
                  spine.set_visible(False)

              ax.tick_params(
                  axis="both",
                  which="both",
                  length=0
              )


          def save_chart(name):

              plt.tight_layout()

              plt.savefig(
                  f"assets/{name}.png",
                  dpi=190,
                  bbox_inches="tight",
                  transparent=True,
                  pad_inches=0.15
              )

              plt.close()


          def add_header(
              ax,
              title,
              code
          ):

              ax.text(
                  0.01,
                  1.05,
                  title,
                  transform=ax.transAxes,
                  fontsize=16,
                  fontweight="bold",
                  color=ELECTRIC_BLUE,
                  ha="left",
                  va="bottom"
              )

              ax.text(
                  0.99,
                  1.055,
                  code,
                  transform=ax.transAxes,
                  fontsize=7,
                  family="monospace",
                  color=STEEL_GREY,
                  ha="right",
                  va="bottom"
              )


          def add_value(
              ax,
              x,
              y,
              value,
              color=ACID_GREEN,
              fontsize=9
          ):

              ax.text(
                  x,
                  y,
                  f"{int(value):,}",
                  ha="center",
                  va="bottom",
                  fontsize=fontsize,
                  fontweight="bold",
                  family="monospace",
                  color=color
              )


          def graphql_request(
              query,
              variables
          ):

              try:

                  response = requests.post(
                      "https://api.github.com/graphql",
                      json={
                          "query": query,
                          "variables": variables
                      },
                      headers=GRAPHQL_HEADERS,
                      timeout=45
                  )

              except requests.RequestException as error:

                  raise RuntimeError(
                      f"GitHub GraphQL connection failed: {error}"
                  )


              if response.status_code != 200:

                  raise RuntimeError(
                      "GitHub GraphQL HTTP error "
                      f"{response.status_code}: "
                      f"{response.text[:1000]}"
                  )


              try:

                  result = response.json()

              except ValueError:

                  raise RuntimeError(
                      "GitHub GraphQL returned invalid JSON."
                  )


              if result.get("errors"):

                  raise RuntimeError(
                      "GitHub GraphQL returned errors:\n"
                      + str(
                          result["errors"]
                      )
                  )


              if "data" not in result:

                  raise RuntimeError(
                      "GitHub GraphQL response contained no data."
                  )


              return result["data"]


          # ============================================================
          # REST API REQUEST
          # ============================================================

          def rest_get(
              url,
              params=None
          ):

              try:

                  response = requests.get(
                      url,
                      headers=API_HEADERS,
                      params=params,
                      timeout=45
                  )

              except requests.RequestException as error:

                  raise RuntimeError(
                      f"GitHub REST connection failed: {error}"
                  )


              if response.status_code != 200:

                  raise RuntimeError(
                      "GitHub REST HTTP error "
                      f"{response.status_code}: "
                      f"{response.text[:1000]}"
                  )


              try:

                  return response.json()

              except ValueError:

                  raise RuntimeError(
                      "GitHub REST API returned invalid JSON."
                  )


          # ============================================================
          # GET ALL REPOSITORIES
          # ============================================================

          print("")
          print("Collecting repository data...")


          repositories = []

          page = 1


          while True:

              batch = rest_get(
                  f"https://api.github.com/users/{USERNAME}/repos",
                  {
                      "per_page": 100,
                      "page": page,
                      "type": "owner",
                      "sort": "updated",
                      "direction": "desc"
                  }
              )


              if not isinstance(
                  batch,
                  list
              ):

                  raise RuntimeError(
                      "Unexpected repository response from GitHub."
                  )


              if not batch:

                  break


              repositories.extend(
                  batch
              )


              print(
                  f"  Repository page {page}: "
                  f"{len(batch)} repositories"
              )


              if len(batch) < 100:

                  break


              page += 1


          print(
              f"Total repositories collected: "
              f"{len(repositories)}"
          )


          # ============================================================
          # CURRENT TIME
          # ============================================================

          now_utc = datetime.now(
              timezone.utc
          )


          IST = timezone(
              timedelta(
                  hours=5,
                  minutes=30
              )
          )


          now_ist = now_utc.astimezone(
              IST
          )


          generated_date = now_ist.strftime(
              "%d %B %Y"
          )


          generated_time = now_ist.strftime(
              "%I:%M %p IST"
          )


          current_year = now_ist.year


          # ============================================================
          # CONTRIBUTION GRAPHQL QUERY
          # ============================================================

          CONTRIBUTION_QUERY = """

          query(
              $login: String!,
              $from: DateTime!,
              $to: DateTime!
          ) {

              user(login: $login) {

                  contributionsCollection(
                      from: $from,
                      to: $to
                  ) {

                      totalCommitContributions

                      totalPullRequestContributions

                      totalIssueContributions

                      totalRepositoryContributions

                      contributionCalendar {

                          totalContributions

                          weeks {

                              contributionDays {

                                  contributionCount

                                  date

                              }

                          }

                      }

                  }

              }

          }

          """


          def get_contribution_data(
              start_datetime,
              end_datetime
          ):

              data = graphql_request(
                  CONTRIBUTION_QUERY,
                  {
                      "login": USERNAME,
                      "from": start_datetime,
                      "to": end_datetime
                  }
              )


              user = data.get(
                  "user"
              )


              if user is None:

                  raise RuntimeError(
                      f"GitHub user '{USERNAME}' "
                      "could not be found through GraphQL."
                  )


              collection = user.get(
                  "contributionsCollection"
              )


              if collection is None:

                  raise RuntimeError(
                      "GitHub returned no contributionsCollection."
                  )


              return collection


          # ============================================================
          # LAST 365 DAYS
          # ============================================================

          print("")
          print("Collecting 365-day contribution data...")


          rolling_start = (
              now_utc -
              timedelta(days=365)
          )


          rolling_end = now_utc


          contributions = get_contribution_data(
              rolling_start.isoformat(),
              rolling_end.isoformat()
          )


          calendar = contributions.get(
              "contributionCalendar"
          )


          if calendar is None:

              raise RuntimeError(
                  "GitHub contribution calendar is missing."
              )


          total_contributions = int(
              calendar.get(
                  "totalContributions",
                  0
              )
          )


          commits = int(
              contributions.get(
                  "totalCommitContributions",
                  0
              )
          )


          prs = int(
              contributions.get(
                  "totalPullRequestContributions",
                  0
              )
          )


          issue_contributions = int(
              contributions.get(
                  "totalIssueContributions",
                  0
              )
          )


          repository_contributions = int(
              contributions.get(
                  "totalRepositoryContributions",
                  0
              )
          )


          # ============================================================
          # CONTRIBUTION DAYS
          # ============================================================

          contribution_days = []


          for week in calendar.get(
              "weeks",
              []
          ):

              for day in week.get(
                  "contributionDays",
                  []
              ):

                  contribution_days.append(
                      day
                  )


          contribution_days.sort(
              key=lambda item: item["date"]
          )


          contribution_lookup = {

              day["date"]:
              int(
                  day.get(
                      "contributionCount",
                      0
                  )
              )

              for day in contribution_days

          }


          # ============================================================
          # EXACT 365-DAY DATASET
          # ============================================================

          exact_start_date = (
              now_ist.date() -
              timedelta(days=364)
          )


          exact_end_date = now_ist.date()


          exact_dates = [

              exact_start_date +
              timedelta(days=i)

              for i in range(365)

          ]


          exact_daily_values = [

              contribution_lookup.get(
                  current_date.strftime(
                      "%Y-%m-%d"
                  ),
                  0
              )

              for current_date in exact_dates

          ]


          # ============================================================
          # REPOSITORY METRICS
          # ============================================================

          repository_count = len(
              repositories
          )


          public_repositories = sum(

              1

              for repo in repositories

              if not repo.get(
                  "private",
                  False
              )

          )


          private_repositories = (
              repository_count -
              public_repositories
          )


          total_stars = sum(

              int(
                  repo.get(
                      "stargazers_count",
                      0
                  )
              )

              for repo in repositories

          )


          total_forks = sum(

              int(
                  repo.get(
                      "forks_count",
                      0
                  )
              )

              for repo in repositories

          )


          total_watchers = sum(

              int(
                  repo.get(
                      "watchers_count",
                      0
                  )
              )

              for repo in repositories

          )


          # ============================================================
          # LANGUAGE ANALYSIS
          # ============================================================

          languages = Counter()


          for repo in repositories:

              language = repo.get(
                  "language"
              )


              if language:

                  languages[
                      language
                  ] += 1


          # ============================================================
          # TOPICS
          # ============================================================

          topics = Counter()


          for repo in repositories:

              for topic in repo.get(
                  "topics",
                  []
              ):

                  topics[
                      topic.lower()
                  ] += 1


          # ============================================================
          # STREAK ANALYSIS
          # ============================================================

          active_dates = [

              day["date"]

              for day in contribution_days

              if int(
                  day.get(
                      "contributionCount",
                      0
                  )
              ) > 0

          ]


          current_streak = 0


          if active_dates:

              latest_date_obj = datetime.strptime(
                  max(active_dates),
                  "%Y-%m-%d"
              ).date()


              today_date = now_ist.date()


              if latest_date_obj in (

                  today_date,

                  today_date -
                  timedelta(days=1)

              ):

                  cursor = latest_date_obj


                  while True:

                      date_string = cursor.strftime(
                          "%Y-%m-%d"
                      )


                      if contribution_lookup.get(
                          date_string,
                          0
                      ) <= 0:

                          break


                      current_streak += 1


                      cursor -= timedelta(
                          days=1
                      )


          longest_streak = 0
          running_streak = 0


          for day in exact_daily_values:

              if day > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:

                  running_streak = 0


          active_days = sum(

              1

              for value in exact_daily_values

              if value > 0

          )


          total_days = len(
              exact_daily_values
          )


          consistency = (

              active_days /
              total_days *
              100

              if total_days

              else 0

          )


          # ============================================================
          # MONTHLY CONTRIBUTIONS
          # ============================================================

          monthly_activity = Counter()


          for date_string, value in zip(
              [
                  current_date.strftime(
                      "%Y-%m-%d"
                  )
                  for current_date in exact_dates
              ],
              exact_daily_values
          ):

              year = int(
                  date_string[:4]
              )


              if year == current_year:

                  month = int(
                      date_string[5:7]
                  )

                  monthly_activity[
                      month
                  ] += value


          month_labels = [

              "JAN",
              "FEB",
              "MAR",
              "APR",
              "MAY",
              "JUN",
              "JUL",
              "AUG",
              "SEP",
              "OCT",
              "NOV",
              "DEC"

          ]


          current_month = now_ist.month


          month_values = [

              monthly_activity.get(
                  month,
                  0
              )

              if month <= current_month

              else 0

              for month in range(
                  1,
                  13
              )

          ]


          # ============================================================
          # MONTHLY COMMIT DATA
          # ============================================================

          commit_month_values = []


          for month in range(
              1,
              current_month + 1
          ):

              month_start = datetime(
                  current_year,
                  month,
                  1,
                  tzinfo=timezone.utc
              )


              if month == 12:

                  month_end = datetime(
                      current_year + 1,
                      1,
                      1,
                      tzinfo=timezone.utc
                  )

              else:

                  month_end = datetime(
                      current_year,
                      month + 1,
                      1,
                      tzinfo=timezone.utc
                  )


              month_end = min(
                  month_end,
                  now_utc
              )


              if month_start >= month_end:

                  commit_month_values.append(
                      0
                  )

                  continue


              month_data = get_contribution_data(
                  month_start.isoformat(),
                  month_end.isoformat()
              )


              commit_month_values.append(
                  int(
                      month_data.get(
                          "totalCommitContributions",
                          0
                      )
                  )
              )


          while len(
              commit_month_values
          ) < 12:

              commit_month_values.append(
                  0
              )


          # ============================================================
          # WEEKDAY ACTIVITY
          # ============================================================

          weekday_values = [
              0
          ] * 7


          for current_date, value in zip(
              exact_dates,
              exact_daily_values
          ):

              weekday_values[
                  current_date.weekday()
              ] += value


          weekday_names = [

              "MON",
              "TUE",
              "WED",
              "THU",
              "FRI",
              "SAT",
              "SUN"

          ]


          # ============================================================
          # FOUR-YEAR ACTIVITY
          # ============================================================

          yearly_values = []


          for year in range(
              current_year - 3,
              current_year + 1
          ):

              year_start = datetime(
                  year,
                  1,
                  1,
                  tzinfo=timezone.utc
              )


              year_end = datetime(
                  year + 1,
                  1,
                  1,
                  tzinfo=timezone.utc
              )


              if year == current_year:

                  year_end = min(
                      year_end,
                      now_utc
                  )


              if year_start >= year_end:

                  value = 0

              else:

                  year_data = get_contribution_data(
                      year_start.isoformat(),
                      year_end.isoformat()
                  )


                  value = int(
                      year_data[
                          "contributionCalendar"
                      ].get(
                          "totalContributions",
                          0
                      )
                  )


              yearly_values.append(
                  (
                      year,
                      value
                  )
              )


          # ============================================================
          # MOST ACTIVE MONTH
          # ============================================================

          if any(month_values):

              active_month_index = int(
                  np.argmax(
                      month_values
                  )
              )


              most_active_month = (
                  month_labels[
                      active_month_index
                  ]
              )


              most_active_month_value = (
                  month_values[
                      active_month_index
                  ]
              )

          else:

              most_active_month = "N/A"
              most_active_month_value = 0


          # ============================================================
          # MOST ACTIVE WEEKDAY
          # ============================================================

          if any(weekday_values):

              active_day_index = int(
                  np.argmax(
                      weekday_values
                  )
              )


              most_active_weekday = (
                  weekday_names[
                      active_day_index
                  ]
              )


              most_active_weekday_value = (
                  weekday_values[
                      active_day_index
                  ]
              )

          else:

              most_active_weekday = "N/A"
              most_active_weekday_value = 0


          # ============================================================
          # 01. BAR CHART
          # ============================================================

          labels = [

              "COMMITS",
              "CONTRIB.",
              "PULL REQUESTS",
              "ISSUES",
              "REPOS",
              "STARS"

          ]


          values = [

              commits,
              total_contributions,
              prs,
              issue_contributions,
              repository_count,
              total_stars

          ]


          colors = [

              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
              BLUE_LIGHT,
              VIOLET_LIGHT

          ]


          fig, ax = plt.subplots(
              figsize=(15, 5.5)
          )


          clean_axis(ax)


          x = np.arange(
              len(labels)
          )


          bars = ax.bar(
              x,
              values,
              width=0.60,
              color=colors,
              alpha=0.95
          )


          for index, (
              bar,
              value
          ) in enumerate(
              zip(
                  bars,
                  values
              )
          ):

              add_value(
                  ax,
                  bar.get_x() +
                  bar.get_width() / 2,
                  bar.get_height(),
                  value,
                  colors[index]
              )


          ax.set_xticks(x)


          ax.set_xticklabels(
              labels,
              fontsize=8
          )


          ax.set_yticks([])


          add_header(
              ax,
              "GITHUB ACTIVITY BAR MATRIX",
              "CHART://BAR"
          )


          save_chart(
              "github-bar-chart"
          )


          # ============================================================
          # 02. LINE GRAPH
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(15, 5)
          )


          clean_axis(ax)


          x = np.arange(
              1,
              len(exact_daily_values) + 1
          )


          y = np.array(
              exact_daily_values,
              dtype=float
          )


          ax.plot(
              x,
              y,
              color=ELECTRIC_BLUE,
              linewidth=2
          )


          ax.fill_between(
              x,
              y,
              0,
              color=ELECTRIC_BLUE,
              alpha=0.08
          )


          if len(y) > 0:

              peak = int(
                  np.argmax(y)
              )


              ax.scatter(
                  [x[peak]],
                  [y[peak]],
                  color=HOT_MAGENTA,
                  s=55,
                  zorder=5
              )


              ax.annotate(
                  f"{int(y[peak]):,}",
                  (
                      x[peak],
                      y[peak]
                  ),
                  xytext=(0, 10),
                  textcoords="offset points",
                  ha="center",
                  color=HOT_MAGENTA,
                  fontweight="bold",
                  family="monospace"
              )


          ax.set_xticks([])
          ax.set_yticks([])


          add_header(
              ax,
              "365-DAY CONTRIBUTION VELOCITY",
              "CHART://LINE"
          )


          save_chart(
              "github-line-graph"
          )


          # ============================================================
          # 03. PIE CHART
          # ============================================================

          pie_labels = [

              "COMMITS",
              "PULL REQUESTS",
              "ISSUES",
              "REPOSITORY CONTRIBUTIONS"

          ]


          pie_values = [

              commits,
              prs,
              issue_contributions,
              repository_contributions

          ]


          pie_colors = [

              ELECTRIC_BLUE,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
              ACID_GREEN

          ]


          if sum(pie_values) <= 0:

              pie_values = [
                  1,
                  1,
                  1,
                  1
              ]


          fig, ax = plt.subplots(
              figsize=(8, 7)
          )


          ax.set_facecolor(
              "none"
          )


          wedges, texts = ax.pie(

              pie_values,

              colors=pie_colors,

              startangle=90,

              wedgeprops={
                  "linewidth": 1.5,
                  "edgecolor": ICE_WHITE,
                  "alpha": 0.92
              }

          )


          for text in texts:

              text.set_color(
                  ICE_WHITE
              )

              text.set_fontsize(8)


          ax.set_title(
              "SELECTED CONTRIBUTION CATEGORIES",
              fontsize=16,
              fontweight="bold",
              color=ELECTRIC_BLUE,
              pad=20
          )


          ax.legend(
              wedges,
              pie_labels,
              loc="lower center",
              bbox_to_anchor=(0.5, -0.08),
              ncol=2,
              frameon=False,
              fontsize=7
          )


          save_chart(
              "github-pie-chart"
          )


          # ============================================================
          # 04. HISTOGRAM
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(14, 5)
          )


          clean_axis(ax)


          histogram_values = [

              value

              for value in exact_daily_values

              if value > 0

          ]


          if histogram_values:

              unique_count = len(
                  set(
                      histogram_values
                  )
              )


              bins = min(
                  15,
                  max(
                      5,
                      unique_count
                  )
              )


              ax.hist(

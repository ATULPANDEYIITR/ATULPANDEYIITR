              figsize=(15, 4.5)
          )


          clean_axis(ax)


          maximum = max(
              1,
              float(
                  np.max(
                      heat_matrix
                  )
              )
          )


          for y_position in range(7):

              for x_position in range(
                  heat_weeks
              ):

                  current_date = (

                      first_sunday +

                      timedelta(
                          days=(
                              x_position * 7 +
                              y_position
                          )
                      )

                  )


                  if (

                      current_date <
                      exact_start_date

                      or

                      current_date >
                      exact_end_date

                  ):

                      continue


                  value = heat_matrix[
                      y_position,
                      x_position
                  ]



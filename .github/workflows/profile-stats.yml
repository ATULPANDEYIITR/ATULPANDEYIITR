          last_date = exact_end_date


          total_heat_days = (
              last_date -
              first_sunday
          ).days + 1


          heat_weeks = int(
              np.ceil(
                  total_heat_days / 7
              )
          )


          heat_matrix = np.zeros(
              (
                  7,
                  heat_weeks
              )
          )


          for week in range(
              heat_weeks
          ):

              for weekday in range(7):

                  current_date = (

                      first_sunday +

                      timedelta(
                          days=(
                              week * 7 +
                              weekday
                          )
                      )

                  )


                  date_string = (
                      current_date.strftime(
                          "%Y-%m-%d"
                      )
                  )


                  heat_matrix[
                      weekday,
                      week
                  ] = contribution_lookup.get(
                      date_string,
                      0
                  )



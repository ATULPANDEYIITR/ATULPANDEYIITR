          def make_treemap(data):
              languages = data["languages"]

              if not languages:
                  languages = {"No language data": 1}

              items = sorted(
                  languages.items(),
                  key=lambda item: item[1],
                  reverse=True,
              )[:12]

              total = sum(value for _, value in items)

              fig, ax = plt.subplots(figsize=(16, 8))

              fig.patch.set_alpha(0)
              ax.set_xlim(0, 100)
              ax.set_ylim(0, 100)
              ax.axis("off")

              x = 0
              y = 0
              row_height = 100

              for index, (language, value) in enumerate(items):
                  fraction = value / max(total, 1)

                  width = max(
                      8,
                      fraction * 100,
                  )

                  if x + width > 100:
                      x = 0
                      y += row_height * 0.35
                      row_height *= 0.65

                  height = row_height

                  rect = FancyBboxPatch(
                      (x + 0.7, y + 0.7),
                      width - 1.2,
                      height - 1.2,
                      boxstyle="round,pad=0.01,rounding_size=1.5",
                      facecolor=COLORS[index % len(COLORS)],
                      edgecolor="none",
                      alpha=0.82,
                  )

                  ax.add_patch(rect)

                  ax.text(
                      x + width / 2,
                      y + height / 2,
                      f"{language}\n{value}",
                      ha="center",
                      va="center",
                      color=ICE_WHITE,
                      fontsize=18,
                      fontweight="bold",
                  )

                  x += width

              ax.text(
                  50,
                  103,
                  "LANGUAGE TREEMAP",
                  ha="center",
                  va="bottom",
                  fontsize=29,
                  color=ELECTRIC_BLUE,
                  fontweight="bold",
              )


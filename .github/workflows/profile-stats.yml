name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  # 9:47 PM IST = 16:17 UTC
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests matplotlib numpy

      - name: Generate GitHub Activity Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR
        run: |
          set -euo pipefail

          cat > generate_profile.py <<'PYTHON'
          import os
          import math
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import requests
          import numpy as np

          import matplotlib
          matplotlib.use("Agg")

          import matplotlib.pyplot as plt
          from matplotlib.patches import FancyBboxPatch, Rectangle
          from matplotlib.path import Path as MplPath
          from matplotlib.patches import PathPatch


          # ============================================================
          # BASIC CONFIGURATION
          # ============================================================

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          REST_URL = "https://api.github.com"
          GRAPHQL_URL = "https://api.github.com/graphql"

          OUTPUT_DIR = Path("assets")
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }


          # ============================================================
          # COLORS
          # ============================================================

          ELECTRIC_BLUE = "#0057FF"
          ACID_GREEN = "#39FF14"
          ELECTRIC_VIOLET = "#8A2BE2"
          HOT_MAGENTA = "#FF007F"

          ICE_WHITE = "#E8F1FF"
          STEEL_GREY = "#7B8CA8"

          BLUE_LIGHT = "#3D7BFF"
          GREEN_LIGHT = "#7CFF5B"
          VIOLET_LIGHT = "#B266FF"
          MAGENTA_LIGHT = "#FF4DA6"

          DARK_CELL = "#25314A"


          # ============================================================
          # FONT SIZES
          # ============================================================

          TITLE_SIZE = 24
          SUBTITLE_SIZE = 15
          LABEL_SIZE = 14
          TICK_SIZE = 13
          VALUE_SIZE = 18
          LARGE_VALUE_SIZE = 24
          HUGE_VALUE_SIZE = 32
          LEGEND_SIZE = 13
          HEATMAP_SIZE = 12


          # ============================================================
          # MATPLOTLIB SETTINGS
          # ============================================================

          plt.rcParams.update({
              "font.family": "DejaVu Sans",
              "font.size": TICK_SIZE,
              "axes.titlesize": TITLE_SIZE,
              "axes.labelsize": LABEL_SIZE,
              "xtick.labelsize": TICK_SIZE,
              "ytick.labelsize": TICK_SIZE,
              "legend.fontsize": LEGEND_SIZE,
              "figure.dpi": 180,
              "savefig.dpi": 180,
          })


          # ============================================================
          # API HELPERS
          # ============================================================

          def github_rest(url, params=None):
              response = requests.get(
                  url,
                  headers=HEADERS,
                  params=params,
                  timeout=30,
              )

              if not response.ok:
                  print("")
                  print("GITHUB REST API ERROR")
                  print("HTTP:", response.status_code)
                  print(response.text)
                  print("")
                  response.raise_for_status()

              return response.json()


          def github_graphql(query, variables):
              response = requests.post(
                  GRAPHQL_URL,
                  headers=HEADERS,
                  json={
                      "query": query,
                      "variables": variables,
                  },
                  timeout=30,
              )

              if not response.ok:
                  print("")
                  print("GITHUB GRAPHQL HTTP ERROR")
                  print("HTTP:", response.status_code)
                  print(response.text)
                  print("")
                  response.raise_for_status()

              payload = response.json()

              if payload.get("errors"):
                  print("")
                  print("GITHUB GRAPHQL API ERROR")

                  for error in payload["errors"]:
                      print(error)

                  print("")

                  raise RuntimeError(
                      "GitHub GraphQL returned errors."
                  )

              if "data" not in payload:
                  raise RuntimeError(
                      "GitHub GraphQL returned no data."
                  )

              return payload["data"]


          def integer(value):
              try:
                  return int(value or 0)
              except Exception:
                  return 0


          def number(value):
              return f"{int(value):,}"


          # ============================================================
          # GRAPHQL QUERY
          # ============================================================

          CONTRIBUTION_QUERY = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(
                from: $from,
                to: $to
              ) {
                totalContributions
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalRepositoryContributions

                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """


          def contribution_data(start_time, end_time):

              data = github_graphql(
                  CONTRIBUTION_QUERY,
                  {
                      "login": USERNAME,
                      "from": start_time.isoformat(),
                      "to": end_time.isoformat(),
                  },
              )

              user = data.get("user")

              if not user:
                  raise RuntimeError(
                      f"GitHub user '{USERNAME}' was not found."
                  )

              collection = user["contributionsCollection"]

              days = []

              calendar = collection.get(
                  "contributionCalendar",
                  {},
              )

              for week in calendar.get(
                  "weeks",
                  [],
              ):
                  for day in week.get(
                      "contributionDays",
                      [],
                  ):
                      days.append({
                          "date": day["date"],
                          "count": integer(
                              day["contributionCount"]
                          ),
                      })

              return {
                  "total": integer(
                      collection.get(
                          "totalContributions"
                      )
                  ),
                  "commits": integer(
                      collection.get(
                          "totalCommitContributions"
                      )
                  ),
                  "issues": integer(
                      collection.get(
                          "totalIssueContributions"
                      )
                  ),
                  "pull_requests": integer(
                      collection.get(
                          "totalPullRequestContributions"
                      )
                  ),
                  "repositories": integer(
                      collection.get(
                          "totalRepositoryContributions"
                      )
                  ),
                  "days": days,
              }


          # ============================================================
          # CURRENT 365 DAYS
          # ============================================================

          now = datetime.now(timezone.utc)

          start = now - timedelta(days=365)

          current = contribution_data(
              start,
              now,
          )

          today = now.date()

          first_day = today - timedelta(days=364)

          raw_days = {}

          for item in current["days"]:
              day = datetime.fromisoformat(
                  item["date"]
              ).date()

              raw_days[day] = item["count"]


          dates = []

          for i in range(365):
              dates.append(
                  first_day + timedelta(days=i)
              )


          daily = [
              raw_days.get(day, 0)
              for day in dates
          ]


          # ============================================================
          # MONTHLY DATA
          # ============================================================

          monthly = [0] * 12

          for day, value in zip(
              dates,
              daily,
          ):
              if day.year == today.year:
                  monthly[day.month - 1] += value


          # ============================================================
          # WEEKDAY DATA
          # ============================================================

          weekdays = [0] * 7

          for day, value in zip(
              dates,
              daily,
          ):
              weekdays[day.weekday()] += value


          weekday_names = [
              "Mon",
              "Tue",
              "Wed",
              "Thu",
              "Fri",
              "Sat",
              "Sun",
          ]


          # ============================================================
          # STREAK DATA
          # ============================================================

          active_days = sum(
              1 for value in daily
              if value > 0
          )


          current_streak = 0

          check_day = today

          if raw_days.get(
              check_day,
              0,
          ) == 0:
              check_day -= timedelta(days=1)

          while raw_days.get(
              check_day,
              0,
          ) > 0:

              current_streak += 1

              check_day -= timedelta(days=1)


          longest_streak = 0
          running = 0

          for value in daily:

              if value > 0:
                  running += 1

                  if running > longest_streak:
                      longest_streak = running

              else:
                  running = 0


          # ============================================================
          # YEARLY DATA
          # ============================================================

          yearly = []

          for year in range(
              today.year - 3,
              today.year + 1,
          ):

              year_start = datetime(
                  year,
                  1,
                  1,
                  tzinfo=timezone.utc,
              )

              if year == today.year:

                  year_end = now

              else:

                  year_end = datetime(
                      year + 1,
                      1,
                      1,
                      tzinfo=timezone.utc,
                  ) - timedelta(
                      seconds=1
                  )

              try:

                  result = contribution_data(
                      year_start,
                      year_end,
                  )

                  yearly.append(
                      (
                          year,
                          result["total"],
                      )
                  )

              except Exception as error:

                  print(
                      f"Year {year} failed: {error}"
                  )

                  yearly.append(
                      (
                          year,
                          0,
                      )
                  )


          # ============================================================
          # REPOSITORIES
          # ============================================================

          repositories = github_rest(
              f"{REST_URL}/users/{USERNAME}/repos",
              params={
                  "per_page": 100,
                  "sort": "updated",
              },
          )


          language_counts = {}

          for repository in repositories:

              if repository.get(
                  "fork",
                  False,
              ):
                  continue

              language = repository.get(
                  "language"
              )

              if language:

                  language_counts[language] = (
                      language_counts.get(
                          language,
                          0,
                      ) + 1
                  )


          if not language_counts:

              language_counts = {
                  "Python": 1,
                  "Other": 1,
              }


          # ============================================================
          # COMMON METRICS
          # ============================================================

          metric_names = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Repositories",
          ]

          metric_values = [
              current["commits"],
              current["pull_requests"],
              current["issues"],
              current["repositories"],
          ]

          metric_colors = [
              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
          ]


          # ============================================================
          # IMAGE SAVE FUNCTION
          # ============================================================

          def save(fig, filename):

              path = OUTPUT_DIR / filename

              fig.patch.set_alpha(0)

              fig.savefig(
                  path,
                  transparent=True,
                  dpi=180,
                  bbox_inches="tight",
                  pad_inches=0.25,
              )

              plt.close(fig)

              print(
                  f"CREATED: {path}"
              )


          def style(ax):

              ax.set_facecolor("none")

              for spine in ax.spines.values():
                  spine.set_visible(False)

              ax.tick_params(
                  colors=STEEL_GREY,
                  labelsize=TICK_SIZE,
                  length=0,
              )


          def title(
              ax,
              main,
              subtitle=None,
          ):

              ax.set_title(
                  main,
                  fontsize=TITLE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
                  pad=22,
              )

              if subtitle:

                  ax.text(
                      0.5,
                      1.015,
                      subtitle,
                      transform=ax.transAxes,
                      ha="center",
                      va="bottom",
                      fontsize=SUBTITLE_SIZE,
                      color=STEEL_GREY,
                  )


          # ============================================================
          # 1. BAR CHART
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          positions = np.arange(
              len(metric_names)
          )

          bars = ax.bar(
              positions,
              metric_values,
              width=0.60,
              color=metric_colors,
          )

          title(
              ax,
              "GITHUB CONTRIBUTION ACTIVITY",
              "Rolling 365-day activity",
          )

          ax.set_xticks(
              positions
          )

          ax.set_xticklabels(
              metric_names,
              fontsize=LABEL_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          ax.set_ylabel(
              "Count",
              fontsize=LABEL_SIZE,
              color=STEEL_GREY,
          )

          style(ax)

          maximum = max(
              metric_values + [1]
          )

          for bar, value in zip(
              bars,
              metric_values,
          ):

              ax.text(
                  bar.get_x()
                  + bar.get_width() / 2,
                  bar.get_height()
                  + maximum * 0.035,
                  number(value),
                  ha="center",
                  va="bottom",
                  fontsize=LARGE_VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              maximum * 1.25,
          )

          save(
              fig,
              "github-bar-chart.png",
          )


          # ============================================================
          # 2. LINE GRAPH
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          months = np.arange(
              1,
              13,
          )

          ax.plot(
              months,
              monthly,
              color=ELECTRIC_BLUE,
              linewidth=4,
              marker="o",
              markersize=10,
          )

          title(
              ax,
              "MONTHLY CONTRIBUTION MOMENTUM",
              "Current calendar year",
          )

          ax.set_xticks(months)

          ax.set_xticklabels(
              [
                  "Jan",
                  "Feb",
                  "Mar",
                  "Apr",
                  "May",
                  "Jun",
                  "Jul",
                  "Aug",
                  "Sep",
                  "Oct",
                  "Nov",
                  "Dec",
              ],
              fontsize=LABEL_SIZE,
              color=ICE_WHITE,
          )

          style(ax)

          maximum = max(
              monthly + [1]
          )

          for x, value in zip(
              months,
              monthly,
          ):

              ax.annotate(
                  number(value),
                  (
                      x,
                      value,
                  ),
                  xytext=(
                      0,
                      15,
                  ),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              maximum * 1.30,
          )

          save(
              fig,
              "github-line-graph.png",
          )


          # ============================================================
          # 3. PIE CHART
          # ============================================================

          values = np.array(
              metric_values,
              dtype=float,
          )

          if values.sum() == 0:
              values = np.ones(4)

          fig, ax = plt.subplots(
              figsize=(10, 8)
          )

          wedges, _, percentage_text = ax.pie(
              values,
              colors=metric_colors,
              startangle=90,
              autopct="%1.0f%%",
              pctdistance=0.68,
              wedgeprops={
                  "linewidth": 2,
                  "edgecolor": "none",
              },
          )

          for text in percentage_text:

              text.set_color(
                  ICE_WHITE
              )

              text.set_fontsize(
                  VALUE_SIZE
              )

              text.set_fontweight(
                  "bold"
              )

          ax.set_title(
              "ACTIVITY SIGNAL DISTRIBUTION",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=22,
          )

          ax.legend(
              wedges,
              [
                  f"{name}: {number(value)}"
                  for name, value in zip(
                      metric_names,
                      metric_values,
                  )
              ],
              loc="lower center",
              bbox_to_anchor=(
                  0.5,
                  -0.12,
              ),
              ncol=2,
              frameon=False,
              fontsize=LEGEND_SIZE,
          )

          save(
              fig,
              "github-pie-chart.png",
          )


          # ============================================================
          # 4. HISTOGRAM
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          bin_count = max(
              5,
              min(
                  20,
                  int(
                      math.sqrt(
                          len(daily)
                      )
                  ),
              ),
          )

          ax.hist(
              daily,
              bins=bin_count,
              color=ELECTRIC_VIOLET,
              alpha=0.90,
              edgecolor="none",
          )

          title(
              ax,
              "DAILY CONTRIBUTION DISTRIBUTION",
              "Frequency across 365 days",
          )

          ax.set_xlabel(
              "Daily contributions",
              fontsize=LABEL_SIZE,
              color=STEEL_GREY,
          )

          ax.set_ylabel(
              "Number of days",
              fontsize=LABEL_SIZE,
              color=STEEL_GREY,
          )

          style(ax)

          save(
              fig,
              "github-histogram.png",
          )


          # ============================================================
          # 5. SCATTER PLOT
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          x = np.arange(
              1,
              8,
          )

          bubble_size = [
              max(
                  150,
                  value * 10 + 150,
              )
              for value in weekdays
          ]

          ax.scatter(
              x,
              weekdays,
              s=bubble_size,
              color=HOT_MAGENTA,
              alpha=0.85,
          )

          title(
              ax,
              "WEEKDAY ACTIVITY PATTERN",
              "Contribution volume by weekday",
          )

          ax.set_xticks(x)

          ax.set_xticklabels(
              weekday_names,
              fontsize=LABEL_SIZE,
              color=ICE_WHITE,
          )

          style(ax)

          maximum = max(
              weekdays + [1]
          )

          for xpos, value in zip(
              x,
              weekdays,
          ):

              ax.annotate(
                  number(value),
                  (
                      xpos,
                      value,
                  ),
                  xytext=(
                      0,
                      16,
                  ),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              maximum * 1.30,
          )

          save(
              fig,
              "github-scatter-plot.png",
          )


          # ============================================================
          # 6. BOX PLOT
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(10, 7)
          )

          ax.boxplot(
              daily if daily else [0],
              patch_artist=True,
              widths=0.45,
              boxprops={
                  "facecolor": "none",
                  "edgecolor": ACID_GREEN,
                  "linewidth": 3,
              },
              whiskerprops={
                  "color": ACID_GREEN,
                  "linewidth": 2,
              },
              capprops={
                  "color": ACID_GREEN,
                  "linewidth": 2,
              },
              medianprops={
                  "color": HOT_MAGENTA,
                  "linewidth": 4,
              },
          )

          title(
              ax,
              "DAILY CONTRIBUTION SPREAD",
              "365-day statistical distribution",
          )

          ax.set_xticks([1])

          ax.set_xticklabels(
              ["Daily activity"],
              fontsize=LABEL_SIZE,
              color=ICE_WHITE,
          )

          style(ax)

          median = int(
              np.median(daily)
          )

          average = int(
              np.mean(daily)
          )

          ax.text(
              0.78,
              0.90,
              f"MEDIAN  {number(median)}",
              transform=ax.transAxes,
              fontsize=VALUE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              ha="center",
          )

          ax.text(
              0.78,
              0.82,
              f"AVERAGE  {number(average)}",
              transform=ax.transAxes,
              fontsize=VALUE_SIZE,
              fontweight="bold",
              color=STEEL_GREY,
              ha="center",
          )

          save(
              fig,
              "github-box-plot.png",
          )


          # ============================================================
          # 7. AREA CHART
          # ============================================================

          cumulative = np.cumsum(
              monthly
          )

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          ax.fill_between(
              months,
              cumulative,
              color=ELECTRIC_BLUE,
              alpha=0.25,
          )

          ax.plot(
              months,
              cumulative,
              color=ELECTRIC_BLUE,
              linewidth=4,
              marker="o",
              markersize=9,
          )

          title(
              ax,
              "CUMULATIVE CONTRIBUTION GROWTH",
              "Current calendar year",
          )

          ax.set_xticks(months)

          ax.set_xticklabels(
              [
                  "Jan",
                  "Feb",
                  "Mar",
                  "Apr",
                  "May",
                  "Jun",
                  "Jul",
                  "Aug",
                  "Sep",
                  "Oct",
                  "Nov",
                  "Dec",
              ],
              fontsize=LABEL_SIZE,
              color=ICE_WHITE,
          )

          style(ax)

          maximum = max(
              list(cumulative) + [1]
          )

          for xpos, value in zip(
              months,
              cumulative,
          ):

              ax.annotate(
                  number(value),
                  (
                      xpos,
                      value,
                  ),
                  xytext=(
                      0,
                      15,
                  ),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              maximum * 1.28,
          )

          save(
              fig,
              "github-area-chart.png",
          )


          # ============================================================
          # 8. BUBBLE CHART
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          sizes = [
              max(
                  180,
                  value * 14 + 180,
              )
              for value in monthly
          ]

          ax.scatter(
              months,
              monthly,
              s=sizes,
              color=ACID_GREEN,
              alpha=0.72,
          )

          title(
              ax,
              "MONTHLY ACTIVITY BUBBLE MAP",
              "Bubble size represents contribution volume",
          )

          ax.set_xticks(months)

          ax.set_xticklabels(
              [
                  "Jan",
                  "Feb",
                  "Mar",
                  "Apr",
                  "May",
                  "Jun",
                  "Jul",
                  "Aug",
                  "Sep",
                  "Oct",
                  "Nov",
                  "Dec",
              ],
              fontsize=LABEL_SIZE,
              color=ICE_WHITE,
          )

          style(ax)

          maximum = max(
              monthly + [1]
          )

          for xpos, value in zip(
              months,
              monthly,
          ):

              ax.annotate(
                  number(value),
                  (
                      xpos,
                      value,
                  ),
                  xytext=(
                      0,
                      17,
                  ),
                  textcoords="offset points",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_ylim(
              0,
              maximum * 1.35,
          )

          save(
              fig,
              "github-bubble-chart.png",
          )


          # ============================================================
          # 9. HEATMAP
          # ============================================================

          heat_start = first_day - timedelta(
              days=(
                  first_day.weekday() + 1
              ) % 7
          )

          heat_end = today + timedelta(
              days=(
                  6 - (
                      (
                          today.weekday() + 1
                      ) % 7
                  )
              )
          )

          total_days = (
              heat_end - heat_start
          ).days + 1

          week_count = (
              total_days // 7
          )

          fig, ax = plt.subplots(
              figsize=(15, 6)
          )

          maximum = max(
              daily + [1]
          )

          for index in range(
              total_days
          ):

              current_day = (
                  heat_start
                  + timedelta(days=index)
              )

              week = index // 7

              row = (
                  current_day.weekday() + 1
              ) % 7

              value = raw_days.get(
                  current_day,
                  0,
              )

              if value == 0:

                  color = DARK_CELL

              else:

                  ratio = (
                      value / maximum
                  )

                  if ratio < 0.25:
                      color = BLUE_LIGHT

                  elif ratio < 0.50:
                      color = ELECTRIC_BLUE

                  elif ratio < 0.75:
                      color = ELECTRIC_VIOLET

                  else:
                      color = ACID_GREEN

              ax.scatter(
                  week,
                  row,
                  s=190,
                  marker="s",
                  color=color,
              )

          title(
              ax,
              "365-DAY CONTRIBUTION HEATMAP",
              "Daily contribution intensity",
          )

          ax.set_xlim(
              -1,
              week_count,
          )

          ax.set_ylim(
              -1,
              7,
          )

          ax.set_yticks(
              range(7)
          )

          ax.set_yticklabels(
              [
                  "Sun",
                  "Mon",
                  "Tue",
                  "Wed",
                  "Thu",
                  "Fri",
                  "Sat",
              ],
              fontsize=HEATMAP_SIZE,
              color=ICE_WHITE,
          )

          ax.set_xticks([])

          style(ax)

          save(
              fig,
              "github-heatmap.png",
          )


          # ============================================================
          # 10. DONUT CHART
          # ============================================================

          values = np.array(
              metric_values,
              dtype=float,
          )

          if values.sum() == 0:
              values = np.ones(4)

          fig, ax = plt.subplots(
              figsize=(10, 8)
          )

          wedges, _, texts = ax.pie(
              values,
              colors=metric_colors,
              startangle=90,
              autopct="%1.0f%%",
              pctdistance=0.80,
              wedgeprops={
                  "width": 0.38,
                  "linewidth": 2,
                  "edgecolor": "none",
              },
          )

          for text in texts:

              text.set_color(
                  ICE_WHITE
              )

              text.set_fontsize(
                  VALUE_SIZE
              )

              text.set_fontweight(
                  "bold"
              )

          ax.text(
              0,
              0.08,
              number(current["total"]),
              ha="center",
              va="center",
              fontsize=HUGE_VALUE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          ax.text(
              0,
              -0.15,
              "TOTAL",
              ha="center",
              va="center",
              fontsize=SUBTITLE_SIZE,
              fontweight="bold",
              color=STEEL_GREY,
          )

          ax.set_title(
              "GITHUB ACTIVITY SIGNALS",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=22,
          )

          save(
              fig,
              "github-donut-chart.png",
          )


          # ============================================================
          # 11. RADAR CHART
          # ============================================================

          radar_labels = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Repositories",
              "Active Days",
          ]

          radar_raw = [
              current["commits"],
              current["pull_requests"],
              current["issues"],
              current["repositories"],
              active_days,
          ]

          radar = np.log1p(
              np.array(
                  radar_raw,
                  dtype=float,
              )
          )

          if radar.max() > 0:
              radar = (
                  radar / radar.max()
              )

          angles = np.linspace(
              0,
              2 * np.pi,
              len(radar_labels),
              endpoint=False,
          ).tolist()

          radar = radar.tolist()

          angles += angles[:1]
          radar += radar[:1]

          fig = plt.figure(
              figsize=(10, 9)
          )

          ax = fig.add_subplot(
              111,
              polar=True,
          )

          ax.plot(
              angles,
              radar,
              color=ELECTRIC_VIOLET,
              linewidth=4,
          )

          ax.fill(
              angles,
              radar,
              color=ELECTRIC_VIOLET,
              alpha=0.25,
          )

          ax.set_xticks(
              angles[:-1]
          )

          ax.set_xticklabels(
              radar_labels,
              fontsize=LABEL_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          ax.set_yticklabels([])

          ax.grid(False)

          ax.spines["polar"].set_visible(False)

          ax.set_title(
              "ACTIVITY PROFILE RADAR",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=35,
          )

          save(
              fig,
              "github-radar-chart.png",
          )


          # ============================================================
          # 12. WATERFALL CHART
          # ============================================================

          years = [
              item[0]
              for item in yearly
          ]

          year_values = [
              item[1]
              for item in yearly
          ]

          changes = []

          previous = 0

          for value in year_values:

              changes.append(
                  value - previous
              )

              previous = value

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          running = 0

          for index, change in enumerate(
              changes
          ):

              bottom = (
                  running
                  if change >= 0
                  else running + change
              )

              color = (
                  ACID_GREEN
                  if change >= 0
                  else HOT_MAGENTA
              )

              ax.bar(
                  index,
                  change,
                  bottom=bottom,
                  width=0.58,
                  color=color,
              )

              running += change

              ax.text(
                  index,
                  running
                  + (
                      0.04
                      * max(
                          abs(
                              max(
                                  changes + [1]
                              )
                          ),
                          1,
                      )
                  ),
                  f"{change:+,}",
                  ha="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          title(
              ax,
              "YEARLY CONTRIBUTION CHANGE",
              "Year-over-year activity movement",
          )

          ax.set_xticks(
              range(len(years))
          )

          ax.set_xticklabels(
              [
                  str(year)
                  for year in years
              ],
              fontsize=LABEL_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          style(ax)

          save(
              fig,
              "github-waterfall-chart.png",
          )


          # ============================================================
          # 13. FUNNEL CHART
          # ============================================================

          funnel_names = [
              "COMMITS",
              "PULL REQUESTS",
              "ISSUES",
              "REPOSITORIES",
          ]

          funnel_values = [
              current["commits"],
              current["pull_requests"],
              current["issues"],
              current["repositories"],
          ]

          maximum = max(
              funnel_values + [1]
          )

          fig, ax = plt.subplots(
              figsize=(11, 8)
          )

          colors = [
              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
          ]

          for index, (
              name,
              value,
              color,
          ) in enumerate(
              zip(
                  funnel_names,
                  funnel_values,
                  colors,
              )
          ):

              width = max(
                  0.22,
                  value / maximum,
              )

              y = (
                  len(
                      funnel_names
                  )
                  - index
                  - 1
              )

              ax.add_patch(
                  Rectangle(
                      (
                          0.5 - width / 2,
                          y,
                      ),
                      width,
                      0.70,
                      facecolor=color,
                      edgecolor="none",
                  )
              )

              ax.text(
                  0.5,
                  y + 0.35,
                  f"{name}    {number(value)}",
                  ha="center",
                  va="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_xlim(
              0,
              1,
          )

          ax.set_ylim(
              -0.25,
              len(funnel_names) + 0.25,
          )

          ax.axis("off")

          ax.set_title(
              "ACTIVITY SIGNAL FUNNEL",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=20,
          )

          save(
              fig,
              "github-funnel-chart.png",
          )


          # ============================================================
          # 14. TREEMAP
          # ============================================================

          language_names = list(
              language_counts.keys()
          )

          language_values = list(
              language_counts.values()
          )

          ordering = np.argsort(
              language_values
          )[::-1]

          language_names = [
              language_names[i]
              for i in ordering
          ]

          language_values = [
              language_values[i]
              for i in ordering
          ]

          total_languages = sum(
              language_values
          )

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          colors = [
              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
              BLUE_LIGHT,
              GREEN_LIGHT,
              VIOLET_LIGHT,
              MAGENTA_LIGHT,
          ]

          cursor = 0

          for index, (
              language,
              value,
          ) in enumerate(
              zip(
                  language_names,
                  language_values,
              )
          ):

              width = (
                  value
                  / total_languages
              )

              ax.add_patch(
                  Rectangle(
                      (
                          cursor,
                          0,
                      ),
                      width,
                      1,
                      facecolor=colors[
                          index
                          % len(colors)
                      ],
                      edgecolor="none",
                  )
              )

              percentage = (
                  value
                  / total_languages
                  * 100
              )

              ax.text(
                  cursor + width / 2,
                  0.56,
                  language,
                  ha="center",
                  va="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

              ax.text(
                  cursor + width / 2,
                  0.30,
                  f"{value}  |  {percentage:.0f}%",
                  ha="center",
                  va="center",
                  fontsize=LABEL_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

              cursor += width

          ax.set_xlim(
              0,
              1,
          )

          ax.set_ylim(
              0,
              1,
          )

          ax.axis("off")

          ax.set_title(
              "REPOSITORY LANGUAGE MAP",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=20,
          )

          save(
              fig,
              "github-treemap.png",
          )


          # ============================================================
          # 15. SANKEY DIAGRAM
          # ============================================================

          source_names = [
              "COMMITS",
              "PULL REQUESTS",
              "ISSUES",
              "REPOSITORIES",
          ]

          source_values = [
              current["commits"],
              current["pull_requests"],
              current["issues"],
              current["repositories"],
          ]

          maximum = max(
              source_values + [1]
          )

          fig, ax = plt.subplots(
              figsize=(13, 8)
          )

          ax.set_xlim(
              0,
              1,
          )

          ax.set_ylim(
              0,
              1,
          )

          ax.axis("off")

          source_y = [
              0.80,
              0.60,
              0.40,
              0.20,
          ]

          colors = [
              ELECTRIC_BLUE,
              ACID_GREEN,
              ELECTRIC_VIOLET,
              HOT_MAGENTA,
          ]

          destination_x = 0.78
          destination_y = 0.30

          ax.add_patch(
              FancyBboxPatch(
                  (
                      destination_x,
                      destination_y,
                  ),
                  0.15,
                  0.40,
                  boxstyle="round,pad=0.02",
                  facecolor=ELECTRIC_VIOLET,
                  edgecolor="none",
              )
          )

          ax.text(
              destination_x + 0.075,
              0.50,
              "GITHUB\nACTIVITY",
              ha="center",
              va="center",
              fontsize=VALUE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
          )

          for index, (
              name,
              value,
              ypos,
              color,
          ) in enumerate(
              zip(
                  source_names,
                  source_values,
                  source_y,
                  colors,
              )
          ):

              source_x = 0.05

              ax.add_patch(
                  FancyBboxPatch(
                      (
                          source_x,
                          ypos - 0.06,
                      ),
                      0.16,
                      0.12,
                      boxstyle="round,pad=0.015",
                      facecolor=color,
                      edgecolor="none",
                  )
              )

              ax.text(
                  source_x + 0.08,
                  ypos,
                  f"{name}\n{number(value)}",
                  ha="center",
                  va="center",
                  fontsize=LABEL_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

              start_x = 0.21
              start_y = ypos

              end_x = destination_x
              end_y = 0.50

              curve = 0.24

              vertices = [
                  (
                      start_x,
                      start_y,
                  ),
                  (
                      start_x + curve,
                      start_y,
                  ),
                  (
                      end_x - curve,
                      end_y,
                  ),
                  (
                      end_x,
                      end_y,
                  ),
              ]

              codes = [
                  MplPath.MOVETO,
                  MplPath.CURVE4,
                  MplPath.CURVE4,
                  MplPath.CURVE4,
              ]

              path = MplPath(
                  vertices,
                  codes,
              )

              patch = PathPatch(
                  path,
                  facecolor="none",
                  edgecolor=color,
                  linewidth=(
                      3
                      + 8
                      * (
                          value
                          / maximum
                      )
                  ),
                  alpha=0.65,
              )

              ax.add_patch(
                  patch
              )

          ax.text(
              0.50,
              0.06,
              "Contribution signals flowing into the GitHub activity system",
              ha="center",
              va="center",
              fontsize=SUBTITLE_SIZE,
              color=STEEL_GREY,
          )

          ax.set_title(
              "GITHUB ACTIVITY FLOW",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=20,
          )

          save(
              fig,
              "github-sankey-diagram.png",
          )


          # ============================================================
          # 16. STREAK SYSTEM
          # ============================================================

          fig, ax = plt.subplots(
              figsize=(12, 6)
          )

          ax.axis("off")

          cards = [
              (
                  "CURRENT STREAK",
                  current_streak,
                  ELECTRIC_BLUE,
              ),
              (
                  "LONGEST STREAK",
                  longest_streak,
                  ACID_GREEN,
              ),
              (
                  "ACTIVE DAYS",
                  active_days,
                  ELECTRIC_VIOLET,
              ),
          ]

          for index, (
              label,
              value,
              color,
          ) in enumerate(
              cards
          ):

              x = (
                  0.06
                  + index * 0.31
              )

              ax.add_patch(
                  FancyBboxPatch(
                      (
                          x,
                          0.18,
                      ),
                      0.27,
                      0.62,
                      boxstyle="round,pad=0.025",
                      facecolor="none",
                      edgecolor=color,
                      linewidth=3,
                  )
              )

              ax.text(
                  x + 0.135,
                  0.63,
                  label,
                  ha="center",
                  va="center",
                  fontsize=LABEL_SIZE,
                  fontweight="bold",
                  color=STEEL_GREY,
              )

              ax.text(
                  x + 0.135,
                  0.40,
                  number(value),
                  ha="center",
                  va="center",
                  fontsize=HUGE_VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_title(
              "GITHUB STREAK SYSTEM",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=20,
          )

          save(
              fig,
              "github-streak-system.png",
          )


          # ============================================================
          # 17. DEVELOPER TELEMETRY
          # ============================================================

          telemetry_names = [
              "TOTAL CONTRIBUTIONS",
              "COMMITS",
              "PULL REQUESTS",
              "ISSUES",
              "REPOSITORIES",
              "ACTIVE DAYS",
          ]

          telemetry_values = [
              current["total"],
              current["commits"],
              current["pull_requests"],
              current["issues"],
              current["repositories"],
              active_days,
          ]

          log_values = np.log1p(
              np.array(
                  telemetry_values,
                  dtype=float,
              )
          )

          if log_values.max() > 0:
              normalized = (
                  log_values
                  / log_values.max()
              )
          else:
              normalized = np.ones(
                  len(log_values)
              )

          fig, ax = plt.subplots(
              figsize=(12, 7)
          )

          for index, (
              label,
              value,
              width,
          ) in enumerate(
              zip(
                  telemetry_names,
                  telemetry_values,
                  normalized,
              )
          ):

              color = metric_colors[
                  index
                  % len(metric_colors)
              ]

              ax.barh(
                  index,
                  width,
                  height=0.52,
                  color=color,
              )

              ax.text(
                  0.02,
                  index,
                  label,
                  transform=ax.get_yaxis_transform(),
                  ha="left",
                  va="center",
                  fontsize=LABEL_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

              ax.text(
                  1.02,
                  index,
                  number(value),
                  transform=ax.get_yaxis_transform(),
                  ha="left",
                  va="center",
                  fontsize=VALUE_SIZE,
                  fontweight="bold",
                  color=ICE_WHITE,
              )

          ax.set_xlim(
              0,
              1.20,
          )

          ax.set_yticks([])

          ax.set_xticks([])

          style(ax)

          ax.set_title(
              "DEVELOPER TELEMETRY",
              fontsize=TITLE_SIZE,
              fontweight="bold",
              color=ICE_WHITE,
              pad=20,
          )

          save(
              fig,
              "github-developer-telemetry.png",
          )


          # ============================================================
          # FINAL SUMMARY
          # ============================================================

          print("")
          print("=" * 70)
          print("GITHUB ACTIVITY DASHBOARD")
          print("=" * 70)
          print(
              f"USER:              {USERNAME}"
          )
          print(
              f"CONTRIBUTIONS:     {number(current['total'])}"
          )
          print(
              f"COMMITS:           {number(current['commits'])}"
          )
          print(
              f"PULL REQUESTS:     {number(current['pull_requests'])}"
          )
          print(
              f"ISSUES:            {number(current['issues'])}"
          )
          print(
              f"REPOSITORIES:      {number(current['repositories'])}"
          )
          print(
              f"ACTIVE DAYS:       {number(active_days)}"
          )
          print(
              f"CURRENT STREAK:    {number(current_streak)}"
          )
          print(
              f"LONGEST STREAK:    {number(longest_streak)}"
          )
          print("=" * 70)
          print("ALL DASHBOARD IMAGES GENERATED SUCCESSFULLY.")
          print("=" * 70)
          print("")

          PYTHON

          echo "Checking Python syntax..."
          python -m py_compile generate_profile.py

          echo "Running dashboard generator..."
          python generate_profile.py

          echo "Checking generated files..."

          test -f assets/github-bar-chart.png
          test -f assets/github-line-graph.png
          test -f assets/github-pie-chart.png
          test -f assets/github-histogram.png
          test -f assets/github-scatter-plot.png
          test -f assets/github-box-plot.png
          test -f assets/github-area-chart.png
          test -f assets/github-bubble-chart.png
          test -f assets/github-heatmap.png
          test -f assets/github-donut-chart.png
          test -f assets/github-radar-chart.png
          test -f assets/github-waterfall-chart.png
          test -f assets/github-funnel-chart.png
          test -f assets/github-treemap.png
          test -f assets/github-sankey-diagram.png
          test -f assets/github-streak-system.png
          test -f assets/github-developer-telemetry.png

          echo "All dashboard files exist."

      - name: Commit updated dashboard images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No dashboard changes detected."
          else
            git commit -m "Update GitHub activity command center"
            git push
          fi

name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "47 21 * * *"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate GitHub profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ATULPANDEYIITR
          cards: "overview,contributions,composition,rhythm,lifetime,repositories,languages"
          output-dir: assets
          themes: "dark,light"
          language-limit: 8
          commit: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests matplotlib

      - name: Generate GitHub Analytics Images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ATULPANDEYIITR
        run: |

          cat > generate_profile.py <<'PYTHON'

          import os
          import requests
          import matplotlib.pyplot as plt
          from collections import Counter
          from datetime import datetime, timezone

          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json"
          }

          os.makedirs("assets", exist_ok=True)

          # ------------------------------------------------
          # GET GITHUB DATA
          # ------------------------------------------------

          QUERY = """
          query($login: String!) {

            user(login: $login) {

              repositories(
                first: 100
                ownerAffiliations: OWNER
                orderBy: {field: UPDATED_AT, direction: DESC}
              ) {

                totalCount

                nodes {

                  name
                  stargazerCount
                  forkCount
                  isFork
                  isPrivate

                  primaryLanguage {
                    name
                  }

                  watchers {
                    totalCount
                  }

                  defaultBranchRef {
                    target {

                      ... on Commit {

                        history(first: 30) {

                          nodes {
                            messageHeadline
                            committedDate
                          }

                        }

                      }

                    }
                  }

                }

              }

              contributionsCollection {

                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                totalRepositoryContributions

                contributionCalendar {

                  totalContributions

                  weeks {

                    contributionDays {

                      contributionCount
                      date

                    }

                  }

                }

              }

              followers {
                totalCount
              }

              following {
                totalCount
              }

              pullRequests(first: 1) {
                totalCount
              }

              issues(first: 1) {
                totalCount
              }

            }

          }
          """

          print("Collecting GitHub data...")

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": QUERY,
                  "variables": {
                      "login": USERNAME
                  }
              },
              headers=HEADERS,
              timeout=30
          )

          response.raise_for_status()

          result = response.json()

          if "errors" in result:
              raise RuntimeError(result["errors"])

          user = result["data"]["user"]

          repositories = user["repositories"]["nodes"]

          contributions = user["contributionsCollection"]

          calendar = contributions["contributionCalendar"]

          # ------------------------------------------------
          # BASIC DATA
          # ------------------------------------------------

          followers = user["followers"]["totalCount"]

          following = user["following"]["totalCount"]

          repository_total = user["repositories"]["totalCount"]

          pull_requests = user["pullRequests"]["totalCount"]

          issues = user["issues"]["totalCount"]

          total_contributions = calendar["totalContributions"]

          commits = contributions[
              "totalCommitContributions"
          ]

          prs = contributions[
              "totalPullRequestContributions"
          ]

          issue_contributions = contributions[
              "totalIssueContributions"
          ]

          repository_contributions = contributions[
              "totalRepositoryContributions"
          ]

          # ------------------------------------------------
          # CONTRIBUTION DAYS
          # ------------------------------------------------

          contribution_days = []

          for week in calendar["weeks"]:

              for day in week["contributionDays"]:

                  contribution_days.append(day)

          contribution_days.sort(
              key=lambda x: x["date"]
          )

          # ------------------------------------------------
          # YEAR
          # ------------------------------------------------

          current_year = datetime.now(
              timezone.utc
          ).year

          # ------------------------------------------------
          # 1. CONTRIBUTION BREAKDOWN
          # ------------------------------------------------

          labels = [
              "Commits",
              "Pull Requests",
              "Issues",
              "Repositories"
          ]

          values = [
              commits,
              prs,
              issue_contributions,
              repository_contributions
          ]

          plt.figure(figsize=(12, 5))

          plt.barh(
              labels,
              values
          )

          plt.title(
              "Contribution Breakdown"
          )

          plt.xlabel(
              "Contribution Count"
          )

          plt.tight_layout()

          plt.savefig(
              "assets/contribution-breakdown.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 2. CONTRIBUTION HEATMAP
          # ------------------------------------------------

          recent_days = contribution_days[-365:]

          matrix = []

          for week in range(53):

              row = []

              for day in range(7):

                  index = (
                      week * 7 +
                      day
                  )

                  if index < len(recent_days):

                      row.append(
                          recent_days[index][
                              "contributionCount"
                          ]
                      )

                  else:

                      row.append(0)

              matrix.append(row)

          plt.figure(figsize=(13, 4))

          plt.imshow(
              matrix,
              aspect="auto"
          )

          plt.title(
              "Contribution Heatmap - Last 365 Days"
          )

          plt.xlabel(
              "Day of Week"
          )

          plt.ylabel(
              "Week"
          )

          plt.tight_layout()

          plt.savefig(
              "assets/contribution-heatmap.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 3. MONTHLY CODING MOMENTUM
          # ------------------------------------------------

          monthly = Counter()

          for day in contribution_days:

              if day["date"].startswith(
                  str(current_year)
              ):

                  month = int(
                      day["date"][5:7]
                  )

                  monthly[month] += (
                      day["contributionCount"]
                  )

          months = list(range(1, 13))

          monthly_values = [
              monthly.get(
                  month,
                  0
              )
              for month in months
          ]

          plt.figure(figsize=(12, 5))

          plt.plot(
              months,
              monthly_values,
              marker="o",
              linewidth=3
          )

          plt.title(
              f"{current_year} Coding Momentum"
          )

          plt.xlabel(
              "Month"
          )

          plt.ylabel(
              "Contributions"
          )

          plt.xticks(
              months
          )

          plt.grid(
              True,
              alpha=0.25
          )

          plt.tight_layout()

          plt.savefig(
              "assets/coding-momentum.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 4. TECHNOLOGY DISTRIBUTION
          # ------------------------------------------------

          languages = Counter()

          for repo in repositories:

              language = repo.get(
                  "primaryLanguage"
              )

              if language:

                  languages[
                      language["name"]
                  ] += 1

          top_languages = (
              languages
              .most_common(10)
          )

          language_names = [
              item[0]
              for item in top_languages
          ]

          language_values = [
              item[1]
              for item in top_languages
          ]

          plt.figure(figsize=(12, 6))

          plt.bar(
              language_names,
              language_values
          )

          plt.title(
              "Technology Distribution Across Repositories"
          )

          plt.xlabel(
              "Programming Language"
          )

          plt.ylabel(
              "Repositories"
          )

          plt.xticks(
              rotation=35,
              ha="right"
          )

          plt.tight_layout()

          plt.savefig(
              "assets/technology-distribution.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 5. REPOSITORY PORTFOLIO
          # ------------------------------------------------

          top_repositories = sorted(
              repositories,
              key=lambda repo: (
                  repo["stargazerCount"]
              ),
              reverse=True
          )[:10]

          repo_names = [
              repo["name"]
              for repo in top_repositories
          ]

          repo_stars = [
              repo["stargazerCount"]
              for repo in top_repositories
          ]

          plt.figure(figsize=(12, 6))

          plt.barh(
              repo_names[::-1],
              repo_stars[::-1]
          )

          plt.title(
              "Repository Portfolio - Stars"
          )

          plt.xlabel(
              "Stars"
          )

          plt.tight_layout()

          plt.savefig(
              "assets/repository-portfolio.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 6. OPEN SOURCE FOOTPRINT
          # ------------------------------------------------

          total_stars = sum(
              repo["stargazerCount"]
              for repo in repositories
          )

          total_forks = sum(
              repo["forkCount"]
              for repo in repositories
          )

          total_watchers = sum(
              repo["watchers"]["totalCount"]
              for repo in repositories
          )

          public_repositories = sum(
              1
              for repo in repositories
              if not repo["isPrivate"]
          )

          original_repositories = sum(
              1
              for repo in repositories
              if not repo["isFork"]
          )

          labels = [
              "Stars",
              "Forks",
              "Watchers",
              "Public Repos",
              "Original Repos"
          ]

          values = [
              total_stars,
              total_forks,
              total_watchers,
              public_repositories,
              original_repositories
          ]

          plt.figure(figsize=(12, 5))

          plt.bar(
              labels,
              values
          )

          plt.title(
              "Open Source Footprint"
          )

          plt.ylabel(
              "Count"
          )

          plt.xticks(
              rotation=20
          )

          plt.tight_layout()

          plt.savefig(
              "assets/open-source-footprint.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 7. YEARLY PROGRESS
          # ------------------------------------------------

          yearly_total = sum(
              day["contributionCount"]
              for day in contribution_days
              if day["date"].startswith(
                  str(current_year)
              )
          )

          active_days = sum(
              1
              for day in contribution_days
              if (
                  day["date"].startswith(
                      str(current_year)
                  )
                  and
                  day["contributionCount"] > 0
              )
          )

          plt.figure(figsize=(12, 5))

          plt.bar(
              [
                  "Contributions",
                  "Active Days",
                  "Repositories"
              ],
              [
                  yearly_total,
                  active_days,
                  repository_total
              ]
          )

          plt.title(
              f"{current_year} Engineering Progress"
          )

          plt.ylabel(
              "Count"
          )

          plt.tight_layout()

          plt.savefig(
              "assets/yearly-engineering-progress.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 8. DEVELOPMENT RHYTHM
          # ------------------------------------------------

          weekday_counts = Counter()

          for day in contribution_days:

              date = datetime.strptime(
                  day["date"],
                  "%Y-%m-%d"
              )

              weekday_counts[
                  date.strftime("%A")
              ] += day["contributionCount"]

          weekday_names = [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
          ]

          weekday_values = [
              weekday_counts.get(
                  day,
                  0
              )
              for day in weekday_names
          ]

          plt.figure(figsize=(12, 5))

          plt.bar(
              weekday_names,
              weekday_values
          )

          plt.title(
              "Development Rhythm"
          )

          plt.xlabel(
              "Day"
          )

          plt.ylabel(
              "Contributions"
          )

          plt.xticks(
              rotation=25
          )

          plt.tight_layout()

          plt.savefig(
              "assets/development-rhythm.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          # ------------------------------------------------
          # 9. PROFILE SNAPSHOT
          # ------------------------------------------------

          plt.figure(figsize=(12, 5))

          labels = [
              "Followers",
              "Following",
              "Repositories",
              "Pull Requests",
              "Issues"
          ]

          values = [
              followers,
              following,
              repository_total,
              pull_requests,
              issues
          ]

          plt.bar(
              labels,
              values
          )

          plt.title(
              "GitHub Profile Snapshot"
          )

          plt.ylabel(
              "Count"
          )

          plt.tight_layout()

          plt.savefig(
              "assets/github-profile-snapshot.png",
              dpi=150,
              bbox_inches="tight"
          )

          plt.close()

          print("")
          print("======================================")
          print(" GitHub Analytics Generated")
          print("======================================")
          print(f"Followers: {followers}")
          print(f"Repositories: {repository_total}")
          print(f"Contributions: {total_contributions}")
          print(f"Stars: {total_stars}")
          print(f"Forks: {total_forks}")
          print(f"Languages: {len(languages)}")
          print(f"{current_year} Contributions: {yearly_total}")
          print("======================================")

          PYTHON

          python generate_profile.py

      - name: Save updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          git diff --cached --quiet || git commit -m "Update GitHub analytics images"

          git push
